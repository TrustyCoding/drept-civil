td,th{border:1px solid var(--bd);padding:7px 9px;vertical-align:top;text-align:left}
th{background:var(--card)}

[1,"Drept subiectiv","Facultatea (prerogativa) recunoscută de dreptul obiectiv unei persoane de a avea o anumită conduită și de a pretinde altora o conduită corespunzătoare, cu ajutorul statului la nevoie. Ex.: vânzătorul pretinde prețul."],
[1,"Drept public / drept privat","Criteriul: calitatea în care intervine statul. **Public** = relațiile în care statul apare ca autoritate, titular al puterii publice. **Privat** = relațiile dintre particulari, pentru interese private."],
[1,"Dreptul civil","Ramura de drept privat care cuprinde normele ce reglementează relațiile sociale **patrimoniale și nepatrimoniale** în care părțile se găsesc pe poziție juridică de egalitate, precum și condiția juridică a subiectelor de drept."],

[1,"Relații patrimoniale / nepatrimoniale","**Patrimoniale**: evaluabile în bani; legate de drepturile reale (proprietate și dezmembrăminte: uzufruct, uz, abitație, servitute, superficie) sau obligaționale (creanță). **Nepatrimoniale**: fără conținut economic: existența și integritatea persoanei, identificarea ei, creația intelectuală."],
[2,"Criteriile de delimitare a dreptului civil","**Obiectul de reglementare** (fundamental, determinant); **metoda** (subsecventă: egalitatea juridică); auxiliare: calitatea subiectelor, caracterul normelor, specificul sancțiunilor, principiile."],
[2,"Profesionist (art. 3 alin. 2–3)","Cel care exploatează o întreprindere, adică exercită sistematic o activitate organizată de producere, administrare ori înstrăinare de bunuri sau de prestare de servicii, cu sau fără scop lucrativ."],
[2,"Normă dispozitivă","Lasă părților stabilirea conduitei. **Permisivă**: permite o conduită, fără s-o impună. **Supletivă**: se aplică numai dacă părțile n-au convenit altfel."],
[2,"Normă imperativă","Obligatorie; părțile nu pot deroga. **Onerativă**: impune o conduită (art. 1673: vânzătorul transmite proprietatea). **Prohibitivă**: interzice (art. 1783: locațiunea nu se încheie pentru mai mult de 49 de ani)."],
[2,"Sancțiunea civilă","Are caracter **reparator**: repararea pagubei și restabilirea situației anterioare. Sancțiunea penală are caracter **punitiv** (pedeapsă)."],
[2,"Element de extraneitate; normă conflictuală","Element străin al raportului (cetățenia unei părți, bunul aflat în străinătate, locul încheierii sau executării). Norma conflictuală indică legea aplicabilă unui astfel de raport (dreptul internațional privat)."],
[2,"Evicțiunea","Pierderea proprietății lucrului, total sau parțial, ori tulburarea cumpărătorului în exercitarea prerogativelor de proprietar."],
[2,"Principiile dreptului civil","Ocrotirea proprietății; egalitatea în fața legii civile (art. 30); îmbinarea intereselor individuale cu cele generale; ocrotirea și garantarea drepturilor subiective; buna-credință (art. 14: drepturile și obligațiile se exercită cu bună-credință, în acord cu ordinea publică și bunele moravuri)."],
[3,"Izvor de drept civil","Forma specifică de exprimare a normelor dreptului civil (sens formal). Sensul material: condițiile materiale de existență care generează normele. Art. 1 alin. 1: legea, uzanțele, principiile generale."],
[3,"Lege lato / stricto sensu","**Lato**: orice act normativ cu dispoziții de drept civil, indiferent de organul emitent și denumire. **Stricto**: doar actele Parlamentului numite „lege”."],
[3,"Lege constituțională, organică, ordinară","Constituțională: Constituția și legile de revizuire. Organică: domenii de maximă importanță; în civil, regimul general al proprietății și moștenirii (art. 73 alin. 3 lit. m). Ordinară: orice altă lege a Parlamentului."],
[3,"HG, ordonanță simplă, OUG","**HG**: organizarea executării legilor. **Ordonanță simplă**: în baza unei legi de abilitare, în domenii care nu țin de legile organice. **OUG**: numai în situații extraordinare, cu motivarea urgenței."],
[3,"Uzanțele","Obiceiul (cutuma) și uzurile profesionale (art. 1 alin. 6). Sunt izvor doar dacă sunt conforme ordinii publice și bunelor moravuri. Se aplică în cazurile neprevăzute de lege; în materiile reglementate, doar dacă legea trimite la ele."],
[3,"Jurisprudența","În principiu nu e izvor: instanțele aplică, nu creează dreptul (art. 5 alin. 4 C.proc.civ.; hotărârea produce efecte doar între părți, art. 435). Excepții: CCR, RIL, hotărâri prealabile, CEDO, CJUE. Doctrina nu e izvor."],
[3,"Codul civil","Codicele civil (1864, în vigoare 1865, după Codul Napoleon). Codul actual: Legea 287/2009, în vigoare la 1 octombrie 2011; Titlul preliminar (art. 1–24) + 7 cărți."],
[4,"Aplicarea legii civile","Transpunerea în practică, în raporturi concrete, a regulilor din norma civilă; se face sub 3 aspecte: în timp, în spațiu, cu privire la persoane."],
[4,"Intrarea în vigoare","Lege și ordonanță simplă: la 3 zile calendaristice de la publicare (expiră la 24:00) sau la dată ulterioară din text. OUG: la publicare, sub condiția depunerii prealabile la Cameră. Alte acte: la publicare."],
[4,"Abrogarea","Ieșirea legii din vigoare. Expresă (legea nouă numește legea veche) sau tacită (reguli incompatibile); totală sau parțială. Definitivă (art. 64 L. 24/2000). Desuetudinea nu abrogă."],
[4,"Neretroactivitatea","Legea dispune numai pentru viitor (art. 15 alin. 2 Constituție; art. 6 alin. 1 C.civ.) și nu poate reglementa relații născute, modificate sau stinse înainte. Excepție: legea penală sau contravențională mai favorabilă."],
[4,"Aplicarea imediată; ultraactivitatea","**Aplicarea imediată**: legea nouă se aplică de îndată situațiilor ivite după intrarea ei și efectelor lor (art. 6 alin. 5–6). **Ultraactivitatea**: supraviețuirea vremelnică a legii vechi, aplicată situațiilor în curs; excepție de la aplicarea imediată."],
[4,"Art. 6 alin. (2)–(4)","Actele și faptele juridice, actele nule sau anulabile, prescripțiile, decăderile și uzucapiunile începute și neîmplinite rămân supuse **legii vechi**."],
[4,"Legea civilă în spațiu","Intern (art. 7): actele centrale se aplică pe tot teritoriul, cele locale doar în raza lor. Internațional: la raporturile cu element de extraneitate se aplică normele conflictuale (art. 8; Cartea a VII-a); prioritate au tratatele și dreptul UE."],
[4,"Interpretarea legii civile","Operațiunea logico-rațională de lămurire a conținutului și sensului normelor, pentru justa lor aplicare. Oficială: **autentică** (de la emitent, art. 9 alin. 1–2, doar pentru viitor) sau **jurisdicțională** (instanța, art. 9 alin. 3); neoficială (doctrina, avocatul)."],
[4,"Rezultatul și metodele interpretării","Literală (textul și situațiile coincid); extensivă (sens mai larg, nu la enumerări limitative și excepții); restrictivă (arie mai îngustă). Metode: gramaticală; logică (per a contrario, analogie, a fortiori, reducerea la absurd); sistematică; istorică; teleologică. Art. 10: limita analogiei."],
[5,"Raportul juridic civil","Relație socială, patrimonială sau nepatrimonială, reglementată de norma de drept civil, în care părțile sunt pe poziție de egalitate juridică. Caractere: social, volițional (simplu sau dublu), egalitate."],
[5,"Izvorul raportului concret","Faptul juridic lato sensu: faptele, evenimentele sau acțiunile de care legea civilă leagă nașterea, modificarea sau stingerea unui raport juridic civil concret. Nu se confundă cu izvoarele dreptului civil."],
[5,"Act juridic / fapt juridic","**Act**: acțiune omenească cu intenția de a produce efecte juridice (contract, testament). **Fapt** (stricto sensu): acțiune fără acea intenție, ale cărei efecte vin din lege (distrugerea bunului), plus evenimentele."],
[5,"Fapte licite și ilicite","**Licite**: gestiunea de afaceri (art. 1330–1340), plata nedatorată (1341–1344), îmbogățirea fără justă cauză (1345–1348). **Ilicit**: acțiune cu încălcarea legii (delict civil)."],
[5,"Elementele raportului; determinarea subiectelor","Cumulativ: **părțile**, **conținutul** (drepturi și obligații corelative), **obiectul** (conduita). Drepturi **absolute**: activ determinat, pasiv nedeterminat. **Relative**: activ și pasiv determinați."],
[5,"Pluralitatea subiectelor","Activă, pasivă sau mixtă. Coproprietate (cote ideale, art. 634) / devălmășie (fără cote, art. 667). Obligații: conjunctă (divizibilă, regula art. 1424), solidară (oricare cere sau plătește tot), indivizibilă (obiect indivizibil)."],
[5,"Schimbarea creditorului (CSN)","**Cesiunea de creanță** (art. 1566–1592): creditorul transmite creanța unei alte persoane. **Subrogația personală** (1593–1598): terțul plătește și devine creditor. **Novația** (1609): vechea obligație se stinge, e înlocuită cu una nouă."],
[5,"Schimbarea debitorului (NPSP)","Novația prin schimbare de debitor (art. 1609 alin. 2); preluarea de datorie (1609–1614); stipulația pentru altul (1284); poprirea (creditorul urmărește sumele pe care un terț le datorează debitorului său)."],
[5,"Capacitatea civilă","Aptitudinea generală de a fi titular de drepturi și obligații civile. **De folosință** (art. 34): de a avea drepturi și obligații. **De exercițiu** (art. 37): de a încheia singur acte juridice civile."],
[5,"Capacitatea de exercițiu a persoanei fizice","**Deplină**: la 18 ani (art. 38), minorul căsătorit, la 16 ani cu instanța de tutelă (art. 39–40). **Restrânsă** (art. 41): 14–18 ani, consilierea judiciară; actele cu încuviințare prealabilă. **Lipsă** (art. 43): sub 14 ani, tutela specială; actele prin reprezentant legal."],
[5,"Persoana juridică (art. 187)","Colectivitate cu organizare de sine stătătoare, patrimoniu propriu, afectat unui scop licit și moral, în acord cu interesul general. Folosință de la înregistrare (art. 205); specialitate doar la cele fără scop lucrativ (art. 206 alin. 2); exercițiu prin organele de administrare (art. 209)."],
[6,"Dreptul subiectiv civil","Posibilitatea subiectului activ, recunoscută de dreptul civil obiectiv, de a avea, în limitele legii, o anumită conduită și de a pretinde subiectului pasiv să dea, să facă sau să nu facă ceva, la nevoie cu forța coercitivă a statului. Nu se confundă cu exercițiul lui."],
[6,"Drept absolut / relativ","**Absolut**: titularul îl exercită singur; subiect pasiv nedeterminat (toți ceilalți), obligație negativă generală, erga omnes (drepturile reale și nepatrimoniale). **Relativ**: creditorul cere debitorului; ambii determinați; inter partes."],
[6,"Dreptul real (jus in re)","Drept patrimonial în virtutea căruia titularul își exercită atributele (posesia, folosința, dispoziția) asupra unui bun, direct și nemijlocit. Absolut, limitat ca număr (art. 551). Prerogative: **urmărire** și **preferință**."],
[6,"Dreptul de creanță (jus ad personam)","Drept patrimonial prin care creditorul poate pretinde debitorului să dea, să facă sau să nu facă ceva. Relativ, nelimitat ca număr; izvor: act juridic sau fapt juridic licit ori ilicit."],
[6,"Dreptul potestativ","Puterea titularului de a influența unilateral și discreționar o situație juridică preexistentă (o modifică, o stinge sau creează alta). Drept de opțiune; categorie intermediară (nici real, nici de creanță)."],
[6,"Drepturi nepatrimoniale","Fără conținut economic, necesibile, exercitate doar personal. 3 categorii: existența și integritatea; identificarea; creația intelectuală. Art. 58: drepturile personalității."],
[6,"Drept principal / accesoriu","Principal: existență de sine stătătoare. Accesoriu: soarta lui depinde de a principalului (accesorium sequitur principale): ipoteca, gajul, clauza penală, arvuna, fideiusiunea."],
[6,"Drept pur și simplu / afectat de modalități","Pur și simplu: efecte imediat, definitiv, irevocabil. Afectat: existența sau exercițiul depind de un eveniment viitor (termen, condiție, sarcină)."],
[6,"Abuzul de drept (art. 15)","Exercitarea unui drept în scopul de a vătăma sau păgubi pe altul ori într-un mod excesiv și nerezonabil, contrar bunei-credințe. Privește exercițiul, nu existența dreptului. Sancțiuni: refuzul concursului statului; despăgubiri."],
[6,"Obligația civilă","Îndatorirea subiectului pasiv de a avea o conduită corespunzătoare dreptului corelativ (a da, a face, a nu face), care poate fi impusă prin constrângere. Sensuri: îndatorirea; raportul obligațional; înscrisul constatator."],
[6,"A da / a face / a nu face","**A da**: a constitui sau transmite un drept real. **A face**: orice prestație pozitivă (predarea bunului vândut). **A nu face**: abținere."],
[6,"De rezultat / de mijloace (art. 1481)","**Rezultat**: debitorul trebuie să procure rezultatul promis. **Mijloace**: debitorul depune toată diligența, fără a garanta rezultatul (medicul)."],
[6,"Scriptae in rem / propter rem","**Scriptae in rem**: obligație opozabilă și terților, legată de posesia lucrului (art. 1811). **Propter rem**: revine deținătorului unui bun, ca accesoriu al unui drept real."],
[6,"Obligație perfectă / naturală","Perfectă: executarea poate fi cerută cu forța statului. Naturală (imperfectă): nu se poate executa silit, dar plata făcută de bunăvoie nu se restituie (art. 2506 alin. 3)."],
[6,"Obiectul raportului juridic","Conduita părților: acțiunea sau inacțiunea la care e îndreptățit subiectul activ și de care e ținut cel pasiv. Nu se confundă cu conținutul (drepturile și obligațiile)."],
[7,"Bun (art. 535)","Lucrurile, corporale sau necorporale, care constituie obiectul unui drept patrimonial. Stricto sensu: doar lucrurile; lato sensu: și drepturile privitoare la ele."],
[7,"Patrimoniu (art. 31 alin. 1)","Totalitatea drepturilor și datoriilor evaluabile în bani ale unei persoane: latura activă (drepturi) și pasivă (obligații). Universalitate juridică."],
[7,"Universalitate de fapt (art. 541)","Ansamblul bunurilor care aparțin aceleiași persoane și au o destinație comună stabilită prin voința ei sau prin lege; pot fi și separat obiect de acte juridice."],
[7,"Corporal / necorporal","Corporale: existență materială, percepute de simțuri. Necorporale: existență abstractă (creanțe, acțiuni, părți sociale, drepturi intelectuale)."],
[7,"Bunuri imobile","Prin natură (art. 537): terenuri, construcții, plantații, tot ce e încorporat permanent. Prin destinație (art. 538). Prin obiectul la care se aplică (art. 542 alin. 1): drepturile reale asupra imobilelor."],
[7,"Bunuri mobile","Prin natură (art. 539): tot ce legea nu consideră imobil, energia, undele. Prin anticipație (art. 540): imobile tratate ca mobile în vederea detașării. Prin determinarea legii (art. 542 alin. 2): creanțe, drepturi reale asupra mobilelor, titluri, drepturi intelectuale."],
[7,"Fungibil / nefungibil (art. 543)","Fungibile: determinabile după număr, măsură sau greutate, înlocuibile în executarea unei obligații. Nefungibile: nu pot fi înlocuite; debitorul se liberează doar dând bunul datorat."],
[7,"Consumptibil; divizibil (art. 544–545)","**Consumptibil**: bun mobil a cărui folosire obișnuită implică consumarea sau înstrăinarea substanței. **Divizibil**: poate fi împărțit în natură fără a-și schimba destinația. Contrariile: neconsumptibil, indivizibil."],
[7,"Principal / accesoriu (art. 546)","Accesoriu: destinat stabil și exclusiv întrebuințării economice a altui bun, cât timp satisface această utilizare; destinația o stabilește proprietarul ambelor bunuri. Urmează soarta principalului."],
[7,"Circuit civil","Bunurile în circuit pot fi dobândite și înstrăinate liber (unele cu restricții). Cele scoase din circuit sunt inalienabile (art. 136 alin. 3 Constituție); actul de vânzare e nul absolut."],
[7,"Cert / de gen","Cert (res certa): individualizat prin însușiri proprii. De gen (res genera): privit prin caracterele categoriei, individualizat prin numărare, măsurare, cântărire. Proprietatea trece la acord (cert) sau la individualizare (de gen, art. 1273)."],
[7,"Fructe și producte (art. 548–549)","Fructe: produse care derivă din folosirea bunului, fără diminuarea substanței (naturale, industriale, civile). Producte: obținute cu consumarea sau diminuarea substanței."],
[7,"Sesizabil / insesizabil","Sesizabile: pot fi urmărite silit (regula). Insesizabile: doar în cazurile legii (art. 727 CPC; bunurile proprietate publică, art. 861 C.civ.)."]
];

 if(v=="z"){h=`<p>Examenul peste o săptămână: câte o parte pe zi, 40–60 de minute.</p>${PLAN.map(p=>`<div class="card">${p}</div>`).join("")}<p class="mut">Regula: în fiecare zi, 10 minute din ce ai făcut ieri, din memorie.</p>`}
