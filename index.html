<script type="application/json" id="d">{"curs": [{"id": "C1", "t": "C1 · Introducere în dreptul civil", "s": [{"t": "1. Cele 3 sensuri ale noțiunii de „drept”", "h": "<ul>\n<li><strong>Dreptul obiectiv (pozitiv):<\/strong> totalitatea regulilor de conduită generale, impersonale și obligatorii care reglementează relațiile sociale dintre persoane, instituite sau recunoscute de stat și asigurate, la nevoie, prin forța de constrângere a statului; există independent de aplicarea lor într-un caz concret.<\/li>\n<li><strong>Dreptul subiectiv:<\/strong> facultatea (prerogativa) recunoscută de dreptul obiectiv unei persoane, într-un raport juridic concret, de a avea o anumită conduită și de a pretinde altora o conduită corespunzătoare, la nevoie cu ajutorul statului (ex.: vânzătorul pretinde prețul).<\/li>\n<li><strong>Știința dreptului:<\/strong> disciplina care studiază normele, instituțiile și raporturile juridice.<\/li>\n<\/ul>\n"}, {"t": "2. Diviziunea drept public vs. drept privat", "h": "<ul>\n<li><strong>Criteriul principal de delimitare:<\/strong> calitatea în care intervine statul în raportul juridic.<\/li>\n<li><strong>Dreptul public:<\/strong> reglementează relațiile în care statul apare ca autoritate, titular al puterii publice (drept constituțional, administrativ, financiar, penal, drept procesual).<\/li>\n<li><strong>Dreptul privat:<\/strong> reglementează relațiile dintre particulari, aflați pe poziție de egalitate juridică, pentru ocrotirea intereselor private (drept civil, dreptul familiei, raporturile dintre profesioniști).<\/li>\n<li class=\"trap\"><strong>⚠️ Capcană de examen:<\/strong> atunci când statul sau o unitate administrativ-teritorială acționează în circuitul civil cu privire la un bun din <strong>domeniul său privat<\/strong> (ex.: încheie o vânzare sau o locațiune), fără prerogative de autoritate publică, raportul juridic aparține <strong>dreptului privat<\/strong>.<\/li>\n<\/ul>\n"}, {"t": "3. Definiția, egalitatea juridică, dreptul comun și sistemul monist", "h": "<ul>\n<li><strong>Dreptul civil:<\/strong> ramura de drept privat care cuprinde normele ce reglementează relațiile sociale <strong>patrimoniale și nepatrimoniale<\/strong> în care părțile se găsesc pe poziție juridică de egalitate, precum și condiția juridică a subiectelor de drept.<\/li>\n<li><strong>Egalitatea juridică a părților:<\/strong> absența subordonării juridice — nicio parte nu are mijloace proprii de constrângere asupra celeilalte, ci trebuie să apeleze la forța coercitivă a statului. <strong>NU<\/strong> presupune egalitate cantitativă sau simetrică în drepturi și obligații (de ex., în donație sau comodat o parte are în principal drepturi, iar cealaltă obligații).<\/li>\n<li><strong>Caracterul de drept comun (art. 2 alin. 2 C.civ.):<\/strong> noțiunile de bază ale celorlalte ramuri de drept privat sunt definite în dreptul civil, iar dispozițiile Codului civil se aplică domeniilor la care se referă litera sau spiritul lor ori de câte ori norma specială nu dispune altfel. Dreptul civil <strong>completează<\/strong>, nu înlătură automat normele speciale.<\/li>\n<li><strong>Sistemul monist:<\/strong> Codul comercial din 1887 a fost abrogat prin <strong>art. 230 lit. c) din Legea nr. 71/2011<\/strong>, iar <strong>art. 3 alin. (1) C.civ.<\/strong> extinde aplicarea Codului civil și asupra raporturilor dintre profesioniști, precum și dintre aceștia și orice alte subiecte de drept civil.<\/li>\n<\/ul>\n"}, {"t": "4. Obiectul dreptului civil (art. 2 alin. 1 C.civ.)", "h": "<ul>\n<li><strong>Relații patrimoniale<\/strong> (evaluabile în bani):\n<ul>\n<li><em>Reale:<\/em> dreptul de proprietate și cele <strong>5 dezmembrăminte ale proprietății private (U-U-A-S-S)<\/strong> — uzufruct, uz, abitație, servitute, superficie. <em>(⚠️ Capcană: ipoteca este un drept real accesoriu de garanție, <strong>NU<\/strong> un dezmembrământ al proprietății.)<\/em><\/li>\n<li><em>Obligaționale:<\/em> drepturi de creanță.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Relații personale nepatrimoniale<\/strong> (fără conținut economic direct evaluabil în bani):\n<ul>\n<li>existența și integritatea persoanei (viață, sănătate, integritate fizică și psihică);<\/li>\n<li>identificarea persoanei (nume, domiciliu, reședință, stare civilă — <strong>art. 59 C.civ.<\/strong>);<\/li>\n<li>creația intelectuală.<\/li>\n<li>Sunt ocrotite prin mijloace specifice de drept civil (încetarea atingerii ilicite, daune morale și materiale — <strong>art. 252–256 C.civ.<\/strong>).<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<hr />\n"}]}, {"id": "C2", "t": "C2 · Delimitarea și principiile dreptului civil", "s": [{"t": "1. Cele 6 criterii de delimitare", "h": "<ul>\n<li><strong>Criteriul fundamental (determinant):<\/strong> obiectul de reglementare.<\/li>\n<li><strong>Criteriul subsecvent:<\/strong> metoda de reglementare (egalitatea juridică a părților).<\/li>\n<li><strong>Cele 4 criterii auxiliare:<\/strong> calitatea subiectelor, caracterul normelor, specificul sancțiunilor, principiile proprii.<\/li>\n<\/ul>\n"}, {"t": "2. Clasificarea normelor de drept civil (art. 11 C.civ.)", "h": "<ul>\n<li><strong>Norme dispozitive<\/strong> (părțile pot deroga prin voința lor):\n<ul>\n<li><em>Permisive:<\/em> permit o conduită fără să o impună.<\/li>\n<li><em>Supletive:<\/em> se aplică numai dacă părțile nu au convenit altfel.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Norme imperative<\/strong> (obligatorii; potrivit <strong>art. 11 C.civ.<\/strong>, nu se poate deroga prin convenții sau acte juridice unilaterale de la legile care interesează ordinea publică sau de la bunele moravuri):\n<ul>\n<li><em>Onerative:<\/em> impun o conduită (ex.: <strong>art. 1673 C.civ.<\/strong> — vânzătorul are obligația de a transmite proprietatea).<\/li>\n<li><em>Prohibitive:<\/em> interzic o conduită (ex.: <strong>art. 1783 C.civ.<\/strong> — locațiunea nu se poate încheia pentru o durată mai mare de 49 de ani).<\/li>\n<\/ul>\n<\/li>\n<li class=\"trap\"><strong>⚠️ Capcană de examen (art. 1783 C.civ.):<\/strong> dacă părțile stipulează o durată a locațiunii mai mare de 49 de ani (ex.: 60 de ani), contractul <strong>NU<\/strong> este lovit de nulitate absolută totală, ci <strong>durata se reduce de drept la 49 de ani<\/strong>.<\/li>\n<\/ul>\n"}, {"t": "3. Sancțiuni și raportul cu ramurile învecinate", "h": "<ul>\n<li><strong>Sancțiuni:<\/strong> civile = <strong>reparatorii<\/strong> (repararea pagubei, restabilirea situației anterioare); penale = <strong>punitive<\/strong> (pedeapsă).<\/li>\n<li><strong>Drept public și drept procesual civil:<\/strong> raport de subordonare; <strong>dreptul procesual civil<\/strong> este ramură de <strong>drept public<\/strong> (instanța exercită autoritatea de stat) și stabilește modul de aplicare/realizare a dreptului civil.<\/li>\n<li><strong>Dreptul internațional privat (DIP):<\/strong> intervine când raportul de drept privat are un <strong>element de extraneitate<\/strong> (cetățenie, bun situat în străinătate, locul încheierii/executării), declanșând <strong>norma conflictuală<\/strong> care indică legea aplicabilă.<\/li>\n<li><strong>Dreptul familiei:<\/strong> Codul civil 1864 → Codul familiei 1954 → reintegrat în Codul civil la 1 octombrie 2011.<\/li>\n<li><strong>Dreptul comercial și profesionistul (art. 3 alin. 2–3 C.civ.; art. 8 alin. 1 Legea nr. 71/2011):<\/strong> este profesionist cel care exploatează o întreprindere — exercitarea sistematică, de către una sau mai multe persoane, a unei activități organizate constând în producerea, administrarea ori înstrăinarea de bunuri sau în prestarea de servicii, <strong>indiferent dacă are sau nu un scop lucrativ<\/strong>. Include categoriile de comerciant, întreprinzător, operator economic și orice alte persoane autorizate.<\/li>\n<li><strong>Evicțiunea (noțiune conexă):<\/strong> pierderea proprietății lucrului (total sau parțial) ori tulburarea cumpărătorului în exercitarea prerogativelor de proprietar.<\/li>\n<\/ul>\n"}, {"t": "4. Cele 5 principii fundamentale ale dreptului civil", "h": "<ol>\n<li><strong>Ocrotirea proprietății<\/strong>.<\/li>\n<li><strong>Egalitatea în fața legii civile (art. 30 C.civ.):<\/strong> rasa, culoarea, naționalitatea, originea etnică, limba, religia, vârsta, sexul, opinia, apartenența politică, averea, originea socială, gradul de cultură etc. nu au nicio influență asupra capacității civile.<\/li>\n<li><strong>Îmbinarea intereselor individuale cu cele generale<\/strong>.<\/li>\n<li><strong>Ocrotirea și garantarea drepturilor subiective civile<\/strong>.<\/li>\n<li><strong>Buna-credință (art. 14 C.civ.):<\/strong> vizează atât exercitarea drepturilor, cât și <strong>executarea obligațiilor<\/strong>, în acord cu ordinea publică și bunele moravuri. Conform <strong>art. 14 alin. (2)<\/strong>, <strong>buna-credință se prezumă până la proba contrară<\/strong> (prezumție relativă).<\/li>\n<\/ol>\n<hr />\n"}]}, {"id": "C3", "t": "C3 · Izvoarele dreptului civil", "s": [{"t": "1. Sensuri și cascada obligatorie (art. 1 C.civ.)", "h": "<ul>\n<li><strong>Sens material:<\/strong> condițiile materiale de existență care generează normele. <strong>Sens formal:<\/strong> forma specifică de exprimare a normelor juridice civile.<\/li>\n<li><strong>Ordinea obligatorie de aplicare (art. 1 alin. 1–2 C.civ.):<\/strong>\n<ol>\n<li><strong>Legea<\/strong>;<\/li>\n<li><strong>Uzanțele<\/strong> (în cazurile neprevăzute de lege);<\/li>\n<li><strong>Analogia legii<\/strong> (dispozițiile legale privitoare la situații asemănătoare);<\/li>\n<li><strong>Principiile generale ale dreptului<\/strong>.<\/li>\n<\/ol>\n<\/li>\n<\/ul>\n"}, {"t": "2. Legea și celelalte izvoare scrise", "h": "<ul>\n<li><strong>Lege <em>lato sensu<\/em><\/strong> = orice act normativ care conține norme de drept civil, indiferent de organul emitent și denumire. <strong>Lege <em>stricto sensu<\/em><\/strong> = exclusiv actele Parlamentului purtând denumirea de „lege”.<\/li>\n<li><strong>Categorii de legi:<\/strong>\n<ul>\n<li><em>Constituționale:<\/em> Constituția și legile de revizuire.<\/li>\n<li><em>Organice:<\/em> domenii de importanță majoră; în materie civilă, <strong>regimul juridic general al proprietății și al moștenirii<\/strong> (<strong>art. 73 alin. 3 lit. m din Constituție<\/strong>).<\/li>\n<li><em>Ordinare:<\/em> orice altă lege a Parlamentului.<\/li>\n<li><em>Alte clasificări:<\/em> interne / internaționale; generale / speciale.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Actele Guvernului (art. 115 Constituție):<\/strong>\n<ul>\n<li><strong>Hotărâri de Guvern (HG):<\/strong> organizarea executării legilor; izvor de drept civil când conțin norme civile.<\/li>\n<li><strong>Ordonanțe simple (OG):<\/strong> emise în baza unei legi speciale de abilitare, <strong>NUMAI în domenii care nu fac obiectul legilor organice<\/strong> (<strong>art. 115 alin. 1 Constituție<\/strong> — nu pot reglementa regimul general al proprietății sau moștenirii).<\/li>\n<li><strong>Ordonanțe de urgență (OUG):<\/strong> numai în situații extraordinare, cu motivarea urgenței; <strong>NU pot fi adoptate în domeniul legilor constituționale<\/strong> (<strong>art. 115 alin. 6 Constituție<\/strong>), dar pot interveni (<em>per a contrario<\/em>) în domeniul legilor organice.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Actele autorităților administrației publice locale:<\/strong> izvor de drept civil dacă conțin norme civile, aplicabile în raza lor teritorială (<strong>art. 7 C.civ.<\/strong>).<\/li>\n<li><strong>Prioritatea dreptului Uniunii Europene (art. 5 C.civ.):<\/strong> în materiile reglementate de Codul civil, normele dreptului UE se aplică în mod prioritar, indiferent de calitatea sau statutul părților.<\/li>\n<li><strong>Codul civil:<\/strong> Codicele civil din 1864 (în vigoare 1865, după modelul Codului Napoleon) vs. actualul Cod civil — <strong>Legea nr. 287/2009<\/strong>, intrat în vigoare la <strong>1 octombrie 2011<\/strong>, structurat în <strong>Titlul preliminar (art. 1–24) + 7 cărți<\/strong>.<\/li>\n<\/ul>\n"}, {"t": "3. Uzanțele, jurisprudența și doctrina", "h": "<ul>\n<li><strong>Uzanțele (art. 1 alin. 2–6 C.civ.):<\/strong> includ <strong>obiceiul (cutuma)<\/strong> și <strong>uzurile profesionale<\/strong>; sunt izvor doar dacă sunt conforme ordinii publice și bunelor moravuri.\n<ul>\n<li><em>Regim dublu:<\/em> în materiile <strong>nereglementate<\/strong> de lege se aplică direct (înaintea analogiei legii); în materiile <strong>reglementate<\/strong> prin lege se aplică <strong>NUMAI în măsura în care legea trimite în mod expres la ele<\/strong> (<strong>art. 1 alin. 3<\/strong>).<\/li>\n<li><em>Proba (art. 1 alin. 5):<\/em> partea interesată trebuie să dovedească existența și conținutul lor; <strong>excepție:<\/strong> uzanțele publicate în culegeri elaborate de entități sau organisme autorizate în domeniu <strong>se prezumă că există<\/strong>, până la proba contrară.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Jurisprudența:<\/strong> în principiu <strong>NU<\/strong> este izvor — instanțele aplică, nu creează dreptul (<strong>art. 5 alin. 4 C.proc.civ.<\/strong>), iar hotărârea produce efecte doar <em>inter partes<\/em> (<strong>art. 435 C.proc.civ.<\/strong>). <strong>Excepții obligatorii:<\/strong> deciziile Curții Constituționale (<strong>art. 147 alin. 4 Constituție<\/strong>), deciziile ÎCCJ în <strong>RIL<\/strong>, hotărârile prealabile ÎCCJ (<strong>DCD<\/strong>), jurisprudența <strong>CEDO<\/strong> și <strong>CJUE<\/strong>.\n<ul>\n<li><strong>⚖️ Diferență critică RIL vs. DCD:<\/strong>\n<ul>\n<li><strong>RIL (art. 517 alin. 2 și 4 C.proc.civ.):<\/strong> obligatorie pentru instanțe <strong>de la data publicării în Monitorul Oficial, Partea I<\/strong>; <strong>NU<\/strong> are efecte asupra hotărârilor examinate și nici asupra situației părților din acele procese.<\/li>\n<li><strong>DCD (art. 521 alin. 3 C.proc.civ.):<\/strong> dublă dată — obligatorie pentru instanța care a solicitat dezlegarea <strong>de la data pronunțării<\/strong>, iar pentru celelalte instanțe <strong>de la data publicării în Monitorul Oficial<\/strong>.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<\/li>\n<li><strong>Doctrina:<\/strong> <strong>NU<\/strong> este izvor formal de drept civil (doar interpretare neoficială).<\/li>\n<\/ul>\n<hr />\n"}]}, {"id": "C4", "t": "C4 · Aplicarea legii civile în timp, spațiu, asupra persoanelor și interpretarea", "s": [{"t": "1. Intrarea și ieșirea din vigoare", "h": "<ul>\n<li><strong>Intrarea în vigoare:<\/strong>\n<ul>\n<li><em>Legi și ordonanțe simple:<\/em> la <strong>3 zile calendaristice<\/strong> de la publicarea în Monitorul Oficial sau la o dată ulterioară prevăzută în text (<strong>art. 78 Constituție; art. 12 alin. 1 Legea nr. 24/2000<\/strong>). Ziua publicării este ziua 1; termenul expiră la ora 24:00 a celei de-a treia zile calendaristice, legea intrând în vigoare la ora 00:00 a zilei următoare (ex.: publicare 10 martie → în vigoare 13 martie ora 00:00).<\/li>\n<li><em>OUG:<\/em> la data publicării, sub condiția <strong>depunerii prealabile<\/strong> la Camera competentă să fie sesizată.<\/li>\n<li><em>Alte acte normative (ex.: HG):<\/em> la data publicării.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Ieșirea din vigoare (abrogarea):<\/strong>\n<ul>\n<li><strong>Expresă<\/strong> (legea nouă nominalizează actul/articolul abrogat) sau <strong>tacită<\/strong> (norma nouă este incompatibilă cu cea veche); <strong>totală<\/strong> sau <strong>parțială<\/strong>.<\/li>\n<li><strong>Caracter definitiv (art. 64 Legea nr. 24/2000):<\/strong> abrogarea unei norme care a abrogat o lege anterioară <strong>NU repune în vigoare<\/strong> legea inițială.<\/li>\n<li><strong>Desuetudinea<\/strong> (neaplicarea îndelungată) <strong>NU abrogă<\/strong> norma civilă.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n"}, {"t": "2. Aplicarea legii civile în timp (art. 6 C.civ.)", "h": "<ul>\n<li><strong>Principii:<\/strong>\n<ul>\n<li><em>Neretroactivitatea<\/em> (<strong>art. 15 alin. 2 Constituție; art. 6 alin. 1 C.civ.<\/strong>): de ordine publică; în materie civilă <strong>NU admite nicio excepție<\/strong> (singura excepție constituțională este legea penală sau contravențională mai favorabilă).<\/li>\n<li><em>Aplicarea imediată a legii noi<\/em> (<strong>art. 6 alin. 5–6 C.civ.<\/strong>): regula pentru situațiile ivite după intrarea ei în vigoare și efectele lor viitoare.<\/li>\n<li><em>Ultraactivitatea legii vechi:<\/em> excepția de la aplicarea imediată (supraviețuirea legii vechi pentru situații juridice anterioare în curs).<\/li>\n<\/ul>\n<\/li>\n<li><strong>Ce rămâne supus legii vechi (art. 6 alin. 2–4 C.civ.):<\/strong>\n<ul>\n<li><strong>Actele și faptele juridice<\/strong> încheiate/săvârșite anterior intrării în vigoare a legii noi, precum și efectele lor — inclusiv <strong>contractele și efectele lor viitoare<\/strong> (<strong>art. 102 alin. 1 Legea nr. 71/2011<\/strong>) și <strong>faptele ilicite<\/strong> anterioare.<\/li>\n<li><strong>Actele juridice nule sau anulabile<\/strong> la data intrării în vigoare a legii noi (nu pot fi considerate valabile sub legea nouă).<\/li>\n<li><strong>Prescripțiile extinctive, decăderile și uzucapiunile<\/strong> începute și neîmplinite rămân supuse în întregime legii care le-a instituit (<strong>art. 201 Legea nr. 71/2011<\/strong>).<\/li>\n<\/ul>\n<\/li>\n<li><strong>⚖️ Jurisprudență — Decizia ÎCCJ RIL nr. 1/2014:<\/strong> pentru o prescripție începută sub Decretul nr. 167/1958, instanța o poate invoca <strong>din oficiu<\/strong> chiar dacă litigiul se judecă după 1 octombrie 2011.<\/li>\n<li class=\"trap\"><strong>⚠️ 2 derogări exprese în Legea nr. 71/2011 (aplicare imediată la prescripții în curs):<\/strong>\n<ol>\n<li><strong>Art. 203 LPA:<\/strong> cauzele de suspendare din <strong>art. 2532 pct. 6 și 7 C.civ.<\/strong> (negocieri și procedură prealabilă) se aplică și prescripțiilor în curs dacă împrejurările apar după 1 octombrie 2011;<\/li>\n<li><strong>Art. 204 LPA:<\/strong> regula din <strong>art. 2539 alin. (2) teza a II-a C.civ.<\/strong> privind păstrarea efectului întreruptiv prin introducerea unei noi cereri în termen de <strong>6 luni<\/strong> de la rămânerea definitivă a hotărârii de respingere sau anulare a primei cereri (nu și în caz de renunțare sau perimare).<\/li>\n<\/ol>\n<\/li>\n<li><strong>Ce trece sub legea nouă (art. 6 alin. 5–6 C.civ.):<\/strong>\n<ul>\n<li>Actele, faptele și situațiile noi;<\/li>\n<li><strong>Efectele viitoare ale situațiilor juridice legale continue<\/strong> născute anterior, dacă subzistă: <strong>starea și capacitatea persoanelor, căsătoria, filiația, adopția, obligația legală de întreținere, raporturile de proprietate (inclusiv regimul general al bunurilor) și raporturile de vecinătate<\/strong>. <em>(Nu include contractele și nici faptele ilicite anterioare.)<\/em><\/li>\n<\/ul>\n<\/li>\n<\/ul>\n"}, {"t": "3. Aplicarea în spațiu și asupra persoanelor", "h": "<ul>\n<li><strong>Intern (art. 7 C.civ.):<\/strong> actele organelor centrale = întreg teritoriul; actele autorităților locale = exclusiv raza lor teritorială.<\/li>\n<li><strong>Internațional (art. 8, Cartea a VII-a):<\/strong> element de extraneitate → norme conflictuale (persoană → legea națională; bun → legea locului situării, <em>lex rei sitae<\/em>; contract → legea aleasă de părți, <em>lex voluntatis<\/em>); tratatele internaționale și dreptul UE au prioritate.<\/li>\n<li><strong>Asupra persoanelor:<\/strong> egalitate (<strong>art. 30 C.civ.<\/strong>); străinii și apatrizii sunt asimilați, în condițiile legii, cetățenilor români privind drepturile și libertățile civile.<\/li>\n<\/ul>\n"}, {"t": "4. Interpretarea legii civile (art. 9–10 C.civ.)", "h": "<ul>\n<li><strong>După forță:<\/strong>\n<ul>\n<li><em>Oficială:<\/em> <strong>autentică<\/strong> (emană de la organul emitent — <strong>art. 9 alin. 1<\/strong>; <strong>norma interpretativă produce efecte NUMAI pentru viitor<\/strong> — <strong>art. 9 alin. 2<\/strong>) și <strong>jurisdicțională<\/strong> (instanța, obligatorie doar pentru cauza dedusă judecății — <strong>art. 9 alin. 3<\/strong>).<\/li>\n<li><em>Neoficială:<\/em> doctrina, avocatul (nu devine obligatorie nici dacă este citată în considerentele unei hotărâri).<\/li>\n<\/ul>\n<\/li>\n<li><strong>După rezultat:<\/strong> literală (textul și situațiile coincid), extensivă (sens mai larg — interzisă la excepții și enumerări limitative), restrictivă (arie mai îngustă).<\/li>\n<li><strong>Metode:<\/strong> gramaticală; logică (<em>per a contrario<\/em> — limitarea aplicării la cazul expres prevăzut și negarea ei în afara lui; analogie; <em>a fortiori<\/em> — <em>a majori ad minus<\/em> și <em>a minori ad maius<\/em>; reducerea la absurd); sistematică; istorică; teleologică (scopul legii).<\/li>\n<li><strong>Limita analogiei (art. 10 C.civ.):<\/strong> legile care <strong>derogă de la o dispoziție generală<\/strong>, <strong>restrâng exercițiul unor drepturi civile<\/strong> sau <strong>prevăd sancțiuni civile<\/strong> se aplică <strong>numai în cazurile expres și limitativ prevăzute de lege<\/strong>.<\/li>\n<\/ul>\n<hr />\n"}]}, {"id": "C5", "t": "C5 · Raportul juridic civil (I)", "s": [{"t": "1. Definiție, caractere, izvoare și structură", "h": "<ul>\n<li><strong>Raportul juridic civil<\/strong> = relația socială (patrimonială sau nepatrimonială) reglementată de norma civilă, în care părțile sunt pe poziție de egalitate juridică.<\/li>\n<li><strong>3 caractere:<\/strong> social, volițional (simplu — doar voința legiuitorului; dublu — voința legiuitorului + a părților/autorului la actul juridic), egalitate juridică.<\/li>\n<li><strong>Izvorul raportului juridic civil concret<\/strong> (faptul juridic <em>lato sensu<\/em> — a nu se confunda cu izvorul formal al dreptului civil din art. 1):\n<ul>\n<li><em>Evenimente:<\/em> fapte naturale fără voință omenească (naștere, deces, cutremur, împlinirea termenului).<\/li>\n<li><em>Act juridic civil:<\/em> manifestare de voință făcută <strong>cu intenția de a produce efecte juridice<\/strong> (contract, testament, oferta și acceptarea).<\/li>\n<li><em>Fapt juridic stricto sensu:<\/em> evenimentele + acțiunile omenești <strong>fără intenția<\/strong> de a produce efecte juridice (efectele vin din lege):\n<ul>\n<li><strong>Licite (G-P-Î):<\/strong> gestiunea de afaceri (<strong>art. 1330–1340<\/strong>), plata nedatorată (<strong>art. 1341–1344<\/strong>), îmbogățirea fără justă cauză (<strong>art. 1345–1348<\/strong>);<\/li>\n<li><strong>Ilicite:<\/strong> delictul civil (<strong>art. 1349, art. 1357<\/strong>).<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<\/li>\n<li><strong>Structura (3 elemente cumulative):<\/strong> părțile (subiectele), conținutul (drepturi și obligații corelative), obiectul (conduita).\n<ul>\n<li>Raport <strong>absolut:<\/strong> activ determinat, pasiv nedeterminat.<\/li>\n<li>Raport <strong>relativ:<\/strong> ambii determinați.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n"}, {"t": "2. Pluralitatea subiectelor", "h": "<ul>\n<li>Activă, pasivă sau mixtă.<\/li>\n<li><strong>La drepturi reale:<\/strong> <strong>coproprietate<\/strong> (cote-părți ideale matematice, <strong>art. 634<\/strong>) vs. <strong>devălmășie<\/strong> (fără cote determinate, ex. soții, <strong>art. 667<\/strong>).<\/li>\n<li><strong>La obligații:<\/strong> <strong>conjunctă/divizibilă<\/strong> (regula de drept comun, <strong>art. 1424 C.civ.<\/strong>), <strong>solidară<\/strong> (oricare cere sau plătește tot), <strong>indivizibilă<\/strong> (obiect indivizibil).<\/li>\n<li class=\"trap\"><strong>⚠️ Excepții de solidaritate pasivă:<\/strong>\n<ol>\n<li><strong>Art. 1446 C.civ.:<\/strong> solidaritatea pasivă <strong>se prezumă<\/strong> între debitorii unei obligații contractate în exercițiul activității unei întreprinderi (profesioniști);<\/li>\n<li><strong>Art. 1382 C.civ.:<\/strong> în <strong>răspunderea civilă delictuală<\/strong>, cei care răspund pentru o faptă prejudiciabilă sunt ținuți <strong>solidar<\/strong> la reparație față de cel prejudiciat (victima poate cere toată despăgubirea de la oricare dintre coautori!).<\/li>\n<\/ol>\n<\/li>\n<\/ul>\n"}, {"t": "3. Schimbarea subiectelor (CSN și NPSP)", "h": "<ul>\n<li><strong>Schimbarea creditorului (CSN):<\/strong>\n<ul>\n<li><strong>Cesiunea de creanță (art. 1566–1592):<\/strong> se transmite <strong>aceeași creanță<\/strong> împreună cu garanțiile ei; debitorul cedat <strong>NU<\/strong> este parte la contract, dar cesiunea îi devine opozabilă prin acceptare printr-un înscris cu dată certă sau prin comunicare scrisă/electronică (<strong>art. 1578<\/strong>).<\/li>\n<li><strong>Subrogația personală (art. 1593–1598):<\/strong> terțul plătește datoria și devine creditor.<\/li>\n<li><strong>Novația cu schimbare de creditor (art. 1609):<\/strong> stinge obligația veche și naște una nouă; <strong>nu se prezumă<\/strong> (intenția de a nova trebuie să fie neîndoielnică — <strong>art. 1610<\/strong>); ipotecile <strong>nu trec<\/strong> decât dacă s-a prevăzut expres (<strong>art. 1611 alin. 1<\/strong>).<\/li>\n<\/ul>\n<\/li>\n<li><strong>Schimbarea debitorului (NPSP):<\/strong>\n<ul>\n<li><strong>Preluarea datoriei (⚠️ CORECȚIE CRITICĂ: art. 1599–1608 C.civ., NU 1609–1614!):<\/strong> transmite <strong>aceeași datorie<\/strong>. Convenită între debitor și terț, produce efecte <strong>numai cu acordul creditorului (art. 1605)<\/strong>. Debitorul inițial <strong>nu este liberat<\/strong> dacă noul debitor era insolvabil la data preluării și creditorul nu cunoștea aceasta (<strong>art. 1601<\/strong>). Obligația fideiusorului sau a terțului garant <strong>se stinge<\/strong> dacă aceștia nu își dau acordul la preluare (<strong>art. 1602 alin. 3<\/strong>).<\/li>\n<li><strong>Novația cu schimbare de debitor (art. 1609 alin. 2):<\/strong> ipotecile nu subzistă asupra bunurilor debitorului inițial fără consimțământul său (<strong>art. 1611 alin. 2<\/strong>).<\/li>\n<li><strong>Stipulația pentru altul (art. 1284)<\/strong> și <strong>poprirea<\/strong>.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n"}, {"t": "4. Capacitatea civilă a persoanei fizice și reforma Legii nr. 140/2022", "h": "<ul>\n<li><strong>Reguli generale (art. 29 C.civ.):<\/strong> nimeni nu poate renunța, în tot sau în parte, la capacitatea de folosință ori de exercițiu; îngrădirea operează exclusiv în cazurile și condițiile legii, nu prin convenție.<\/li>\n<li><strong>Capacitatea de folosință (art. 34):<\/strong> aptitudinea de a avea drepturi și obligații, de la naștere. <strong>Excepția <em>infans conceptus<\/em> (art. 36):<\/strong> drepturile copilului conceput sunt recunoscute de la concepțiune, dar numai dacă se naște viu.<\/li>\n<li><strong>Capacitatea de exercițiu (art. 37):<\/strong> aptitudinea de a încheia singur acte juridice civile:\n<ul>\n<li><strong>Deplină:<\/strong> la 18 ani (<strong>art. 38<\/strong>); prin căsătorie (la anularea căsătoriei, minorul de bună-credință o păstrează — <strong>art. 39<\/strong>); la 16 ani prin hotărârea instanței de tutelă pentru motive temeinice, cu ascultarea părinților/tutorelui și avizul consiliului de familie când e cazul (<strong>art. 40<\/strong>). <em>(⚠️ <strong>Art. 42 C.civ.:<\/strong> încheierea actelor privind munca/activități artistice/sportive cu încuviințare nu conferă capacitate deplină generală, ci dreptul de a exercita singur acele drepturi și de a dispune singur de veniturile dobândite.)<\/em><\/li>\n<li><strong>Restrânsă (art. 41):<\/strong> minorul între 14 și 18 ani + majorul sub consiliere judiciară (<strong>art. 41 alin. 1¹<\/strong>). Încheie acte cu <strong>încuviințare prealabilă<\/strong>. Poate face <strong>SINGUR (art. 41 alin. 3):<\/strong> acte de conservare, <strong>acte de administrare care nu îl prejudiciază<\/strong> și acte de dispoziție de mică valoare, curente, cu executare imediată.<\/li>\n<li><strong>Lipsă (art. 43):<\/strong> minorul sub 14 ani + majorul sub tutelă specială. Actele se încheie prin <strong>reprezentant legal<\/strong>. Poate face <strong>SINGUR (art. 43 alin. 3):<\/strong> acte de conservare și acte de dispoziție de mică valoare, curente, cu executare imediată — <strong>❌ NU însă și acte de administrare neprejudiciabile!<\/strong><\/li>\n<\/ul>\n<\/li>\n<li><strong>⚖️ Jurisprudență obligatorie — Decizia ÎCCJ (Complet DCD) nr. 58/2024 (MO nr. 1128/12.11.2024):<\/strong> acceptarea expresă a moștenirii de către un minor lipsit de capacitate de exercițiu reprezintă un <strong>act de dispoziție<\/strong> și necesită <strong>încuviințarea (autorizarea) instanței de tutelă<\/strong>.<\/li>\n<li><strong>Cele 3 măsuri de ocrotire a majorului (Legea nr. 140/2022):<\/strong>\n<ol>\n<li><strong>Asistența pentru încheierea actelor juridice (art. 1 și art. 3 din Legea nr. 140/2022):<\/strong> numire la <strong>notarul public<\/strong>, durată <strong>maximum 2 ani<\/strong>; <strong>NU afectează capacitatea de exercițiu<\/strong> (asistentul nu semnează în numele majorului și nu îi încuviințează actele).<\/li>\n<li><strong>Consilierea judiciară:<\/strong> dispusă de instanța de tutelă pe <strong>maximum 3 ani<\/strong>; atrage capacitate de exercițiu <strong>restrânsă<\/strong> (<strong>art. 41 alin. 1¹ C.civ.<\/strong>).<\/li>\n<li><strong>Tutela specială:<\/strong> dispusă de instanța de tutelă pe <strong>maximum 5 ani<\/strong> (prelungibilă până la <strong>maximum 15 ani<\/strong> în caz de deteriorare permanentă, <strong>art. 168 C.civ.<\/strong>); atrage <strong>lipsa<\/strong> capacității de exercițiu (<strong>art. 43 C.civ.<\/strong>).<\/li>\n<\/ol>\n<ul>\n<li><em>Individualizare (art. 104, art. 168 alin. 4–5):<\/em> instanța poate limita încuviințarea/reprezentarea la anumite categorii de acte, iar pentru restul capacitatea rămâne neafectată.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Sancțiuni (art. 44–48 C.civ.):<\/strong>\n<ul>\n<li><strong>Art. 44 alin. (1):<\/strong> actele cu încălcarea regulilor de capacitate sunt <strong>anulabile chiar fără dovedirea unui prejudiciu<\/strong>.<\/li>\n<li><strong>Art. 45:<\/strong> simpla declarație că este capabil nu înlătură anulabilitatea, dar dacă a folosit <strong>manopere dolosive<\/strong>, instanța poate <strong>menține contractul<\/strong> la cererea părții induse în eroare.<\/li>\n<li><strong>Art. 46 alin. (3)<\/strong> (modif. Legea 140/2022): persoana capabilă nu poate opune/invoca anulabilitatea, dar poate cere <strong>menținerea contractului și reducerea/majorarea propriei prestații<\/strong>.<\/li>\n<li><strong>Art. 47:<\/strong> în caz de anulare, incapabilul restituie prestațiile <strong>numai în limita folosului realizat<\/strong>.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n"}, {"t": "5. Persoana juridică (art. 187, art. 205–209 C.civ.)", "h": "<ul>\n<li><strong>Elemente:<\/strong> organizare de sine stătătoare, patrimoniu propriu, scop licit și moral în acord cu interesul general.<\/li>\n<li><strong>Folosință:<\/strong> de la înregistrare (<strong>art. 205<\/strong>), cu capacitate anticipată de la actul de înființare pentru actele necesare constituirii valabile (<strong>art. 205 alin. 3<\/strong>) și posibilitatea de a primi <strong>liberalități<\/strong> (<strong>art. 208<\/strong>).<\/li>\n<li><strong>Principiul specialității capacității de folosință:<\/strong> se aplică <strong>EXCLUSIV persoanelor juridice fără scop lucrativ (art. 206 alin. 2)<\/strong>; încălcarea lui și desfășurarea de activități fără autorizația cerută de lege (<strong>art. 207<\/strong>) atrag <strong>nulitatea absolută<\/strong> (<strong>art. 206 alin. 3, art. 207<\/strong>).<\/li>\n<li><strong>Exercițiu:<\/strong> prin organele de administrare (<strong>art. 209<\/strong>).<\/li>\n<\/ul>\n<hr />\n"}]}, {"id": "C6", "t": "C6 · Raportul juridic civil (II)", "s": [{"t": "1. Conținut vs. Obiect", "h": "<ul>\n<li><strong>Conținutul<\/strong> = totalitatea drepturilor subiective și a obligațiilor corelative (simplu la donație; complex la contractele sinalagmatice).<\/li>\n<li><strong>Obiectul<\/strong> = <strong>conduita efectivă<\/strong> a părților (acțiunea sau inacțiunea).<\/li>\n<\/ul>\n"}, {"t": "2. Clasificarea drepturilor subiective civile", "h": "<ul>\n<li><strong>Dreptul subiectiv<\/strong> = posibilitatea recunoscută de dreptul obiectiv, distinctă de exercițiul concret al lui.<\/li>\n<li><strong>După opozabilitate:<\/strong>\n<ul>\n<li><em>Absolute:<\/em> subiect pasiv nedeterminat (obligație generală negativă), opozabile <em><strong>erga omnes<\/strong><\/em> (drepturile reale și nepatrimoniale).<\/li>\n<li><em>Relative:<\/em> ambii determinați, opozabile <em><strong>inter partes<\/strong><\/em> (drepturile de creanță).<\/li>\n<\/ul>\n<\/li>\n<li><strong>După conținut:<\/strong>\n<ul>\n<li><em>Patrimoniale:<\/em>\n<ul>\n<li><strong>Drepturi reale (<em>jus in re<\/em>):<\/strong> limitate ca număr (<strong>art. 551 C.civ.<\/strong>), conferă prerogativele <strong>urmăririi<\/strong> și <strong>preferinței<\/strong>.\n<ul>\n<li><em>Reale accesorii (<strong>G-I-P-R<\/strong>):<\/em> <strong>gajul<\/strong> (<strong>art. 2480<\/strong> — poartă exclusiv pe mobile corporale sau titluri negociabile materializate), <strong>ipoteca<\/strong>, <strong>privilegiile<\/strong>, <strong>dreptul de retenție<\/strong> (<strong>art. 2495–2499<\/strong> — opozabil terților <strong>FĂRĂ formalități de publicitate<\/strong>, art. 2498 alin. 1; nu poate fi invocat de posesorul de rea-credință decât în cazurile legii, art. 2496 alin. 2; se stinge dacă cel interesat consemnează suma sau oferă garanție suficientă, art. 2499 alin. 1).<\/li>\n<\/ul>\n<\/li>\n<li><strong>Drepturi de creanță (<em>jus ad personam<\/em>):<\/strong> nelimitate ca număr.<\/li>\n<li><strong>Drepturi potestative:<\/strong> puterea unilaterală și discreționară de a modifica, stinge sau crea o situație juridică preexistentă (categorie intermediară).<\/li>\n<\/ul>\n<\/li>\n<li><em>Nepatrimoniale:<\/em> fără conținut economic, netransmisibile, exercitate personal (<strong>art. 58 C.civ.<\/strong> — drepturile personalității).<\/li>\n<\/ul>\n<\/li>\n<li><strong>După corelație:<\/strong> principale vs. accesorii (<em>accesorium sequitur principale<\/em>: ipotecă, gaj, fideiusiune, clauză penală, arvună).<\/li>\n<li><strong>După certitudine:<\/strong> pure și simple vs. afectate de modalități (<strong>T-C-S<\/strong>: termen, condiție, sarcină).<\/li>\n<\/ul>\n"}, {"t": "3. Exercitarea drepturilor și abuzul de drept (art. 14, art. 15, art. 1353 C.civ.)", "h": "<ul>\n<li>Drepturile se exercită cu bună-credință și conform scopului lor social și economic.<\/li>\n<li><strong>Abuzul de drept (art. 15 C.civ.):<\/strong> exercitarea unui drept <strong>existent<\/strong> în scopul de a vătăma sau păgubi pe altul ori într-un mod excesiv și nerezonabil, contrar bunei-credințe. Privește <strong>exercițiul<\/strong>, nu existența dreptului (≠ delict civil, unde lipsește dreptul și prejudiciul este obligatoriu).<\/li>\n<li><strong>Sancțiuni:<\/strong> refuzul concursului forței coercitive a statului și, dacă există pagubă, obligația de <strong>reparare a prejudiciului (art. 1353 C.civ.)<\/strong>.<\/li>\n<\/ul>\n"}, {"t": "4. Obligația civilă și clasificările ei", "h": "<ul>\n<li><strong>3 sensuri:<\/strong> îndatorirea subiectului pasiv; raportul obligațional; înscrisul constatator.<\/li>\n<li><strong>După obiect:<\/strong>\n<ul>\n<li><strong>A da:<\/strong> a constitui sau transmite un drept real. <strong>Corelație (art. 1483 alin. 1):<\/strong> obligația de a strămuta proprietatea <strong>implică<\/strong> și obligația de a preda lucrul și de a-l conserva până la predare.<\/li>\n<li><strong>A face:<\/strong> orice prestație pozitivă (⚠️ <strong>predarea materială a bunului vândut este obligație de a face!<\/strong>).<\/li>\n<li><strong>A nu face:<\/strong> abținere.<\/li>\n<\/ul>\n<\/li>\n<li><strong>De rezultat vs. de mijloace (art. 1481 C.civ.):<\/strong>\n<ul>\n<li><em>Rezultat:<\/em> debitorul procură rezultatul promis; neatingerea lui <strong>prezumă neexecutarea culpabilă<\/strong>.<\/li>\n<li><em>Mijloace (diligență):<\/em> debitorul depune toată diligența fără a garanta rezultatul (ex.: medicul); <strong>creditorul dovedește<\/strong> lipsa diligenței.<\/li>\n<li><em>4 criterii legale (art. 1481 alin. 3):<\/em> modul stipulării în contract, existența și natura contraprestației, gradul de risc, influența celeilalte părți.<\/li>\n<\/ul>\n<\/li>\n<li><strong>După opozabilitate:<\/strong>\n<ul>\n<li>Obișnuită;<\/li>\n<li><em><strong>Scriptae in rem<\/strong><\/em> (opozabilă terților — <strong>art. 1811 C.civ.:<\/strong> locațiunea notată în CF la imobile înscrise [lit. a] sau cu dată certă anterioară înstrăinării la imobile neînscrise [lit. b]);<\/li>\n<li><em><strong>Propter rem<\/strong><\/em> (legată de stăpânirea bunului; se transmite automat dobânditorului odată cu bunul, fără convenție specială).<\/li>\n<\/ul>\n<\/li>\n<li><strong>După sancțiune:<\/strong>\n<ul>\n<li><em>Perfectă:<\/em> executare silită posibilă;<\/li>\n<li><em>Naturală (imperfectă):<\/em> prescripția nu operează de plin drept; după împlinirea ei cel obligat poate refuza executarea (<strong>art. 2506 alin. 1–2<\/strong>), dar <strong>plata executată de bunăvoie nu se restituie<\/strong> (<strong>art. 1471 și art. 2506 alin. 3 C.civ.<\/strong>).<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<hr />\n"}]}, {"id": "C7", "t": "C7 · Bunurile", "s": [{"t": "1. Bun, patrimoniu și universalitate de fapt", "h": "<ul>\n<li><strong>Bun (art. 535 C.civ.):<\/strong> lucrurile, corporale sau necorporale, obiect al unui drept patrimonial (<em>stricto sensu<\/em>: lucrurile; <em>lato sensu<\/em>: și drepturile).<\/li>\n<li><strong>Patrimoniu (art. 31 C.civ.):<\/strong> universalitate juridică (toate drepturile și datoriile evaluabile în bani); există chiar dacă pasivul depășește activul (patrimoniu negativ); diviziune/afectațiune doar în cazurile și condițiile legii.<\/li>\n<li><strong>Universalitate de fapt (art. 541 C.civ.):<\/strong> ansamblul bunurilor aceluiași proprietar cu destinație comună; pot face <strong>și separat<\/strong> obiect de acte juridice.<\/li>\n<\/ul>\n"}, {"t": "2. Cele 10 clasificări și regulile de examen", "h": "<ol>\n<li><strong>Corporale vs. necorporale:<\/strong> existență materială vs. abstractă (creanțe, acțiuni, părți sociale, drepturi intelectuale).<\/li>\n<li><strong>Imobile vs. mobile (art. 537–542 C.civ.):<\/strong>\n<ul>\n<li><em>Imobile:<\/em>\n<ul>\n<li><strong>Prin natură (art. 537):<\/strong> terenuri, izvoare/cursuri de apă, plantații prinse în rădăcini, construcții fixate permanent, tot ce este încorporat permanent.<\/li>\n<li><strong>Bunuri care rămân sau devin imobile (⚠️ CORECȚIE CRITICĂ — art. 538):<\/strong> Codul civil actual a <strong>ELIMINAT „imobilele prin destinație”<\/strong> din 1864 (azi sunt mobile, eventual accesorii art. 546). <strong>Rămân imobile (alin. 1):<\/strong> materialele separate provizoriu pentru a fi reîntrebuințate în aceeași formă și părțile detașate temporar. <strong>Devin imobile (alin. 2):<\/strong> materialele aduse pentru a fi întrebuințate în locul celor vechi, <strong>din momentul dobândirii acestei destinații<\/strong> (chiar înainte de încorporare).<\/li>\n<li><strong>Prin obiectul la care se aplică (art. 542 alin. 1):<\/strong> drepturile reale asupra imobilelor.<\/li>\n<\/ul>\n<\/li>\n<li><em>Mobile:<\/em>\n<ul>\n<li><strong>Prin natură (art. 539):<\/strong> tot ce legea nu consideră imobil + energia și undele electromagnetice.<\/li>\n<li><strong>Prin anticipație (art. 540):<\/strong> bogății ale solului/subsolului, fructe neculese, plantații/construcții privite în vederea detașării; opozabile terților <strong>NUMAI prin notarea în cartea funciară (art. 540 alin. 2)<\/strong>.<\/li>\n<li><strong>Prin determinarea legii (art. 542 alin. 2):<\/strong> creanțe, drepturi reale asupra mobilelor, titluri de valoare, drepturi intelectuale.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<\/li>\n<li><strong>Fungibile vs. nefungibile (art. 543):<\/strong> înlocuibile după număr, măsură, greutate vs. neînlocuibile.<\/li>\n<li><strong>Consumptibile vs. neconsumptibile (art. 544):<\/strong> <strong>EXCLUSIV bunuri mobile<\/strong>; categorie <strong>independentă de fungibilitate<\/strong> (există consumptibil nefungibil, ex. ultima sticlă dintr-o recoltă celebră, și neconsumptibil fungibil, ex. două exemplare ale aceleiași cărți).<\/li>\n<li><strong>Divizibile vs. indivizibile (art. 545):<\/strong> pot fi împărțite în natură fără schimbarea destinației vs. nu pot.\n<ul>\n<li class=\"trap\"><strong>⚠️ Regula sensului unic convențional (art. 543–545 alin. 3):<\/strong> voința părților schimbă calificarea într-un singur sens: <strong>fungibil → nefungibil<\/strong>, <strong>consumptibil → neconsumptibil<\/strong>, <strong>divizibil → indivizibil<\/strong>.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Principale vs. accesorii (art. 546):<\/strong> destinația stabilă și exclusivă o stabilește <strong>NUMAI proprietarul ambelor bunuri<\/strong> (nu chiriașul); accesoriul urmează soarta principalului (normă dispozitivă: „dacă nu se prevede altfel”, alin. 3); separarea temporară nu îi înlătură calitatea (alin. 5); încetarea calității nu e opozabilă terțului care a dobândit anterior drepturi privind principalul (alin. 4).<\/li>\n<li><strong>În circuitul civil vs. scoase din circuit:<\/strong> bunurile proprietate publică (<strong>art. 136 alin. 3 Constituție; art. 861 C.civ.<\/strong>) sunt inalienabile, imprescriptibile și insesizabile (vânzarea e nulă absolut; nu se dobândesc prin uzucapiune sau posesie de bună-credință), <strong>DAR<\/strong> pot fi date în administrare/folosință, concesionate sau închiriate (<strong>art. 861 alin. 3<\/strong>).<\/li>\n<li><strong>Certe (<em>res certa<\/em>) vs. de gen (<em>res genera<\/em>) — proprietate și risc (art. 1273–1274 C.civ.):<\/strong>\n<ul>\n<li><em>Proprietate (art. 1273):<\/em> cert → la acordul de voință; de gen → la individualizare.<\/li>\n<li><em>Riscul pieirii fortuite (art. 1274):<\/em> abandonarea regulii <em>res perit domino<\/em> — până la predare, <strong>riscul rămâne la debitorul predării<\/strong>, chiar dacă proprietatea a trecut (alin. 1). <strong>EXCEPȚIE (alin. 2):<\/strong> creditorul pus în întârziere pentru preluare preia riscul și nu se liberează nici dacă dovedește că bunul ar fi pierit și în cazul predării la timp.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Frugifere — fructe vs. producte (art. 547–550, art. 948 C.civ.):<\/strong>\n<ul>\n<li><em>Fructe<\/em> (fără diminuarea substanței): naturale și industriale → se dobândesc <strong>la separare<\/strong>; civile → se dobândesc <strong>zi cu zi<\/strong> (nu la încasare, <strong>art. 550 alin. 2–3<\/strong>).<\/li>\n<li><em>Producte<\/em> (cu diminuarea substanței): revin mereu proprietarului; posesorul de bună-credință (<strong>art. 948<\/strong>) dobândește <strong>DOAR fructele<\/strong>, niciodată productele.<\/li>\n<li>Cel care avansează fără acordul proprietarului cheltuielile de producere/culegere a fructelor are <strong>drept de retenție<\/strong> asupra produselor sau contravalorii lor, dacă proprietarul nu oferă garanție îndestulătoare (<strong>art. 550 alin. 4–5<\/strong>).<\/li>\n<\/ul>\n<\/li>\n<li><strong>Sesizabile vs. insesizabile:<\/strong> regula = sesizabile; insesizabile doar în cazurile legii (<strong>art. 861 C.civ.; art. 727 C.proc.civ.<\/strong>); renunțarea debitorului la insesizabilitate este <strong>NULĂ DE DREPT (art. 730 C.proc.civ.)<\/strong>.<\/li>\n<\/ol>\n<hr />\n"}]}, {"id": "Ap", "t": "Aprofundări · corecții critice și tabele comparative", "s": [{"t": "Cele 4 corecții critice de examen", "h": "<p>| Lecția | Eroare / formulare veche | Regula exactă (Codul civil actual &amp; ÎCCJ) |\n||||\n| <strong>C5<\/strong> | Preluarea datoriei confundată cu articolele novației (1609–1614) | <strong>Preluarea datoriei = art. 1599–1608 C.civ.<\/strong> (acordul creditorului art. 1605; insolvabilitate preexistentă art. 1601; fideiusor stins fără acord art. 1602 alin. 3). <strong>Novația = art. 1609–1614 C.civ.<\/strong> |\n| <strong>C5<\/strong> | Confuzia actelor permise singur la capacitate restrânsă vs. lipsă | <strong>Lipsă (art. 43 alin. 3):<\/strong> doar conservare + dispoziție mică valoare curentă imediată (<strong>NU administrare<\/strong>). <strong>Restrânsă (art. 41 alin. 3):<\/strong> și <strong>administrare neprejudiciabilă<\/strong>. Plus <strong>DCD nr. 58/2024:<\/strong> acceptarea expresă a moștenirii = act de dispoziție → autorizare instanța de tutelă. |\n| <strong>C5<\/strong> | Omiterea celei de-a treia măsuri din Legea nr. 140/2022 | Există și <strong>asistența notarială (max. 2 ani, art. 1 și 3 L. 140/2022)<\/strong>, care <strong>NU afectează<\/strong> capacitatea de exercițiu (pe lângă consiliere max. 3 ani și tutelă specială max. 5/15 ani). |\n| <strong>C7<\/strong> | Păstrarea „imobilelor prin destinație” din 1864 | Codul actual le-a <strong>eliminat<\/strong> (azi sunt mobile, eventual accesorii art. 546). <strong>Art. 538<\/strong> reglementează bunurile care <strong>rămân<\/strong> (separate provizoriu) sau <strong>devin imobile<\/strong> (aduse în locul celor vechi, din momentul destinației). |<\/p>\n"}, {"t": "Tabel 1 · RIL vs. DCD & OG vs. OUG", "h": "<p>| Criteriu | RIL (art. 517 C.proc.civ.) | DCD – Hotărâre prealabilă (art. 521 C.proc.civ.) |\n||||\n| <strong>Scop<\/strong> | Unificarea practicii deja divergente (hotărâri definitive) | Prevenirea practicii neunitare (chestiune nouă, în curs) |\n| <strong>De când obligă<\/strong> | De la <strong>publicarea în MO<\/strong> (pentru toate instanțele) | De la <strong>pronunțare<\/strong> (instanța de sesizare) / <strong>publicarea în MO<\/strong> (celelalte) |\n| <strong>Efect pe cauzele anterioare<\/strong> | <strong>NU<\/strong> are efect asupra hotărârilor examinate și părților | Se aplică obligatoriu în cauza în care s-a cerut |<\/p>\n<p>| Act Guvern | Temei | Limite de domeniu (art. 115 Constituție) | Intrare în vigoare |\n|||||\n| <strong>Ordonanță simplă (OG)<\/strong> | Lege de abilitare | <strong>NU<\/strong> în domeniul legilor organice | La 3 zile calendaristice de la publicare |\n| <strong>Ordonanță de urgență (OUG)<\/strong> | Situații extraordinare | <strong>NU<\/strong> în domeniul legilor constituționale (poate în organice) | La publicare, cu <strong>depunere prealabilă<\/strong> la Cameră |<\/p>\n"}, {"t": "Tabel 2 · Harta legii civile în timp (art. 6 C.civ.)", "h": "<p>| Situație față de intrarea în vigoare a legii noi (T<sub>0<\/sub>) | Legea aplicabilă | Temei |\n||||\n| Acte și fapte anterioare T<sub>0<\/sub> + efecte viitoare ale contractelor anterioare | <strong>Legea veche<\/strong> | Art. 6 alin. (2) C.civ., art. 102 LPA |\n| Acte nule sau anulabile sub legea veche | <strong>Legea veche<\/strong> | Art. 6 alin. (3) C.civ. |\n| Prescripții, decăderi, uzucapiuni începute și neîmplinite | <strong>Legea veche<\/strong> (RIL 1/2014: invocare din oficiu sub Decr. 167/1958) | Art. 6 alin. (4) C.civ., art. 201 LPA |\n| Derogări exprese LPA la prescripțiile în curs | <strong>Legea nouă<\/strong> (suspendare art. 2532 pct. 6–7; întrerupere 6 luni art. 2539 alin. 2 teza II) | Art. 203–204 L. 71/2011 |\n| Acte/fapte noi + efecte viitoare ale situațiilor legale continue (stare/capacitate, căsătorie, filiație, adopție, întreținere, proprietate, vecinătate) | <strong>Legea nouă<\/strong> | Art. 6 alin. (5)–(6) C.civ. |<\/p>\n"}, {"t": "Tabel 3 · Cesiune de creanță & Preluarea datoriei vs. Novație", "h": "<p>| Criteriu | Cesiune creanță (1566–1592) | Preluarea datoriei (1599–1608) | Novație (1609–1614) |\n|||||\n| <strong>Obligația<\/strong> | Aceeași creanță | Aceeași datorie | Vechea se stinge, apare una nouă |\n| <strong>Acord / opozabilitate<\/strong> | Debitorul cedat nu e parte; opozabilă prin acceptare dată certă sau comunicare (art. 1578) | Convenția debitor–terț cere <strong>acordul creditorului<\/strong> (art. 1605); insolvabilitate necunoscută = debitor inițial neliberat (art. 1601) | <strong>Nu se prezumă<\/strong> (intenție neîndoielnică, art. 1610) |\n| <strong>Garanții / fideiusori<\/strong> | Trec automat | Fideiusorul / terțul garant <strong>stins fără acordul lor<\/strong> (art. 1602 alin. 3) | Ipotecile <strong>nu trec<\/strong> fără prevedere expresă (art. 1611) |<\/p>\n"}, {"t": "Tabel 4 · Ocrotirea majorului (L. 140/2022) & Actele permise singur", "h": "<p>| Măsură | Autoritate | Durată max. | Efect asupra capacității |\n|||||\n| <strong>Asistență notarială<\/strong> | Notar public | <strong>2 ani<\/strong> | <strong>Nu afectează<\/strong> capacitatea; asistentul nu semnează și nu încuviințează |\n| <strong>Consiliere judiciară<\/strong> | Instanța de tutelă | <strong>3 ani<\/strong> | Capacitate de exercițiu <strong>restrânsă<\/strong> |\n| <strong>Tutelă specială<\/strong> | Instanța de tutelă | <strong>5 ani<\/strong> (până la <strong>15 ani<\/strong>) | <strong>Lipsă<\/strong> capacitate de exercițiu |<\/p>\n<p>| Categorie | Conservare | Dispoziție mică valoare curentă imediată | Administrare neprejudiciabilă | Acceptare expresă moștenire (DCD 58/2024) |\n||||||\n| <strong>Lipsă (art. 43)<\/strong> | DA | DA | <strong>NU<\/strong> | NU (act de dispoziție → autorizare instanța de tutelă) |\n| <strong>Restrânsă (art. 41)<\/strong> | DA | DA | <strong>DA<\/strong> | NU (încuviințare + autorizare instanța de tutelă) |<\/p>\n"}, {"t": "Tabel 5 · Sensul unic (art. 543–545) & Proprietate vs. Risc (art. 1273–1274)", "h": "<ul>\n<li><strong>Sens unic convențional:<\/strong> Fungibil → Nefungibil; Consumptibil → Neconsumptibil; Divizibil → Indivizibil.<\/li>\n<li><strong>Proprietate (art. 1273):<\/strong> Bun cert → la acord; Bun de gen → la individualizare.<\/li>\n<li><strong>Risc (art. 1274):<\/strong> Până la predare → la debitorul predării (chiar dacă proprietatea a trecut); dacă creditorul e pus în întârziere pentru preluare → riscul trece la creditor (fără exonerare chiar dacă bunul ar fi pierit și la predarea la timp).<\/li>\n<\/ul>\n"}]}], "perechi": [{"n": 1, "t": "Act juridic vs. Fapt juridic", "b": "<p>act = intenție de efecte juridice; fapt = efectele vin direct din lege (geamul spart, inundația).<\/p>"}, {"n": 2, "t": "Drept absolut vs. Drept relativ", "b": "<div class=\"cmp\"><div><i>Drept absolut<\/i><p>pasiv nedeterminat, <em>erga omnes<\/em><\/p><\/div><div><i>Drept relativ<\/i><p>ambii determinați, <em>inter partes<\/em>.<\/p><\/div><\/div>"}, {"n": 3, "t": "Drept real vs. Drept de creanță", "b": "<div class=\"cmp\"><div><i>Drept real<\/i><p>limitat (art. 551), urmărire + preferință<\/p><\/div><div><i>Drept de creanță<\/i><p>nelimitat ca număr.<\/p><\/div><\/div>"}, {"n": 4, "t": "Capacitate de folosință vs. Capacitate de exercițiu", "b": "<div class=\"cmp\"><div><i>Capacitate de folosință<\/i><p>a avea drepturi (de la naștere)<\/p><\/div><div><i>Capacitate de exercițiu<\/i><p>a încheia singur acte (14 și 18 ani).<\/p><\/div><\/div>"}, {"n": 5, "t": "Reprezentare vs. Încuviințare", "b": "<div class=\"cmp\"><div><i>Reprezentare<\/i><p>reprezentantul semnează în numele celui lipsit de capacitate<\/p><\/div><div><i>Încuviințare<\/i><p>cel cu capacitate restrânsă semnează personal cu acord prealabil.<\/p><\/div><\/div>"}, {"n": 6, "t": "Obligație de a da vs. Obligație de a face", "b": "<p>a da = constituire/transmitere drept real; predarea materială a bunului = a face.<\/p>"}, {"n": 7, "t": "Obligație de rezultat vs. Obligație de mijloace", "b": "<div class=\"cmp\"><div><i>Obligație de rezultat<\/i><p>rezultat promis (prezumție neexecutare)<\/p><\/div><div><i>Obligație de mijloace<\/i><p>diligență (creditorul dovedește culpa — ex. medicul).<\/p><\/div><\/div>"}, {"n": 8, "t": "Obligație perfectă vs. Obligație naturală", "b": "<div class=\"cmp\"><div><i>Obligație perfectă<\/i><p>executare silită posibilă<\/p><\/div><div><i>Obligație naturală<\/i><p>plata voluntară nu se cere înapoi (art. 1471, 2506 alin. 3).<\/p><\/div><\/div>"}, {"n": 9, "t": "Abuz de drept vs. Delict civil", "b": "<div class=\"cmp\"><div><i>Abuz de drept<\/i><p>drept existent exercitat contrar scopului/bunei-credințe (poate lipsi prejudiciul)<\/p><\/div><div><i>Delict civil<\/i><p>faptă fără drept cu prejudiciu obligatoriu.<\/p><\/div><\/div>"}, {"n": 10, "t": "Neretroactivitate vs. Ultraactivitate", "b": "<div class=\"cmp\"><div><i>Neretroactivitate<\/i><p>legea nouă nu merge în trecut<\/p><\/div><div><i>Ultraactivitate<\/i><p>legea veche supraviețuiește situațiilor în curs.<\/p><\/div><\/div>"}, {"n": 11, "t": "Novație vs. Cesiune / Preluare", "b": "<div class=\"cmp\"><div><i>Novație<\/i><p>vechea obligație se stinge și apare una nouă<\/p><\/div><div><i>Cesiune / Preluare<\/i><p>aceeași creanță sau datorie se transmite.<\/p><\/div><\/div>"}, {"n": 12, "t": "Coproprietate vs. Devălmășie", "b": "<div class=\"cmp\"><div><i>Coproprietate<\/i><p>cote ideale matematice (art. 634)<\/p><\/div><div><i>Devălmășie<\/i><p>fără cote determinate (soții, art. 667).<\/p><\/div><\/div>"}, {"n": 13, "t": "Fructe vs. Producte", "b": "<div class=\"cmp\"><div><i>Fructe<\/i><p>fără diminuarea substanței (revin uzufructuarului/posesorului de bună-credință)<\/p><\/div><div><i>Producte<\/i><p>cu diminuare (mereu ale proprietarului).<\/p><\/div><\/div>"}, {"n": 14, "t": "Norme dispozitive vs. Norme imperative", "b": "<div class=\"cmp\"><div><i>Norme dispozitive<\/i><p>părțile pot deroga<\/p><\/div><div><i>Norme imperative<\/i><p>părțile nu pot deroga (art. 11).<\/p><\/div><\/div>"}, {"n": 15, "t": "Fungibil vs. Consumptibil", "b": "<div class=\"cmp\"><div><i>Fungibil<\/i><p>înlocuibil după număr, măsură, greutate<\/p><\/div><div><i>Consumptibil<\/i><p>se consumă la prima folosire (doar mobile; independente între ele).<\/p><\/div><\/div>"}, {"n": 16, "t": "RIL (art. 517 CPC) vs. DCD (art. 521 CPC)", "b": "<div class=\"cmp\"><div><i>RIL (art. 517 CPC)<\/i><p>obligatoriu de la publicare în MO (fără efect pe hotărârile examinate)<\/p><\/div><div><i>DCD (art. 521 CPC)<\/i><p>obligatoriu de la pronunțare pt instanța de sesizare și de la MO pt restul.<\/p><\/div><\/div>"}, {"n": 17, "t": "Ordonanță simplă (OG) vs. Ordonanță de urgență (OUG)", "b": "<div class=\"cmp\"><div><i>Ordonanță simplă (OG)<\/i><p>lege de abilitare, nu în domenii organice, 3 zile<\/p><\/div><div><i>Ordonanță de urgență (OUG)<\/i><p>urgență, nu în domenii constituționale, la publicare + depunere Cameră.<\/p><\/div><\/div>"}, {"n": 18, "t": "Asistență notarială vs. Consiliere judiciară (L. 140/2022)", "b": "<div class=\"cmp\"><div><i>Asistență notarială<\/i><p>notar, max. 2 ani, nu afectează capacitatea<\/p><\/div><div><i>Consiliere judiciară (L. 140/2022)<\/i><p>instanță, max. 3 ani, capacitate restrânsă.<\/p><\/div><\/div>"}, {"n": 19, "t": "Capacitate restrânsă (art. 41) vs. Lipsă capacitate (art. 43)", "b": "<div class=\"cmp\"><div><i>Capacitate restrânsă (art. 41)<\/i><p>poate face singur acte de administrare neprejudiciabile<\/p><\/div><div><i>Lipsă capacitate (art. 43)<\/i><p>NU poate face singur acte de administrare.<\/p><\/div><\/div>"}, {"n": 20, "t": "Transferul proprietății (art. 1273) vs. Riscul pieirii (art. 1274)", "b": "<div class=\"cmp\"><div><i>Transferul proprietății (art. 1273)<\/i><p>acord (cert) sau individualizare (gen)<\/p><\/div><div><i>Riscul pieirii (art. 1274)<\/i><p>rămâne la debitorul predării până la predare (excepție: creditor în întârziere).<\/p><\/div><\/div>"}, {"n": 21, "t": "Bunuri care devin imobile (art. 538) vs. Mobile prin anticipație (art. 540)", "b": "<div class=\"cmp\"><div><i>Bunuri care devin imobile (art. 538)<\/i><p>materiale aduse pt înlocuire devin imobile din momentul destinației<\/p><\/div><div><i>Mobile prin anticipație (art. 540)<\/i><p>fructe neculese/construcții privite pt detașare, opozabile terților doar prin notare în CF.<\/p><\/div><\/div>"}], "spete": [{"t": "Speța 1 (Picată la examen · C5 + C6) · Furtul din imobilul lui K (X, Y, Z + M și N)", "e": "<p><strong>Enunț:<\/strong> X, Y și Z au intrat în imobilul lui K cât acesta nu era acasă și au furat mai multe bunuri. În timp ce fugeau cu bunurile, au fost văzuți de către M și N. Ulterior, X, Y și Z au fost prinși, însă nu s-au mai găsit bunurile.<\/p>\n<ol>\n<li>Precizați izvorul raportului juridic civil, părțile, conținutul (drepturile și obligațiile identificate) și obiectul raportului juridic.<\/li>\n<li>Ce poate face K pentru a fi despăgubit?<\/li>\n<\/ol>\n", "b": "<ol>\n<li><strong>Structura și izvorul:<\/strong>\n<ul>\n<li><strong>Izvorul raportului juridic concret:<\/strong> <strong>fapt juridic <em>stricto sensu<\/em> ilicit (delict civil)<\/strong> — <strong>art. 1349, art. 1357 C.civ.<\/strong> (pe plan penal e furt; pe plan civil naște raportul de răspundere civilă delictuală).<\/li>\n<li><strong>Părțile:<\/strong> Subiect activ (creditor) = <strong>K<\/strong>; Subiect pasiv (pluralitate pasivă / codebitori) = <strong>X, Y și Z<\/strong>. <strong>⚠️ Capcană: M și N NU sunt părți<\/strong> în raportul juridic civil! Sunt <strong>terți<\/strong> (au doar calitatea procesuală de martori).<\/li>\n<li><strong>Conținutul:<\/strong>\n<ul>\n<li><em>Raportul inițial încălcat:<\/em> dreptul real absolut de proprietate al lui K (<em>erga omnes<\/em>) + obligația generală negativă a tuturor (inclusiv X, Y, Z) de a nu-i aduce atingere.<\/li>\n<li><em>Raportul obligațional nou-născut:<\/em> dreptul de creanță al lui K (patrimonial, relativ, <em>inter partes<\/em>, principal, pur și simplu) de a cere repararea integrală a prejudiciului + obligația corelativă a lui X, Y, Z (civilă perfectă, de rezultat, de a plăti despăgubiri prin echivalent, cu caracter <strong>solidar pasiv — art. 1382 C.civ.<\/strong>).<\/li>\n<\/ul>\n<\/li>\n<li><strong>Obiectul:<\/strong> conduita efectivă a părților (acțiunea lui X, Y, Z de a plăti despăgubirea și dreptul lui K de a o pretinde/primi — nu se confundă cu bunurile furate).<\/li>\n<\/ul>\n<\/li>\n<li><strong>Ce poate face K pentru a fi despăgubit:<\/strong>\n<ul>\n<li>Introduce acțiune în răspundere civilă delictuală în instanța civilă (sau se constituie parte civilă în procesul penal) pentru <strong>reparare integrală prin echivalent bănesc<\/strong> (<strong>art. 1357, art. 1386 C.civ.<\/strong>), întrucât bunurile nu s-au găsit.<\/li>\n<li>Invocă <strong>solidaritatea pasivă delictuală (art. 1382, art. 1447 C.civ.):<\/strong> poate cere <strong>întreaga despăgubire<\/strong> de la toți trei împreună sau de la <strong>oricare dintre X, Y, Z la alegere<\/strong> (cel mai solvabil), fără divizarea datoriei; plătitorul are apoi regres contra celorlalți (art. 1383–1384).<\/li>\n<li>Folosește orice mijloc de probă (fiind fapt juridic), inclusiv depozițiile martorilor <strong>M și N<\/strong>.<\/li>\n<li>Poate trece la <strong>executare silită<\/strong> asupra bunurilor sesizabile ale lui X, Y, Z (obligație civilă perfectă).<\/li>\n<\/ul>\n<\/li>\n<\/ol>\n"}, {"t": "Speța 2 (Picată la examen · C7) · Vânzarea apartamentului „fără mobilier” (uși vs. mobilier vs. bunuri accesorii)", "e": "<p><strong>Enunț:<\/strong> A îi vinde lui B un apartament, precizând că îl vinde „fără mobilier”. Înainte de predare, A susține că poate lua atât mobilierul obișnuit, cât și ușile de interior, pe motiv că ar fi bunuri accesorii excluse din vânzare. Analizați calificarea ușilor, a mobilierului și a bunurilor accesorii.<\/p>\n", "b": "<ol>\n<li><strong>Ușile apartamentului — A NU are dreptate:<\/strong> nu sunt bunuri accesorii, ci <strong>părți integrante ale imobilului<\/strong>, încorporate permanent în construcție (<strong>imobile prin natura lor, art. 537 C.civ.<\/strong>; chiar detașate temporar pentru reparații rămân imobile, <strong>art. 538 alin. 1<\/strong>). Trec obligatoriu la cumpărătorul B.<\/li>\n<li><strong>Mobilierul obișnuit — A ARE dreptate:<\/strong> canapeaua, patul, masa, dulapurile neîncorporate în zidărie sunt <strong>bunuri mobile prin natura lor (art. 539)<\/strong> și <strong>NU sunt bunuri accesorii<\/strong> în sensul art. 546 (servesc uzului personal al locuitorului, nu întrebuințării economice exclusive și stabile a construcției). Nu trec la cumpărător. <em>(Excepție: mobilierul încorporat structural/permanent în zidărie devine parte a imobilului cf. art. 537.)<\/em><\/li>\n<li><strong>Bunurile accesorii reale ale apartamentului (art. 546 C.civ.):<\/strong> bunuri mobile destinate stabil și exclusiv întrebuințării economice a imobilului, destinație stabilită <strong>numai de proprietarul ambelor bunuri<\/strong> (ex.: chei, cartele/telecomenzi de acces). Urmează soarta principalului, <strong>dar norma este dispozitivă<\/strong> („dacă nu se prevede altfel”, art. 546 alin. 3); separarea temporară nu înlătură calitatea (alin. 5); încetarea calității nu e opozabilă terțului anterior (alin. 4).<\/li>\n<\/ol>\n"}, {"t": "Speța 3 (Picată la grile/spețe · C5 + C6) · X plecat în concediu, inundația și vecinul care cheamă 2 instalatori", "e": "<p><strong>Enunț:<\/strong> X este plecat în concediu; i se inundă casa de la o țeavă spartă. Vecinul V intră în locuință fără împuternicire și cheamă 2 meșteri să repare scurgerea, ca să oprească paguba din casa lui X și ca să nu i se inunde și lui bunurile, plătind lucrarea. Analizați izvorul raportului juridic, părțile și efectele.<\/p>\n", "b": "<ul>\n<li><strong>Izvorul raportului juridic concret:<\/strong> <strong>fapt juridic <em>stricto sensu<\/em> licit<\/strong> — <strong>gestiunea de afaceri (art. 1330–1340 C.civ.)<\/strong>. Nu este contract de mandat (lipsește acordul lui X) și nu este fapt ilicit.<\/li>\n<li><strong>Nuanța de 10 (interesul propriu conex):<\/strong> faptul că V își protejează <em>și<\/em> propriile bunuri (interes comun) <strong>nu înlătură<\/strong> gestiunea de afaceri, atâta timp cât gestionează voluntar și util afacerea lui X (repararea țevii din casa lui X). <em>(Dacă ar fi acționat exclusiv în interes propriu, s-ar analiza îmbogățirea fără justă cauză, art. 1345 — tot fapt licit.)<\/em><\/li>\n<li><strong>Părți și conținut:<\/strong> V (<em>gerant<\/em>, creditor) și X (<em>gerat<\/em>, debitor). V trebuie să îl înștiințeze pe X și să lucreze cu diligența unui bun proprietar (art. 1331–1334); X are obligația să îi restituie lui V <strong>cheltuielile necesare și utile<\/strong> (art. 1337 C.civ.).<\/li>\n<\/ul>\n"}, {"t": "Speța 4 (Model probabil · C5) · Minor de 13 ani vs. minor de 16 ani", "e": "<p><strong>Enunț:<\/strong> M1 (13 ani) cumpără singur un sandwich de 15 lei, face o reparație urgentă pentru a salva bicicleta și o închiriază pe 6 luni. M2 (16 ani, necăsătorit, fără acordul părinților) vinde un telefon de 3.000 lei declarând simplu că are 18 ani și închiriază avantajos garajul său. Analizați actele.<\/p>\n", "b": "<ul>\n<li><strong>M1 (13 ani — lipsă capacitate, art. 43):<\/strong> sandwich-ul = <strong>valabil<\/strong> (dispoziție mică valoare curentă imediată, art. 43 alin. 3); reparația urgentă = <strong>valabil<\/strong> (conservare); închirierea pe 6 luni = <strong>anulabil<\/strong> (minorul sub 14 ani <strong>nu<\/strong> poate face singur acte de administrare).<\/li>\n<li><strong>M2 (16 ani — capacitate restrânsă, art. 41):<\/strong> închirierea avantajoasă a garajului = <strong>valabil<\/strong> (administrare neprejudiciabilă, art. 41 alin. 3); vânzarea telefonului = <strong>anulabil<\/strong> chiar fără dovada prejudiciului (art. 44 alin. 1); simpla declarație că are 18 ani <strong>nu înlătură anulabilitatea<\/strong> (art. 45); majorul nu poate cere anularea (art. 46 alin. 3); M2 restituie prețul doar în limita folosului realizat (art. 47).<\/li>\n<\/ul>\n"}, {"t": "Speța 5 (Model probabil · C7) · Bun cert vs. bun de gen – proprietate și risc", "e": "<p><strong>Enunț:<\/strong> A îi vinde lui B o mașină (identificată prin serie de șasiu) și 2 tone de mere (necântărite), predare peste 5 zile. În ziua 3, un incendiu fortuit distruge tot. Cine suportă riscul? Dar dacă incendiul avea loc în ziua 7, după ce B fusese pus în întârziere să preia mașina?<\/p>\n", "b": "<ul>\n<li><strong>Proprietate (art. 1273):<\/strong> mașina (cert) → la acord; merele (gen) → nu trecuse (neindividualizate).<\/li>\n<li><strong>Riscul în ziua 3 (art. 1274 alin. 1):<\/strong> Codul civil a abandonat <em>res perit domino<\/em>; până la predare, <strong>vânzătorul A<\/strong> (debitorul predării) suportă riscul atât pentru mașină, cât și pentru mere. B nu mai datorează prețul.<\/li>\n<li><strong>Riscul în ziua 7 (art. 1274 alin. 2):<\/strong> fiind pus în întârziere pentru preluare, <strong>B suportă riscul<\/strong> pentru mașină și nu se liberează nici dacă dovedește că ar fi pierit și dacă i-ar fi fost predată la timp.<\/li>\n<\/ul>\n"}], "redactare": [{"t": "Clasificarea bunurilor mobile și imobile (art. 537–542 C.civ.)", "e": "", "b": "<ul>\n<li><em>Imobile (3):<\/em> prin natură (art. 537); bunuri care rămân sau devin imobile (art. 538 — cu precizarea eliminării „imobilelor prin destinație” din 1864); prin obiectul la care se aplică (art. 542 alin. 1).<\/li>\n<li><em>Mobile (3):<\/em> prin natură (art. 539 — inclusiv energie/unde); prin anticipație (art. 540 — opozabile terților doar prin notare în CF, alin. 2); prin determinarea legii (art. 542 alin. 2).<\/li>\n<\/ul>\n"}, {"t": "Comparație: Capacitate de exercițiu restrânsă (art. 41) vs. Lipsă capacitate de exercițiu (art. 43)", "e": "", "b": "<ul>\n<li>Cine intră (14–18 + consiliere max. 3 ani vs. sub 14 + tutelă specială max. 5/15 ani);<\/li>\n<li>Modul încheierii actelor (personal cu încuviințare prealabilă vs. prin reprezentant legal);<\/li>\n<li>Acte permise singuri (restrânsă: conservare + dispoziție mică valoare + <strong>administrare neprejudiciabilă<\/strong>; lipsă: conservare + dispoziție mică valoare, <strong>NU administrare<\/strong>);<\/li>\n<li>Regim comun: anulabilitate fără prejudiciu (art. 44), capabilul nu invocă anularea (art. 46 alin. 3), restituire în limita folosului (art. 47), <strong>DCD 58/2024<\/strong> (acceptarea expresă a moștenirii = act de dispoziție → autorizare instanța de tutelă).<\/li>\n<\/ul>\n"}, {"t": "Clasificarea: Obligații de rezultat vs. Obligații de mijloace (art. 1481 C.civ.)", "e": "", "b": "<ul>\n<li>Definiții și exemple (alin. 1–2: transportator/vânzător vs. medic/avocat);<\/li>\n<li>Cele 4 criterii legale (alin. 3: stipulare, contraprestație, risc, influența părții);<\/li>\n<li>Importanța probatorie (rezultat = prezumție de neexecutare culpabilă; mijloace = creditorul dovedește lipsa diligenței).<\/li>\n<\/ul>\n"}, {"t": "Dreptul obiectiv și dreptul subiectiv", "e": "", "b": "<p>definiții complete, trăsături, corelație (dreptul subiectiv există în temeiul și limitele dreptului obiectiv; ≠ exercițiul dreptului).<\/p>\n"}, {"t": "Drepturile subiective absolute și relative", "e": "", "b": "<p>comparație după definiție, determinarea subiectelor, opozabilitate (<em>erga omnes<\/em> vs. <em>inter partes<\/em>), conținutul obligației corelative (generală negativă vs. determinată), exemple (reale + nepatrimoniale vs. creanțe).<\/p>\n"}, {"t": "Izvoarele raportului juridic civil concret", "e": "", "b": "<p>definiție (fapt juridic <em>lato sensu<\/em> ≠ izvor formal art. 1), acte juridice (intenție de efecte) vs. fapte juridice <em>stricto sensu<\/em> (evenimente + acțiuni licite G-P-Î + acțiuni ilicite/delict).<\/p>\n"}, {"t": "Bunurile principale și bunurile accesorii (art. 546 C.civ.)", "e": "", "b": "<p>definiție (destinație stabilă și exclusivă), condiția proprietarului unic (alin. 2), norma dispozitivă a urmării soartei principalului (alin. 3), încetare neopozabilă terțului anterior (alin. 4), separare temporară (alin. 5), delimitare față de părți integrante (uși, art. 537) și mobilier obișnuit (art. 539).<\/p>\n"}], "grile": [{"n": 1, "m": "C1", "q": "Referitor la diviziunea drept public – drept privat și la poziția dreptului civil în sistemul de drept:", "o": {"A": "criteriul principal de delimitare între dreptul public și dreptul privat îl constituie calitatea în care intervine statul în raportul juridic concret", "B": "atunci când statul încheie un contract de închiriere având ca obiect un imobil din domeniul său privat, raportul juridic aparține dreptului public, datorită calității de persoană juridică de drept public a statului", "C": "Codul civil constituie dreptul comun pentru toate domeniile la care se referă litera sau spiritul dispozițiilor sale (art. 2 alin. 2 C.civ.)"}, "a": ["A", "C"], "e": {"A": {"v": true, "t": "Criteriul principal este calitatea în care intervine statul (autoritate publică vs. poziție de egalitate)."}, "B": {"v": false, "t": "Când statul acționează cu privire la bunuri din domeniul privat fără prerogative de autoritate, raportul este de drept privat."}, "C": {"v": true, "t": "Textul exact al art. 2 alin. (2) C.civ."}}}, {"n": 2, "m": "C1", "q": "În privința egalității juridice a părților în raporturile de drept civil:", "o": {"A": "aceasta presupune că, în orice contract civil, părțile trebuie să aibă un număr egal și simetric de drepturi și obligații", "B": "aceasta semnifică absența raporturilor de subordonare juridică, nicio parte neavând mijloace proprii de constrângere împotriva celeilalte", "C": "dreptul civil reglementează atât relațiile patrimoniale, cât și pe cele nepatrimoniale între persoane aflate pe poziție de egalitate juridică (art. 2 alin. 1 C.civ.)"}, "a": ["B", "C"], "e": {"A": {"v": false, "t": "Egalitatea juridică nu înseamnă paritate cantitativă (ex.: donația, comodatul)."}, "B": {"v": true, "t": "Fiecare parte apelează la forța de constrângere a statului."}, "C": {"v": true, "t": "Art. 2 alin. (1) C.civ."}}}, {"n": 3, "m": "C1", "q": "Fac parte din categoria dezmembrămintelor dreptului de proprietate privată:", "o": {"A": "uzufructul, uzul, abitația, servitutea și superficia", "B": "ipoteca imobiliară, gajul și dreptul de retenție", "C": "dreptul la nume, domiciliul și starea civilă"}, "a": ["A"], "e": {"A": {"v": true, "t": "Formula U-U-A-S-S — cele 5 dezmembrăminte ale proprietății private."}, "B": {"v": false, "t": "Sunt drepturi reale accesorii de garanție, nu dezmembrăminte."}, "C": {"v": false, "t": "Sunt atribute/drepturi nepatrimoniale de identificare a persoanei (art. 59 C.civ.)."}}}, {"n": 4, "m": "C1", "q": "Cu privire la sistemul monist adoptat de actualul Cod civil român:", "o": {"A": "Codul comercial român din 1887 a fost abrogat prin art. 230 lit. c) din Legea nr. 71/2011", "B": "dispozițiile Codului civil se aplică și raporturilor dintre profesioniști, precum și raporturilor dintre aceștia și orice alte subiecte de drept civil (art. 3 alin. 1 C.civ.)", "C": "caracterul de drept comun al dreptului civil presupune înlăturarea automată de la aplicare a tuturor legilor civile speciale"}, "a": ["A", "B"], "e": {"A": {"v": true, "t": "Art. 230 lit. c) Legea nr. 71/2011."}, "B": {"v": true, "t": "Art. 3 alin. (1) C.civ."}, "C": {"v": false, "t": "Dreptul civil completează legile speciale acolo unde acestea nu dispun; norma specială derogă de la cea generală."}}}, {"n": 5, "m": "C1", "q": "În legătură cu sensurile noțiunii de „drept” și obiectul dreptului civil:", "o": {"A": "dreptul obiectiv reprezintă totalitatea normelor juridice care există independent de aplicarea lor într-un caz concret", "B": "dreptul subiectiv reprezintă prerogativa recunoscută de dreptul obiectiv unei persoane, într-un raport juridic concret, de a avea o anumită conduită și de a pretinde altora o conduită corespunzătoare", "C": "relațiile personale nepatrimoniale sunt excluse din obiectul dreptului civil, deoarece nu sunt evaluabile în bani"}, "a": ["A", "B"], "e": {"A": {"v": true, "t": "Definiția dreptului obiectiv (pozitiv)."}, "B": {"v": true, "t": "Definiția dreptului subiectiv civil."}, "C": {"v": false, "t": "Relațiile nepatrimoniale fac parte expres din obiectul dreptului civil (art. 2 alin. 1, art. 58, art. 252–256 C.civ.)."}}}, {"n": 6, "m": "C2", "q": "Referitor la criteriile de delimitare a dreptului civil față de alte ramuri de drept:", "o": {"A": "obiectul de reglementare constituie criteriul fundamental (determinant), iar metoda de reglementare constituie criteriul subsecvent", "B": "calitatea subiectelor, caracterul normelor, specificul sancțiunilor și principiile proprii sunt criterii auxiliare", "C": "metoda de reglementare este criteriul fundamental, în timp ce obiectul de reglementare are caracter auxiliar"}, "a": ["A", "B"], "e": {"A": {"v": true, "t": "Ierarhia consacrată în doctrină."}, "B": {"v": true, "t": "Cele 4 criterii auxiliare."}, "C": {"v": false, "t": "Inversat."}}}, {"n": 7, "m": "C2", "q": "În privința clasificării normelor de drept civil și a art. 11 C.civ.:", "o": {"A": "normele supletive sunt norme imperative de la care părțile pot deroga doar prin act autentic notarial", "B": "nu se poate deroga prin convenții sau acte juridice unilaterale de la legile care interesează ordinea publică sau de la bunele moravuri", "C": "normele imperative se împart în norme onerative (care impun o conduită) și norme prohibitive (care interzic o conduită)"}, "a": ["B", "C"], "e": {"A": {"v": false, "t": "Normele supletive sunt norme dispozitive (se aplică dacă părțile nu au convenit altfel)."}, "B": {"v": true, "t": "Art. 11 C.civ."}, "C": {"v": true, "t": "Clasificarea clasică a normelor imperative."}}}, {"n": 8, "m": "C2", "q": "Părțile încheie un contract de locațiune pentru o durată de 60 de ani. Potrivit art. 1783 C.civ.:", "o": {"A": "contractul de locațiune este lovit de nulitate absolută totală, deoarece s-a încălcat o normă prohibitivă", "B": "termenul locațiunii se reduce de drept la durata maximă legală de 49 de ani", "C": "contractul produce efecte pe toată durata de 60 de ani, întrucât norma din art. 1783 C.civ. are caracter dispozitiv"}, "a": ["B"], "e": {"A": {"v": false, "t": "Sancțiunea expresă nu e nulitatea totală, ci reducerea de drept a duratei."}, "B": {"v": true, "t": "Art. 1783 C.civ.: „dacă părțile stipulează un termen mai lung, acesta se reduce de drept la 49 de ani.”"}, "C": {"v": false, "t": "Norma este imperativă prohibitivă."}}}, {"n": 9, "m": "C2", "q": "Cu privire la noțiunea de „profesionist” (art. 3 alin. 2–3 C.civ. și art. 8 din Legea nr. 71/2011):", "o": {"A": "sunt considerați profesioniști toți cei care exploatează o întreprindere", "B": "exploatarea unei întreprinderi presupune exercitarea sistematică a unei activități organizate, indiferent dacă aceasta are sau nu un scop lucrativ", "C": "o fundație sau o asociație care desfășoară sistematic activități organizate fără scop lucrativ nu poate fi calificată niciodată profesionist"}, "a": ["A", "B"], "e": {"A": {"v": true, "t": "Art. 3 alin. (2) C.civ."}, "B": {"v": true, "t": "Art. 3 alin. (3) C.civ. precizează expres „cu sau fără scop lucrativ”."}, "C": {"v": false, "t": "Tocmai absența scopului lucrativ nu exclude calitatea de profesionist dacă exploatează o întreprindere."}}}, {"n": 10, "m": "C2", "q": "În legătură cu raportul dreptului civil cu alte ramuri de drept și specificul sancțiunilor:", "o": {"A": "dreptul procesual civil aparține dreptului public, deoarece instanța de judecată exercită puterea de autoritate a statului", "B": "sancțiunile civile au, în principal, caracter reparator, pe când sancțiunile penale au caracter punitiv", "C": "normele conflictuale ale dreptului internațional privat se aplică tuturor raporturilor civile interne, chiar în lipsa oricărui element de extraneitate"}, "a": ["A", "B"], "e": {"A": {"v": true, "t": "Raportul cu instanța implică exercitarea autorității de stat."}, "B": {"v": true, "t": "Repararea prejudiciului/restabilirea situației anterioare vs. pedeapsă."}, "C": {"v": false, "t": "Normele conflictuale intervin exclusiv când există un element de extraneitate."}}}, {"n": 11, "m": "C2", "q": "Privind principiul bunei-credințe (art. 14 C.civ.) și principiul egalității (art. 30 C.civ.):", "o": {"A": "buna-credință vizează exclusiv exercitarea drepturilor civile, nu și executarea obligațiilor civile", "B": "buna-credință se prezumă până la proba contrară, cel care invocă reaua-credință având sarcina probei", "C": "rasa, naționalitatea, religia, vârsta, sexul sau averea nu au nicio influență asupra capacității civile"}, "a": ["B", "C"], "e": {"A": {"v": false, "t": "Art. 14 alin. (1) C.civ. include expres atât
