<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>⚖️ Drept civil – Curs complet, scheme și 60 de grile (C1–C7)</title>
<style>
/* ==========================================================================
   DESIGN TOKENS & TEMĂ (LIGHT / DARK AUTOMAT + TOGGLE MANUAL, FĂRĂ DEPENDENȚE)
   ========================================================================== */
:root {
  --bg: #fbfaf7;
  --fg: #1c1b19;
  --card: #ffffff;
  --card-alt: #f5f3ec;
  --bd: #e3dfd6;
  --ac: #2f5bd3;
  --ac-soft: rgba(47, 91, 211, 0.1);
  --mk: #fff0a8;
  --ok: #1f8a4c;
  --ok-bg: rgba(31, 138, 76, 0.1);
  --no: #c0392b;
  --no-bg: rgba(192, 57, 43, 0.09);
  --warn: #b45309;
  --warn-bg: #fef3c7;
  --mut: #6b6860;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14161a;
    --fg: #e8e6e1;
    --card: #1d2026;
    --card-alt: #242831;
    --bd: #333843;
    --ac: #8fb0ff;
    --ac-soft: rgba(143, 176, 255, 0.14);
    --mk: #5a4a12;
    --ok: #5cd08a;
    --ok-bg: rgba(92, 208, 138, 0.13);
    --no: #ff8a7a;
    --no-bg: rgba(255, 138, 122, 0.13);
    --warn: #fbbf24;
    --warn-bg: #3b2f13;
    --mut: #9a978f;
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #14161a;
  --fg: #e8e6e1;
  --card: #1d2026;
  --card-alt: #242831;
  --bd: #333843;
  --ac: #8fb0ff;
  --ac-soft: rgba(143, 176, 255, 0.14);
  --mk: #5a4a12;
  --ok: #5cd08a;
  --ok-bg: rgba(92, 208, 138, 0.13);
  --no: #ff8a7a;
  --no-bg: rgba(255, 138, 122, 0.13);
  --warn: #fbbf24;
  --warn-bg: #3b2f13;
  --mut: #9a978f;
  color-scheme: dark;
}

html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
}

*, *::before, *::after {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 15.5px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: var(--bg);
  z-index: 20;
}

/* ==========================================================================
   HEADER & NAVIGAȚIE PASTILĂ
   ========================================================================== */
header {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 15;
  background: var(--bg);
  border-bottom: 1px solid var(--bd);
  padding: 10px 14px 10px;
}

.hdr-inner {
  max-width: 820px;
  margin: 0 auto;
}

.hdr-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 8px;
}

h1 {
  font-size: 16.5px;
  font-weight: 700;
  margin: 0;
  letter-spacing: -0.01em;
}

h2 {
  font-size: 19px;
  font-weight: 700;
  margin: 10px 0 10px;
  letter-spacing: -0.01em;
}

h3 {
  font-size: 16px;
  font-weight: 700;
  margin: 12px 0 6px;
}

nav, .chips {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

button {
  font: inherit;
  font-size: 13.8px;
  font-weight: 500;
  color: inherit;
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 999px;
  padding: 7px 13px;
  cursor: pointer;
  transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.08s ease;
  touch-action: manipulation;
}

button:hover:not(:disabled) {
  border-color: var(--ac);
}

button:active:not(:disabled) {
  transform: scale(0.98);
}

button:disabled {
  opacity: 0.55;
  cursor: default;
}

button.on {
  background: var(--ac);
  color: #ffffff;
  border-color: var(--ac);
}

:root[data-theme="dark"] button.on {
  color: #0e1320;
  font-weight: 600;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) button.on {
    color: #0e1320;
    font-weight: 600;
  }
}

.theme-btn {
  padding: 5px 10px;
  font-size: 15px;
  line-height: 1;
  min-width: 38px;
  min-height: 34px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

/* ==========================================================================
   LAYOUT PRINCIPAL, CARDURI & CALLOUT-URI DE EXAMEN
   ========================================================================== */
main {
  max-width: 820px;
  margin: 0 auto;
  padding: 14px 14px 52px;
}

.chips {
  margin-bottom: 12px;
}

.card {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 12px;
  padding: 15px 16px;
  margin: 10px 0;
}

.card-alert {
  background: var(--warn-bg);
  border: 1px solid var(--warn);
  border-left: 4px solid var(--warn);
  border-radius: 12px;
  padding: 14px 16px;
  margin: 10px 0 14px;
}

.card-info {
  background: var(--ac-soft);
  border: 1px solid var(--bd);
  border-left: 4px solid var(--ac);
  border-radius: 12px;
  padding: 12px 14px;
  margin: 10px 0;
}

/* Box-uri dedicate în lecțiile integrale */
.callout-trap {
  background: var(--warn-bg);
  border: 1px solid var(--warn);
  border-left: 4px solid var(--no);
  border-radius: 10px;
  padding: 11px 13px;
  margin: 10px 0 6px;
  font-size: 14.6px;
}

.callout-jur {
  background: var(--ac-soft);
  border: 1px solid var(--ac);
  border-left: 4px solid var(--ac);
  border-radius: 10px;
  padding: 11px 13px;
  margin: 10px 0 6px;
  font-size: 14.6px;
}

.lesson-sec {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 12px;
  padding: 14px 16px;
  margin: 11px 0;
}

.lesson-sec h3 {
  margin: 0 0 8px;
  font-size: 16px;
  color: var(--ac);
}

.lesson-sec ul, .lesson-sec ol {
  margin: 6px 0 4px;
  padding-left: 20px;
}

.lesson-sec li {
  margin: 6px 0;
}

.lesson-sec ul ul {
  margin: 4px 0 4px;
  padding-left: 18px;
}

.lesson-hdr {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin: 6px 0 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--bd);
}

.lesson-hdr h2 {
  margin: 0;
}

.chip-done {
  border-color: var(--ok);
}

.mut {
  color: var(--mut);
  font-size: 13.5px;
}

.small {
  font-size: 13.8px;
}

.row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
  margin-top: 12px;
}

.between {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

mark {
  background: var(--mk);
  color: inherit;
  border-radius: 3px;
  padding: 1px 4px;
}

/* ==========================================================================
   ARBORE SCHEME (C1–C7)
   ========================================================================== */
.tree > ul {
  list-style: none;
  margin: 0;
  padding: 0;
}

.tree > ul > li {
  background: var(--card);
  border: 1px solid var(--bd);
  border-left: 4px solid var(--ac);
  border-radius: 10px;
  padding: 11px 13px;
  margin: 10px 0;
}

.tree ul ul {
  list-style: none;
  margin: 7px 0 2px;
  padding-left: 12px;
  border-left: 2px solid var(--bd);
}

.tree ul ul li {
  margin: 5px 0;
  font-size: 14.8px;
}

.tree ul ul li::before {
  content: "→ ";
  color: var(--ac);
  font-weight: 600;
}

/* ==========================================================================
   TABELE, DETAILS, PROGRESS BAR, SEARCH
   ========================================================================== */
.wrap {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  margin: 8px 0;
  border-radius: 10px;
  border: 1px solid var(--bd);
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14.2px;
  background: var(--card);
}

td, th {
  border-bottom: 1px solid var(--bd);
  border-right: 1px solid var(--bd);
  padding: 8px 10px;
  vertical-align: top;
  text-align: left;
}

td:last-child, th:last-child {
  border-right: none;
}

tr:last-child td {
  border-bottom: none;
}

th {
  background: var(--card-alt);
  font-weight: 600;
}

details {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 10px;
  margin: 8px 0;
  padding: 0 13px;
}

summary {
  cursor: pointer;
  padding: 11px 0;
  font-weight: 500;
  list-style-position: outside;
}

.df {
  padding: 10px 0 13px;
  border-top: 1px dashed var(--bd);
  font-size: 14.8px;
}

.bar {
  height: 8px;
  background: var(--bd);
  border-radius: 99px;
  overflow: hidden;
  margin: 6px 0 12px;
}

.bar i {
  display: block;
  height: 100%;
  background: var(--ok);
  transition: width 0.25s ease;
}

.search-inp {
  width: 100%;
  font: inherit;
  font-size: 14.5px;
  padding: 9px 13px;
  border: 1px solid var(--bd);
  border-radius: 10px;
  background: var(--card);
  color: var(--fg);
  margin-bottom: 10px;
}

.search-inp:focus {
  outline: 2px solid var(--ac);
  border-color: var(--ac);
}

/* ==========================================================================
   FIȘE & GRILE EXAMEN + CRONOMETRU
   ========================================================================== */
.q {
  font-size: 16.2px;
  font-weight: 600;
  line-height: 1.48;
}

.a {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px dashed var(--bd);
}

.ok {
  border-color: var(--ok) !important;
  color: var(--ok);
}

.no {
  border-color: var(--no) !important;
  color: var(--no);
}

.badge {
  display: inline-block;
  font-size: 12px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 999px;
  border: 1px solid var(--bd);
  background: var(--card-alt);
  color: var(--mut);
}

.badge-ok {
  background: var(--ok-bg);
  border-color: var(--ok);
  color: var(--ok);
}

.badge-no {
  background: var(--no-bg);
  border-color: var(--no);
  color: var(--no);
}

.badge-ac {
  background: var(--ac-soft);
  border-color: var(--ac);
  color: var(--ac);
}

.timer-box {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 10px;
  padding: 9px 12px;
  margin-bottom: 10px;
}

.timer-val {
  font-variant-numeric: tabular-nums;
  font-weight: 700;
  font-size: 15px;
  color: var(--ac);
}

/* Opțiuni grilă A, B, C cu checkbox vizual */
.g-opt {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  width: 100%;
  text-align: left;
  border-radius: 10px;
  padding: 11px 12px;
  margin: 8px 0;
  background: var(--card);
  border: 1.5px solid var(--bd);
  line-height: 1.45;
  font-weight: 400;
  font-size: 15px;
}

.g-opt.sel {
  border-color: var(--ac);
  background: var(--ac-soft);
}

.g-opt.res-ok {
  border-color: var(--ok);
  background: var(--ok-bg);
}

.g-opt.res-no {
  border-color: var(--no);
  background: var(--no-bg);
}

.g-opt.res-miss {
  border-color: var(--ok);
  border-style: dashed;
  background: var(--ok-bg);
}

.g-let {
  flex: 0 0 26px;
  height: 26px;
  border-radius: 7px;
  border: 1.5px solid var(--bd);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 13px;
  background: var(--card-alt);
  margin-top: 1px;
}

.g-opt.sel .g-let {
  background: var(--ac);
  border-color: var(--ac);
  color: #fff;
}

:root[data-theme="dark"] .g-opt.sel .g-let {
  color: #0e1320;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .g-opt.sel .g-let {
    color: #0e1320;
  }
}

.g-opt.res-ok .g-let,
.g-opt.res-miss .g-let {
  background: var(--ok);
  border-color: var(--ok);
  color: #fff;
}

.g-opt.res-no .g-let {
  background: var(--no);
  border-color: var(--no);
  color: #fff;
}

.exp-box {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px dashed var(--bd);
}

.exp-item {
  font-size: 14px;
  padding: 7px 10px;
  border-radius: 8px;
  margin: 6px 0;
  background: var(--card-alt);
  border-left: 3px solid var(--bd);
}

.exp-item.is-t {
  border-left-color: var(--ok);
}

.exp-item.is-f {
  border-left-color: var(--no);
}

.warn-msg {
  font-size: 13.5px;
  color: var(--warn);
  background: var(--warn-bg);
  border: 1px solid var(--warn);
  border-radius: 8px;
  padding: 7px 11px;
  margin-top: 8px;
}

/* Grilă de salt rapid 1–60 */
.jump-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(36px, 1fr));
  gap: 5px;
  margin-top: 8px;
}

.j-btn {
  padding: 5px 0;
  font-size: 12.5px;
  border-radius: 8px;
  text-align: center;
}

.j-btn.cur {
  outline: 2px solid var(--ac);
  outline-offset: 1px;
  font-weight: 700;
}

.j-btn.st-ok {
  background: var(--ok-bg);
  border-color: var(--ok);
  color: var(--ok);
}

.j-btn.st-no {
  background: var(--no-bg);
  border-color: var(--no);
  color: var(--no);
}

.j-btn.st-ans {
  background: var(--ac-soft);
  border-color: var(--ac);
  color: var(--ac);
}

/* Diagramă cascadă / flux pentru Aprofundări */
.steps {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  margin: 8px 0;
}

.step {
  background: var(--card-alt);
  border: 1px solid var(--bd);
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 13.5px;
  font-weight: 600;
}

.arrow {
  color: var(--ac);
  font-weight: 700;
}

.plan-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  cursor: pointer;
}

.plan-item input[type="checkbox"] {
  width: 19px;
  height: 19px;
  accent-color: var(--ok);
  margin-top: 2px;
  flex-shrink: 0;
}

.plan-done {
  text-decoration: line-through;
  color: var(--mut);
}

.confirm-inline {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--no-bg);
  border: 1px solid var(--no);
  border-radius: 999px;
  padding: 3px 10px;
  font-size: 13px;
}

.confirm-inline button {
  padding: 3px 9px;
  font-size: 12.5px;
}
</style>
</head>
<body>
<!-- HEADER STICKY CU TITLU, TOGGLE TEMĂ ȘI CELE 8 TAB-URI -->
<header>
  <div class="hdr-inner">
    <div class="hdr-top">
      <h1>⚖️ Drept civil – Curs complet, scheme și 60 de grile (C1–C7)</h1>
      <button id="themeBtn" class="theme-btn" type="button" title="Schimbă tema lumină/întuneric" aria-label="Schimbă tema">🌙</button>
    </div>
    <nav id="nav" aria-label="Navigație principală"></nav>
  </div>
</header>

<main id="app"></main>

<script>
/* ==========================================================================
   UTILITARE DE FORMATARE & TEMĂ
   ========================================================================== */
const m = s => String(s)
  .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
  .replace(/==(.+?)==/g, "<mark>$1</mark>");

const T = a => "<ul>" + a.map(x =>
  Array.isArray(x)
    ? "<li>" + m(x[0]) + (x[1] && x[1].length ? T(x[1]) : "") + "</li>"
    : "<li>" + m(x) + "</li>"
).join("") + "</ul>";

const sh = a => a.map(x => [Math.random(), x]).sort((x, y) => x[0] - y[0]).map(x => x[1]);

const eqArr = (a, b) => {
  if (!a || !b || a.length !== b.length) return false;
  const s1 = [...a].sort((x, y) => x - y);
  const s2 = [...b].sort((x, y) => x - y);
  return s1.every((v, i) => v === s2[i]);
};

const LET = ["A", "B", "C"];

function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem("civTheme"); } catch (e) {}
  if (saved === "dark" || saved === "light") {
    document.documentElement.setAttribute("data-theme", saved);
  }
  updateThemeBtn();
}

function isDarkActive() {
  const attr = document.documentElement.getAttribute("data-theme");
  if (attr === "dark") return true;
  if (attr === "light") return false;
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
}

function updateThemeBtn() {
  const btn = document.getElementById("themeBtn");
  if (!btn) return;
  btn.textContent = isDarkActive() ? "☀️" : "🌙";
}

function toggleTheme() {
  const next = isDarkActive() ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("civTheme", next); } catch (e) {}
  updateThemeBtn();
}

/* ==========================================================================
   0. CURS COMPLET (C1–C7) – TOATĂ MATERIA INTEGRALĂ PENTRU NOTA 10
   ========================================================================== */
const CURS = [
  {
    id: 1,
    code: "C1",
    title: "C1 · Introducere în dreptul civil",
    html: `
      <div class="lesson-sec">
        <h3>1. Cele 3 sensuri ale noțiunii de „drept”</h3>
        <ul>
          <li><b>Dreptul obiectiv (pozitiv):</b> totalitatea regulilor de conduită care reglementează relațiile sociale dintre persoane, instituite sau recunoscute de stat și asigurate, la nevoie, prin forța de constrângere a statului; există independent de aplicarea lor într-un caz concret.</li>
          <li><b>Dreptul subiectiv:</b> facultatea (prerogativa) recunoscută de dreptul obiectiv unei persoane, într-un raport juridic concret, de a avea o anumită conduită și de a pretinde altora o conduită corespunzătoare, la nevoie cu ajutorul statului (ex.: vânzătorul pretinde prețul).</li>
          <li><b>Știința dreptului:</b> disciplina care studiază normele, instituțiile și raporturile juridice.</li>
        </ul>
      </div>
      <div class="lesson-sec">
        <h3>2. Diviziunea drept public vs. drept privat</h3>
        <ul>
          <li><b>Criteriul principal de delimitare:</b> <mark>calitatea în care intervine statul</mark> în raportul juridic.</li>
          <li><b>Dreptul public:</b> reglementează relațiile în care statul apare ca autoritate, titular al puterii publice (drept constituțional, administrativ, financiar, penal, procesual).</li>
          <li><b>Dreptul privat:</b> reglementează relațiile dintre particulari, aflați pe poziție de egalitate juridică, pentru ocrotirea intereselor private (drept civil, comercial, dreptul familiei).</li>
        </ul>
        <div class="callout-trap">
          <b>⚠️ Capcană de examen:</b> Atunci când statul sau o unitate administrativ-teritorială acționează în circuitul civil cu privire la un bun din <b>domeniul său privat</b> (ex.: încheie o vânzare sau o locațiune), fără prerogative de autoritate publică, raportul juridic aparține <b>dreptului privat</b>.
        </div>
      </div>
      <div class="lesson-sec">
        <h3>3. Definiția, egalitatea juridică, dreptul comun și sistemul monist</h3>
        <ul>

  {id:1,c:"C1",q:"Cu privire la sensurile noțiunii de „drept” și la diviziunea dreptului în public și privat:",o:["dreptul obiectiv reprezintă prerogativa recunoscută unei persoane într-un raport juridic concret de a pretinde o anumită conduită subiectului pasiv;","criteriul principal de distincție dintre dreptul public și dreptul privat îl constituie calitatea în care intervine statul în raportul juridic;","atunci când statul încheie un contract de închiriere având ca obiect un bun din domeniul său privat, raportul juridic guvernat de egalitatea părților aparține sferei dreptului privat."],k:[1,2],e:["Fals — Descrie dreptul subiectiv (prerogativa concretă a titularului), nu dreptul obiectiv (totalitatea normelor juridice generale).","Adevărat — Criteriul de delimitare dintre dreptul public și cel privat îl constituie calitatea în care intervine statul (autoritate publică vs. poziție de egalitate).","Adevărat — Când statul acționează în circuitul civil cu privire la bunuri din domeniul său privat, fără prerogative de autoritate, raportul este de drept privat."]},
  {id:2,c:"C1",q:"Caracterul de drept comun al dreptului civil (art. 2 alin. 2 C.civ.) presupune că:",o:["dispozițiile Codului civil se aplică exclusiv raporturilor dintre persoane fizice, raporturile dintre profesioniști rămânând guvernate de Codul comercial din 1887;","normele dreptului civil se aplică domeniilor la care se referă litera sau spiritul dispozițiilor sale, ori de câte ori normele speciale ale altor ramuri de drept privat nu dispun altfel;","normele Codului civil înlătură automat de la aplicare normele speciale din dreptul familiei sau din legislația societăților, datorită forței juridice superioare a Codului civil."],k:[1],e:["Fals — Codul comercial din 1887 a fost abrogat prin art. 230 lit. c) din Legea nr. 71/2011, iar art. 3 alin. (1) C.civ. aplică Codul civil și raporturilor dintre profesioniști.","Adevărat — Caracterul de drept comun (art. 2 alin. 2 C.civ.) înseamnă că normele civile completează celelalte ramuri de drept privat ori de câte ori norma specială tace.","Fals — Dimpotrivă, norma specială derogă de la cea generală; dreptul civil intervine numai unde norma specială nu dispune altfel."]},
  {id:3,c:"C1",q:"În privința obiectului și a specificului raporturilor de drept civil:",o:["poziția de egalitate juridică a părților presupune în mod necesar ca ambele părți să aibă exact aceleași drepturi și obligații în cadrul raportului juridic;","relațiile patrimoniale cuprind atât raporturile reale, cât și raporturile obligaționale;","dreptul la nume și dreptul la domiciliu aparțin categoriei relațiilor nepatrimoniale care privesc identificarea persoanei."],k:[1,2],e:["Fals — Egalitatea juridică înseamnă absența mijloacelor proprii de constrângere, nu egalitate cantitativă/simetrică de drepturi și obligații.","Adevărat — Raporturile patrimoniale se împart în reale (proprietate și dezmembrăminte) și obligaționale (creanțe).","Adevărat — Numele, domiciliul, reședința și starea civilă sunt atribute nepatrimoniale de identificare a persoanei (art. 59 C.civ.)."]},
  {id:4,c:"C1",q:"Constituie dezmembrăminte ale dreptului de proprietate privată:",o:["dreptul de uzufruct, dreptul de uz și dreptul de abitație;","dreptul de servitute, dreptul de superficie și dreptul de ipotecă;","dreptul de superficie și dreptul de servitute."],k:[0,2],e:["Adevărat — Uzufructul, uzul și abitația fac parte din cele 5 dezmembrăminte ale proprietății (U-U-A-S-S).","Fals — Ipoteca este un drept real accesoriu (de garanție), nu un dezmembrământ al dreptului de proprietate.","Adevărat — Superficia și servitutea completează enumerarea celor 5 dezmembrăminte ale proprietății private."]},
  {id:5,c:"C1",q:"Raporturile personale nepatrimoniale reglementate de dreptul civil:",o:["nu fac obiectul Codului civil actual, care reglementează, conform art. 2 alin. (1) C.civ., exclusiv raporturile evaluabile în bani;","nu pot fi ocrotite prin mijloace de drept civil, încălcarea lor atrăgând exclusiv sancțiuni penale;","sunt lipsite de conținut economic direct evaluabil în bani și vizează existența și integritatea persoanei, identificarea acesteia și creația intelectuală."],k:[2],e:["Fals — Art. 2 alin. (1) C.civ. prevede expres că Codul civil reglementează atât raporturile patrimoniale, cât și pe cele nepatrimoniale.","Fals — Drepturile nepatrimoniale sunt apărate civil (încetarea atingerii ilicite, daune morale și materiale — art. 252–256 C.civ.).","Adevărat — Definiția și cele trei categorii ale relațiilor nepatrimoniale (existență/integritate, identificare, creație intelectuală)."]},

  // [C2] 6–11
  {id:6,c:"C2",q:"În delimitarea dreptului civil față de celelalte ramuri ale sistemului de drept:",o:["criteriul fundamental (determinant) îl reprezintă metoda de reglementare, iar obiectul de reglementare are caracter subsecvent;","caracterul normelor, calitatea subiectelor, specificul sancțiunilor și principiile proprii constituie criterii auxiliare de delimitare;","sancțiunile civile au caracter reparator, spre deosebire de sancțiunile penale care au caracter punitiv."],k:[1,2],e:["Fals — Criteriile sunt inversate: obiectul este criteriul fundamental (determinant), iar metoda (egalitatea juridică) are caracter subsecvent.","Adevărat — Acestea sunt cele patru criterii auxiliare de delimitare a dreptului civil.","Adevărat — Sancțiunea civilă urmărește repararea prejudiciului și restabilirea situației anterioare, spre deosebire de scopul punitiv al pedepsei penale."]},
  {id:7,c:"C2",q:"În clasificarea normelor de drept civil după caracterul conduitei prescrise:",o:["normele dispozitive supletive se aplică numai în măsura în care părțile nu au convenit altfel prin voința lor;","normele imperative onerative interzic o anumită conduită, cum este interdicția încheierii locațiunii pentru o durată mai mare de 49 de ani (art. 1783 C.civ.);","nu se poate deroga prin convenții sau acte juridice unilaterale de la legile care interesează ordinea publică sau de la bunele moravuri (art. 11 C.civ.)."],k:[0,2],e:["Adevărat — Norma supletivă intervine numai în absența unei stipulații contrare a părților.","Fals — Art. 1783 C.civ. interzice o conduită, fiind o normă imperativă prohibitivă, nu onerativă.","Adevărat — Reproducere fidelă a art. 11 C.civ."]},
  {id:8,c:"C2",q:"Părțile încheie un contract de locațiune pentru un spațiu comercial pe o durată de 60 de ani, depășind durata maximă de 49 de ani stabilită de art. 1783 C.civ. În această situație:",o:["norma art. 1783 C.civ. are caracter dispozitiv permisiv, motiv pentru care termenul de 60 de ani produce efecte pe deplin valabile;","termenul stipulat de părți se reduce de drept la 49 de ani;","contractul de locațiune este lovit în întregime de nulitate absolută, neputând produce niciun efect juridic."],k:[1],e:["Fals — Art. 1783 C.civ. este o normă imperativă prohibitivă de la care părțile nu pot deroga.","Adevărat — Potrivit art. 1783 C.civ., dacă părțile stipulează un termen mai lung de 49 de ani, acesta se reduce de drept la 49 de ani.","Fals — Legea instituie sancțiunea reducerii de drept a termenului, nu nulitatea totală a locațiunii."]},
  {id:9,c:"C2",q:"În sistemul monist al actualului Cod civil, în legătură cu noțiunea de profesionist și raporturile cu ramurile învecinate:",o:["exploatarea unei întreprinderi presupune în mod obligatoriu urmărirea unui scop lucrativ (obținerea de profit);","sunt considerați profesioniști toți cei care exploatează o întreprindere, noțiune care include, potrivit art. 8 alin. (1) din Legea nr. 71/2011, comerciantul, întreprinzătorul, operatorul economic și orice alte persoane autorizate;","raporturile de familie au fost reintegrate în Codul civil începând cu 1 octombrie 2011, după ce anterior fuseseră reglementate separat prin Codul familiei din 1954."],k:[1,2],e:["Fals — Art. 3 alin. (3) C.civ. definește exploatarea unei întreprinderi „indiferent dacă are sau nu un scop lucrativ”.","Adevărat — Coroborarea art. 3 alin. (2) C.civ. cu art. 8 alin. (1) din Legea nr. 71/2011.","Adevărat — Codul civil 1864 → Codul familiei 1954 → reintegrat în Codul civil din 2011."]},
  {id:10,c:"C2",q:"În delimitarea dreptului civil față de dreptul internațional privat și dreptul procesual civil:",o:["prezența unui element de extraneitate într-un raport de drept privat atrage incidența normelor conflictuale pentru determinarea legii aplicabile;","dreptul procesual civil aparține dreptului privat, întrucât reclamantul și pârâtul se află pe poziție de egalitate juridică față de instanța de judecată;","evicțiunea desemnează sancțiunea penală aplicabilă debitorului care refuză cu rea-credință predarea bunului vândut."],k:[0],e:["Adevărat — Elementul de extraneitate declanșează norma conflictuală din dreptul internațional privat.","Fals — Dreptul procesual civil este o ramură de drept public, deoarece instanța exercită puterea de autoritate a statului.","Fals — Evicțiunea este pierderea proprietății lucrului (total/parțial) ori tulburarea cumpărătorului în exercitarea prerogativelor de proprietar."]},
  {id:11,c:"C2",q:"Privind principiile fundamentale ale dreptului civil:",o:["buna-credință nu este prezumată de lege, trebuind dovedită de partea care o invocă în fața instanței;","cerința exercitării cu bună-credință vizează exclusiv drepturile subiective, nu și executarea obligațiilor civile;","potrivit art. 30 C.civ., rasa, naționalitatea, religia, sexul, vârsta, averea sau gradul de cultură nu au nicio influență asupra capacității civile."],k:[2],e:["Fals — Art. 14 alin. (2) C.civ. dispune expres: „Buna-credință se prezumă până la proba contrară”.","Fals — Art. 14 alin. (1) C.civ. impune buna-credință atât în exercitarea drepturilor, cât și în executarea obligațiilor civile.","Adevărat — Enunțul principiului egalității în fața legii civile din art. 30 C.civ."]},

  // [C3] 12–18
  {id:12,c:"C3",q:"Potrivit art. 1 alin. (2) C.civ., în cazurile neprevăzute de lege se aplică, în ordine:",o:["principiile generale ale dreptului, apoi uzanțele și, în lipsa acestora, analogia legii;","uzanțele, apoi dispozițiile legale privitoare la situații asemănătoare (analogia legii) și, când nu există asemenea dispoziții, principiile generale ale dreptului;","analogia legii, apoi uzanțele și, în ultimă instanță, doctrina juridică majoritară."],k:[1],e:["Fals — Ordinea este inversată; principiile generale intervin ultimele.","Adevărat — Ordinea exactă din art. 1 alin. (2) C.civ.: lege → uzanțe → analogie → principii generale.","Fals — Uzanțele preced analogia legii, iar doctrina nu este izvor de drept civil."]},
  {id:13,c:"C3",q:"În reglementarea art. 1 C.civ., uzanțele ca izvor de drept civil:",o:["includ atât obiceiul (cutuma), cât și uzurile profesionale;","se aplică în materiile reglementate prin lege chiar și atunci când legea nu face trimitere la ele, cu singura condiție să fie conforme bunelor moravuri;","se prezumă că există, până la proba contrară, dacă au fost publicate în culegeri elaborate de entități sau organisme autorizate în domeniu."],k:[0,2],e:["Adevărat — Definiția legală din art. 1 alin. (6) C.civ.","Fals — Potrivit art. 1 alin. (3) C.civ., în materiile reglementate prin lege, uzanțele se aplică numai în măsura în care legea trimite expres la ele.","Adevărat — Prezumția relativă de existență instituită de art. 1 alin. (5) teza a II-a C.civ."]},
  {id:14,c:"C3",q:"Cu privire la legea în sens lato sensu ca izvor al dreptului civil:",o:["regimul juridic general al proprietății și al moștenirii se reglementează prin lege organică (art. 73 alin. 3 lit. m din Constituție);","Guvernul poate emite ordonanțe simple, în temeiul unei legi speciale de abilitare, chiar și în domenii care fac obiectul legilor organice;","ordonanțele de urgență ale Guvernului nu pot fi adoptate în domeniul legilor constituționale."],k:[0,2],e:["Adevărat — Art. 73 alin. (3) lit. m) din Constituția României.","Fals — Art. 115 alin. (1) din Constituție permite emiterea ordonanțelor simple numai în domenii care NU fac obiectul legilor organice.","Adevărat — Interdicție expresă în art. 115 alin. (6) din Constituție."]},
  {id:15,c:"C3",q:"Referitor la izvoarele scrise ale dreptului civil:",o:["hotărârile Guvernului se emit pentru organizarea executării legilor și constituie izvoare de drept civil atunci când cuprind norme civile;","actele autorităților administrației publice locale nu pot fi niciodată izvoare ale dreptului civil, deoarece au aplicabilitate limitată teritorial;","actualul Cod civil (Legea nr. 287/2009) a intrat în vigoare la 1 octombrie 2011 și este structurat într-un Titlu preliminar și 7 cărți."],k:[0,2],e:["Adevărat — HG se emit pentru organizarea executării legilor și constituie izvoare de drept civil când conțin norme civile.","Fals — Actele autorităților locale sunt izvoare ale dreptului civil dacă cuprind norme civile, aplicându-se în raza lor teritorială (art. 7 C.civ.).","Adevărat — Data intrării în vigoare (1 octombrie 2011) și structura Legii nr. 287/2009."]},
  {id:16,c:"C3",q:"Privind rolul jurisprudenței și al doctrinei în dreptul civil român:",o:["hotărârile judecătorești pronunțate în litigii concrete constituie, ca regulă, izvor formal de drept civil, având efecte obligatorii erga omnes;","doctrina nu este izvor de drept civil, dar servește ca instrument de interpretare neoficială a normelor juridice;","deciziile Curții Constituționale de admitere a excepției de neconstituționalitate și deciziile ÎCCJ pronunțate în recurs în interesul legii (RIL) reprezintă excepții în care jurisprudența are caracter obligatoriu."],k:[1,2],e:["Fals — Jurisprudența nu este, ca regulă, izvor de drept civil; hotărârile produc efecte doar inter partes (art. 435 C.proc.civ.).","Adevărat — Doctrina nu este izvor formal, ci instrument de interpretare neoficială.","Adevărat — Deciziile CCR (art. 147 alin. 4 Constituție) și deciziile RIL (art. 517 alin. 4 C.proc.civ.) sunt excepții consacrate."]},
  {id:17,c:"C3",q:"Referitor la deciziile Înaltei Curți de Casație și Justiție în recurs în interesul legii (RIL) și hotărârile prealabile pentru dezlegarea unor chestiuni de drept (DCD):",o:["decizia pronunțată în recurs în interesul legii produce efecte retroactive asupra hotărârilor judecătorești examinate și modifică situația părților din acele procese;","dezlegarea dată printr-o hotărâre prealabilă (DCD) este obligatorie pentru instanța care a solicitat dezlegarea de la data pronunțării deciziei, iar pentru celelalte instanțe de la data publicării în Monitorul Oficial;","dezlegarea dată printr-o decizie RIL este obligatorie pentru instanțe de la data publicării deciziei în Monitorul Oficial al României, Partea I."],k:[1,2],e:["Fals — Art. 517 alin. (2) C.proc.civ. prevede expres că decizia RIL nu are efecte asupra hotărârilor examinate și nici asupra situației părților din acele procese.","Adevărat — Regula dublei date de obligativitate din art. 521 alin. (3) C.proc.civ.","Adevărat — Regula din art. 517 alin. (4) C.proc.civ."]},
  {id:18,c:"C3",q:"Este adevărat că:",o:["în materiile reglementate de Codul civil, normele dreptului Uniunii Europene se aplică în mod prioritar, indiferent de calitatea sau statutul părților (art. 5 C.civ.);","dovada existenței și a conținutului uzanțelor revine, ca regulă, părții interesate care le invocă;","legea civilă în sens stricto sensu desemnează orice act normativ cu dispoziții civile, inclusiv hotărârile Guvernului și ordonanțele de urgență."],k:[0,1],e:["Adevărat — Reproducerea exactă a art. 5 C.civ.","Adevărat — Regula generală din art. 1 alin. (5) teza I C.civ.","Fals — Acesta este sensul lato sensu; sensul stricto sensu desemnează exclusiv actele Parlamentului purtând denumirea de „lege”."]},

  // [C4] 19–28
  {id:19,c:"C4",q:"O lege ordinară care nu prevede o dată ulterioară de intrare în vigoare este publicată în Monitorul Oficial marți, 10 martie. Potrivit Constituției și Legii nr. 24/2000, această lege intră în vigoare:",o:["chiar în ziua publicării, marți, 10 martie, similar ordonanțelor de urgență ale Guvernului;","după 3 zile lucrătoare de la data publicării, excluzând zilele nelucrătoare;","vineri, 13 martie, la ora 00:00 (termenul de 3 zile calendaristice calculându-se cu începere de la data publicării și expirând la ora 24:00 a celei de-a treia zi)."],k:[2],e:["Fals — Doar OUG (cu depunere prealabilă la Cameră) și alte acte normative (ex. HG) intră în vigoare la publicare; legile intră la 3 zile.","Fals — Art. 12 alin. (1) din Legea nr. 24/2000 impune calculul pe zile calendaristice, nu pe zile lucrătoare.","Adevărat — 10 martie (ziua 1), 11 martie (ziua 2), 12 martie (ziua 3, expiră la 24:00) → intrare în vigoare vineri, 13 martie, ora 00:00."]},
  {id:20,c:"C4",q:"Cu privire la ieșirea din vigoare a legii civile:",o:["abrogarea unei norme care, la rândul ei, a abrogat o lege anterioară are ca efect repunerea automată în vigoare a legii inițiale;","neaplicarea îndelungată în practică a unei norme civile (desuetudinea) nu produce abrogarea acesteia;","abrogarea poate fi expresă sau tacită, precum și totală sau parțială."],k:[1,2],e:["Fals — Abrogarea este definitivă (art. 64 din Legea nr. 24/2000) și nu repune în vigoare actul inițial abrogat.","Adevărat — Desuetudinea nu abrogă o normă civilă.","Adevărat — Clasificarea clasică a abrogării după formă (expresă/tacită) și întindere (totală/parțială)."]},
  {id:21,c:"C4",q:"În materia principiilor aplicării legii civile în timp:",o:["principiul neretroactivității legii civile este de ordine publică și nu admite nicio excepție în materie civilă;","ultraactivitatea legii vechi reprezintă regula generală aplicabilă situațiilor juridice născute după intrarea în vigoare a legii noi;","norma civilă interpretativă (interpretare autentică) produce efecte retroactive, de la data intrării în vigoare a normei interpretate."],k:[0],e:["Adevărat — Neretroactivitatea (art. 15 alin. 2 Constituție, art. 6 alin. 1 C.civ.) admite excepție constituțională exclusiv pentru legea penală sau contravențională mai favorabilă.","Fals — Ultraactivitatea este excepția și privește situații anterioare în curs, niciodată situații născute după legea nouă.","Fals — Potrivit art. 9 alin. (2) C.civ., norma interpretativă produce efecte numai pentru viitor."]},
  {id:22,c:"C4",q:"Un contract de împrumut cu executare pe 15 ani a fost încheiat în anul 2010 cu încălcarea unei condiții de validitate prevăzute de legea de la acea dată, dar eliminate de noul Cod civil intrat în vigoare la 1 octombrie 2011. Dacă în anul 2014 se solicită anularea contractului:",o:["contractul devine valabil de la 1 octombrie 2011, prin aplicarea imediată a legii noi mai favorabile validității actului;","validitatea și efectele contractului (inclusiv cele produse după 1 octombrie 2011) rămân supuse legii în vigoare la data încheierii lui;","efectele viitoare ale contractului, scadente după 1 octombrie 2011, sunt supuse noului Cod civil în temeiul art. 6 alin. (6) C.civ."],k:[1],e:["Fals — Art. 6 alin. (3) C.civ.: actele nule sau anulabile sub legea veche rămân supuse legii vechi și nu devin valabile potrivit legii noi.","Adevărat — Ultraactivitatea legii vechi în materia contractelor: art. 6 alin. (2)–(3) C.civ. și art. 102 alin. (1) L. 71/2011.","Fals — Art. 6 alin. (6) C.civ. privește situații juridice legale limitativ enumerate, nu situații contractuale."]},
  {id:23,c:"C4",q:"Referitor la prescripțiile extinctive, decăderile și uzucapiunile începute și neîmplinite la 1 octombrie 2011:",o:["ca regulă generală, acestea sunt în întregime supuse dispozițiilor legale care le-au instituit (art. 6 alin. 4 C.civ.);","pentru o prescripție începută sub imperiul Decretului nr. 167/1958, instanța poate invoca excepția prescripției din oficiu chiar dacă litigiul se judecă după 1 octombrie 2011 (Decizia RIL nr. 1/2014);","Legea nr. 71/2011 nu prevede nicio derogare de la aplicarea legii vechi în privința cauzelor de suspendare sau întrerupere a prescripțiilor în curs."],k:[0,1],e:["Adevărat — Regula din art. 6 alin. (4) C.civ. și art. 201 L. 71/2011.","Adevărat — Soluția obligatorie stabilită de ÎCCJ prin Decizia RIL nr. 1/2014.","Fals — Art. 203 și art. 204 din Legea nr. 71/2011 instituie două derogări exprese (art. 2532 pct. 6–7 suspendare și art. 2539 alin. 2 teza II întrerupere 6 luni)."]},
  {id:24,c:"C4",q:"Potrivit art. 6 alin. (6) C.civ., dispozițiile legii noi se aplică de îndată efectelor viitoare ale situațiilor juridice născute anterior intrării sale în vigoare, dacă acestea subzistă, atunci când derivă din:",o:["raporturile de proprietate, inclusiv regimul general al bunurilor, și raporturile de vecinătate;","starea și capacitatea persoanelor, căsătorie, filiație, adopție și obligația legală de întreținere;","faptele juridice ilicite săvârșite anterior intrării în vigoare a legii noi, dacă prejudiciul este reparat după această dată."],k:[0,1],e:["Adevărat — Raporturile de proprietate (inclusiv regimul general al bunurilor) și de vecinătate sunt expres enumerate în art. 6 alin. (6) C.civ.","Adevărat — Starea și capacitatea, căsătoria, filiația, adopția și obligația legală de întreținere intră expres în art. 6 alin. (6) C.civ.","Fals — Faptele juridice ilicite și efectele lor sunt guvernate de legea de la data săvârșirii lor (art. 6 alin. 2 C.civ.)."]},
  {id:25,c:"C4",q:"În ceea ce privește aplicarea legii civile în spațiu și asupra persoanelor:",o:["actele normative ale autorităților administrației publice locale se aplică pe întreg teritoriul țării, dacă nu conțin o clauză expresă de limitare;","cetățenii străini și apatrizii sunt asimilați, în condițiile legii, cu cetățenii români în ceea ce privește drepturile și libertățile lor civile;","în raporturile cu element de extraneitate, legea aplicabilă bunului este, de regulă, legea locului situării acestuia, iar contractul este guvernat prioritar de legea aleasă de părți."],k:[1,2],e:["Fals — Potrivit art. 7 C.civ., actele organelor administrației publice locale se aplică numai în raza teritorială a acestora.","Adevărat — Principiul asimilării străinilor și apatrizilor în privința drepturilor civile.","Adevărat — Regulile conflictuale de bază pentru bunuri (lex rei sitae) și contracte (lex voluntatis)."]},
  {id:26,c:"C4",q:"Privind formele și rezultatul interpretării legii civile:",o:["interpretarea autentică aparține exclusiv Curții Constituționale;","interpretarea extensivă este admisibilă inclusiv în cazul normelor care instituie excepții sau enumerări limitative;","interpretarea legii de către instanța de judecată (interpretarea jurisdicțională) se face numai în scopul aplicării ei în cazul dedus judecății (art. 9 alin. 3 C.civ.)."],k:[2],e:["Fals — Art. 9 alin. (1) C.civ.: interpretarea oficială autentică aparține organului care a adoptat norma civilă.","Fals — Interpretarea extensivă este interzisă în privința normelor de excepție sau enumerărilor limitative (art. 10 C.civ.).","Adevărat — Textul exact al art. 9 alin. (3) C.civ."]},
  {id:27,c:"C4",q:"În materia interpretării logice a normelor civile și a art. 10 C.civ.:",o:["argumentul a fortiori operează sub două forme: a majori ad minus (cine poate mai mult poate și mai puțin) și a minori ad maius (cui îi este interzis mai puțin îi este interzis cu atât mai mult);","legile care derogă de la o dispoziție generală, care restrâng exercițiul unor drepturi civile sau care prevăd sancțiuni civile se aplică numai în cazurile expres și limitativ prevăzute de lege;","analogia legii permite instanței să extindă o sancțiune civilă la o situație asemănătoare nereglementată expres de lege."],k:[0,1],e:["Adevărat — Cele două subspecii clasice ale argumentului logic a fortiori.","Adevărat — Textul exact al art. 10 C.civ. privind interzicerea analogiei.","Fals — Art. 10 C.civ. interzice expres aplicarea prin analogie a normelor care prevăd sancțiuni civile."]},
  {id:28,c:"C4",q:"Cu privire la metodele de interpretare a legii civile:",o:["interpretarea teleologică urmărește identificarea sensului normei juridice prin raportare la scopul avut în vedere de legiuitor la adoptarea ei;","argumentul per a contrario permite aplicarea unei norme de excepție la situații similare neprevăzute expres de text;","interpretarea doctrinară (științifică) devine interpretare oficială obligatorie din momentul în care este preluată în considerentele unei hotărâri judecătorești."],k:[0],e:["Adevărat — Definiția interpretării teleologice (după scopul legii).","Fals — Extinderea la situații similare este analogia (interzisă la excepții); per a contrario limitează aplicarea la cazul expres și o neagă în afara lui.","Fals — Doctrina rămâne interpretare neoficială, fără forță obligatorie generală."]},

  // [C5] 29–39
  {id:29,c:"C5",q:"Referitor la caracterele și izvoarele raportului juridic civil concret:",o:["izvorul raportului juridic civil concret (faptul juridic lato sensu) se identifică cu izvorul formal al dreptului civil prevăzut de art. 1 C.civ.;","raportul juridic civil născut dintr-un act juridic civil are caracter dublu volițional (voința legiuitorului și voința autorului sau a părților actului);","faptele juridice licite cuprind gestiunea de afaceri, plata nedatorată și îmbogățirea fără justă cauză."],k:[1,2],e:["Fals — Art. 1 privește izvorul dreptului civil (norme generale), iar faptul juridic lato sensu este izvorul raportului juridic civil concret.","Adevărat — Raportul născut din act juridic îmbină voința legiuitorului cu voința părților/autorului actului.","Adevărat — Cele trei fapte juridice licite din Codul civil (art. 1330–1348 C.civ.)."]},
  {id:30,c:"C5",q:"Se încadrează în categoria faptelor juridice stricto sensu (în opoziție cu actul juridic civil):",o:["distrugerea din culpă a bunului altuia, care generează obligația legală de reparare a prejudiciului;","plata nedatorată și decesul unei persoane fizice care determină deschiderea moștenirii;","acceptarea unei oferte de vânzare și întocmirea unui testament."],k:[0,1],e:["Adevărat — Acțiune omenească ilicită fără intenția de a produce efecte juridice = fapt juridic stricto sensu.","Adevărat — Faptul juridic stricto sensu include acțiunile fără intenție de efecte juridice (licite precum plata nedatorată sau ilicite) și evenimentele (naștere, deces).","Fals — Acceptarea ofertei și testamentul sunt acte juridice civile (manifestări de voință cu intenția de a produce efecte juridice)."]},
  {id:31,c:"C5",q:"În materia pluralității subiectelor raportului juridic civil:",o:["în raporturile obligaționale cu pluralitate de debitori, regula de drept comun este divizibilitatea (obligația conjunctă), potrivit art. 1424 C.civ.;","solidaritatea se prezumă între debitorii unei obligații contractate în exercițiul activității unei întreprinderi (art. 1446 C.civ.);","proprietatea comună în devălmășie se caracterizează prin deținerea de către fiecare titular a unei cote-părți matematice determinate din dreptul de proprietate."],k:[0,1],e:["Adevărat — Regula generală de drept comun a divizibilității obligației (art. 1424 C.civ.).","Adevărat — Excepția prezumției de solidaritate pasivă între profesioniști (art. 1446 C.civ.).","Fals — Cotele determinate caracterizează coproprietatea (art. 634); în devălmășie (art. 667) nu există cote determinate."]},
  {id:32,c:"C5",q:"Privind schimbarea creditorului prin cesiunea de creanță:",o:["prin cesiunea de creanță, obligația inițială se stinge și se naște o obligație nouă, lipsită automat de garanțiile creanței anterioare;","debitorul cedat este ținut să plătească cesionarului din momentul în care acceptă cesiunea printr-un înscris cu dată certă sau primește o comunicare scrisă a cesiunii (pe suport hârtie ori în format electronic);","contractul de cesiune de creanță este lovit de nulitate dacă nu este semnat de debitorul cedat, acesta având calitatea de parte contractantă."],k:[1],e:["Fals — Descrie novația; în cesiune se transmite aceeași creanță împreună cu garanțiile ei.","Adevărat — Condițiile de opozabilitate față de debitorul cedat din art. 1578 alin. (1) C.civ.","Fals — Cesiunea se încheie valabil doar între cedent și cesionar; debitorul cedat nu este parte la contract."]},
  {id:33,c:"C5",q:"În materia schimbării debitorului prin preluarea datoriei (art. 1599–1608 C.civ.) și prin novație (art. 1609–1614 C.civ.):",o:["în cazul preluării datoriei, obligația fideiusorului sau a terțului garant se menține de drept, chiar dacă aceștia nu și-au dat acordul la preluare;","novația se prezumă de lege ori de câte ori părțile modifică termenul de plată al unei obligații;","preluarea datoriei convenită între debitorul inițial și un terț își produce efectele numai dacă creditorul își dă acordul (art. 1605 C.civ.)."],k:[2],e:["Fals — Potrivit art. 1602 alin. (3) C.civ., obligația fideiusorului sau a terțului garant se stinge dacă nu și-au dat acordul la preluare.","Fals — Potrivit art. 1610 C.civ., novația nu se prezumă; intenția de a nova trebuie să fie neîndoielnică.","Adevărat — Textul exact al art. 1605 C.civ."]},
  {id:34,c:"C5",q:"Comparând preluarea datoriei cu novația prin schimbare de debitor:",o:["în preluarea datoriei, debitorul inițial nu este liberat dacă se dovedește că noul debitor era insolvabil la data preluării, iar creditorul a consimțit fără a cunoaște această împrejurare (art. 1601 C.civ.);","în cazul novației, ipotecile care garantează creanța inițială însoțesc de plin drept noua creanță, fără a fi necesară vreo prevedere expresă;","în novația prin schimbarea debitorului, ipotecile legate de creanța inițială nu subzistă asupra bunurilor debitorului inițial fără consimțământul acestuia (art. 1611 alin. 2 C.civ.)."],k:[0,2],e:["Adevărat — Regula din art. 1601 C.civ. privind insolvabilitatea preexistentă necunoscută creditorului.","Fals — Art. 1611 alin. (1) C.civ.: ipotecile nu însoțesc noua creanță decât dacă s-a prevăzut expres.","Adevărat — Regula din art. 1611 alin. (2) C.civ."]},
  {id:35,c:"C5",q:"Cu privire la capacitatea de folosință a persoanei fizice:",o:["o persoană fizică majoră poate renunța valabil, printr-un act autentic notarial, la o parte din capacitatea sa de folosință;","drepturile copilului conceput sunt recunoscute de la concepțiune, însă numai dacă el se naște viu (art. 36 C.civ.);","capacitatea de folosință a persoanei fizice poate fi îngrădită prin convenția părților, în limitele ordinii publice."],k:[1],e:["Fals — Art. 29 alin. (2) C.civ. interzice absolut renunțarea, în tot sau în parte, la capacitatea de folosință sau de exercițiu.","Adevărat — Regula infans conceptus consacrată de art. 36 C.civ.","Fals — Art. 29 alin. (1) C.civ.: capacitatea poate fi îngrădită numai în cazurile și condițiile prevăzute de lege, nu prin convenție."]},
  {id:36,c:"C5",q:"Minorul dobândește capacitate deplină de exercițiu înainte de împlinirea vârstei de 18 ani:",o:["prin căsătorie; dacă însă căsătoria este anulată, minorul care a fost de bună-credință la încheierea căsătoriei păstrează capacitatea deplină de exercițiu (art. 39 C.civ.);","prin hotărârea instanței de tutelă, pentru motive temeinice, dacă a împlinit vârsta de 16 ani, cu ascultarea părinților sau a tutorelui și luarea avizului consiliului de familie, când este cazul (art. 40 C.civ.);","de drept, la împlinirea vârstei de 16 ani, prin simpla încheiere a unui contract individual de muncă."],k:[0,1],e:["Adevărat — Art. 39 alin. (1) și (2) C.civ. privind căsătoria și buna-credință la anulare.","Adevărat — Art. 40 C.civ. privind capacitatea de exercițiu anticipată de la 16 ani.","Fals — Art. 42 C.civ. conferă doar dreptul de a exercita singur drepturile și de a dispune de veniturile din muncă, nu capacitate deplină de exercițiu generală."]},
  {id:37,c:"C5",q:"Comparând regimul persoanei lipsite de capacitate de exercițiu cu cel al persoanei cu capacitate de exercițiu restrânsă:",o:["minorul de 12 ani poate încheia singur acte de administrare care nu îl prejudiciază;","atât minorul de 12 ani, cât și minorul de 15 ani pot încheia singuri acte de conservare și acte de dispoziție de mică valoare, cu caracter curent și care se execută la momentul încheierii lor;","potrivit Deciziei ÎCCJ (Complet DCD) nr. 58/2024, acceptarea expresă a moștenirii de către un minor lipsit de capacitate de exercițiu reprezintă un act de dispoziție și necesită încuviințarea (autorizarea) instanței de tutelă."],k:[1,2],e:["Fals — Actele de administrare neprejudiciabile sunt permise singur doar la capacitate restrânsă (art. 41 alin. 3), nu la lipsa capacității (art. 43 alin. 3).","Adevărat — Ambele categorii de acte se regăsesc atât în art. 41 alin. (3), cât și în art. 43 alin. (3) C.civ.","Adevărat — Dezlegarea obligatorie dată de ÎCCJ – Completul DCD prin Decizia nr. 58/2024."]},
  {id:38,c:"C5",q:"Potrivit reglementării actuale a măsurilor de ocrotire a majorului (modificată prin Legea nr. 140/2022) și a sancțiunilor în materia capacității de exercițiu:",o:["consilierea judiciară se dispune pe maximum 3 ani (atrăgând capacitate de exercițiu restrânsă), iar tutela specială pe maximum 5 ani, putând fi prelungită până la maximum 15 ani în cazul deteriorării permanente a facultăților mintale;","numirea unui asistent pentru încheierea actelor juridice de către notarul public (pe cel mult 2 ani) restrânge capacitatea de exercițiu a majorului, acesta nemaiavând dreptul să semneze singur contracte;","actele încheiate cu încălcarea regulilor privind capacitatea de exercițiu sunt anulabile numai dacă persoana ocrotită dovedește producerea unui prejudiciu material."],k:[0],e:["Adevărat — Duratele exacte din art. 168 alin. (2)–(3) și efectele din art. 41 alin. (1¹) și art. 43 alin. (1) C.civ. (Legea nr. 140/2022).","Fals — Asistența notarială (max. 2 ani) nu aduce atingere capacității de exercițiu; asistentul nu semnează în numele majorului și nu încuviințează.","Fals — Art. 44 alin. (1) C.civ.: actele sunt anulabile chiar fără dovedirea unui prejudiciu."]},
  {id:39,c:"C5",q:"Referitor la frauda incapabilului și la capacitatea persoanei juridice:",o:["dacă persoana cu capacitate de exercițiu restrânsă a folosit manopere dolosive pentru a induce în eroare cocontractantul că este capabilă, instanța, la cererea părții induse în eroare, poate menține contractul ca sancțiune civilă adecvată (art. 45 C.civ.);","principiul specialității capacității de folosință se aplică tuturor persoanelor juridice de drept privat, inclusiv societăților cu scop lucrativ;","actul juridic încheiat de o persoană juridică fără scop lucrativ cu încălcarea scopului stabilit prin lege, actul de constituire sau statut este lovit de nulitate absolută (art. 206 alin. 2 și 3 C.civ.)."],k:[0,2],e:["Adevărat — Textul exact al art. 45 teza a II-a C.civ.","Fals — Art. 206 alin. (2) C.civ. limitează principiul specialității exclusiv la persoanele juridice fără scop lucrativ.","Adevărat — Sancțiunea nulității absolute prevăzută expres de art. 206 alin. (3) C.civ."]},

  // [C6] 40–47
  {id:40,c:"C6",q:"Cu privire la clasificarea drepturilor subiective patrimoniale:",o:["dreptul potestativ este un drept real accesoriu care conferă titularului prerogativa urmăririi bunului în mâinile oricărui terț;","drepturile de creanță sunt în număr limitativ prevăzut de Codul civil și au un subiect pasiv nedeterminat;","drepturile reale sunt limitate ca număr (art. 551 C.civ.), absolute, opozabile erga omnes și conferă titularului prerogativele urmăririi și preferinței."],k:[2],e:["Fals — Dreptul potestativ este o categorie distinctă (putere de modificare unilaterală a unei situații juridice), nu un drept real accesoriu.","Fals — Drepturile de creanță sunt nelimitate ca număr și au subiect pasiv determinat.","Adevărat — Caracterele și prerogativele specifice ale drepturilor reale (art. 551 C.civ.)."]},
  {id:41,c:"C6",q:"În materia drepturilor reale accesorii:",o:["gajul poate avea ca obiect numai bunuri mobile corporale sau titluri negociabile emise în formă materializată (art. 2480 C.civ.);","dreptul de retenție este opozabil terților numai dacă a fost înscris în cartea funciară sau în registrul de publicitate mobiliară;","dreptul de retenție se stinge dacă cel interesat consemnează suma pretinsă sau oferă retentorului o garanție suficientă (art. 2499 alin. 1 C.civ.)."],k:[0,2],e:["Adevărat — Textul exact al art. 2480 C.civ.","Fals — Potrivit art. 2498 alin. (1) C.civ., dreptul de retenție este opozabil terților fără a fi necesară nicio formalitate de publicitate.","Adevărat — Modalitatea de stingere prevăzută de art. 2499 alin. (1) C.civ."]},
  {id:42,c:"C6",q:"Referitor la drepturile nepatrimoniale, principale/accesorii și modalitățile drepturilor:",o:["drepturile personalității (dreptul la viață, sănătate, demnitate, propria imagine, viață privată) nu sunt transmisibile (art. 58 alin. 2 C.civ.);","ipoteca, gajul, fideiusiunea, clauza penală și arvuna sunt drepturi accesorii, soarta lor depinzând de cea a dreptului principal;","un drept afectat de un termen suspensiv sau de o condiție suspensivă își produce efectele definitiv și irevocabil încă din momentul nașterii sale."],k:[0,1],e:["Adevărat — Art. 58 alin. (1) și (2) C.civ.","Adevărat — Exemple consacrate de drepturi accesorii (accesorium sequitur principale).","Fals — Efectele imediate, definitive și irevocabile caracterizează dreptul pur și simplu, nu pe cel afectat de modalități."]},
  {id:43,c:"C6",q:"În reglementarea Codului civil, abuzul de drept (art. 15 C.civ.):",o:["presupune inexistența dreptului subiectiv invocat de autor, confundându-se cu delictul civil obișnuit;","constă în exercitarea unui drept în scopul de a vătăma sau păgubi pe altul ori într-un mod excesiv și nerezonabil, contrar bunei-credințe;","atrage obligația de reparare a prejudiciului cauzat prin exercițiul abuziv al dreptului (art. 1353 C.civ.)."],k:[1,2],e:["Fals — Abuzul de drept privește exercitarea unui drept subiectiv existent, spre deosebire de delictul civil unde autorul acționează fără drept.","Adevărat — Definiția legală din art. 15 C.civ.","Adevărat — Excepția prevăzută de art. 1353 C.civ., care impune repararea pagubei produse prin exercițiul abuziv."]},
  {id:44,c:"C6",q:"După obiectul prestației, în clasificarea obligațiilor în obligații de a da, de a face și de a nu face:",o:["obligația de a da constă în îndatorirea vânzătorului de a preda material bunul vândut cumpărătorului;","obligația de a strămuta proprietatea implică și obligația de a preda lucrul, precum și pe aceea de a-l conserva până la predare (art. 1483 alin. 1 C.civ.);","obligația de a da poate avea ca obiect o simplă abținere a debitorului de la o faptă determinată."],k:[1],e:["Fals — Obligația de a da constă în constituirea sau transmiterea unui drept real; predarea materială este obligație de a face.","Adevărat — Textul exact al art. 1483 alin. (1) C.civ.","Fals — Abținerea constituie obiectul obligației de a nu face, nu al obligației de a da."]},
  {id:45,c:"C6",q:"Potrivit art. 1481 C.civ., în distincția dintre obligațiile de rezultat și obligațiile de mijloace:",o:["în cazul obligației de mijloace, simpla neatingere a rezultatului urmărit naște o prezumție de neexecutare culpabilă în sarcina debitorului;","pentru a stabili dacă o obligație este de mijloace sau de rezultat se ține seama îndeosebi de modul stipulării în contract, existența și natura contraprestației, gradul de risc și influența celeilalte părți asupra executării;","în cazul obligației de rezultat, debitorul este ținut să procure creditorului rezultatul promis, iar în cazul obligației de mijloace, să folosească toate mijloacele necesare pentru atingerea acestuia."],k:[1,2],e:["Fals — Prezumția de neexecutare operează la obligația de rezultat; la mijloace, creditorul trebuie să dovedească lipsa de diligență.","Adevărat — Cele patru criterii din art. 1481 alin. (3) C.civ.","Adevărat — Definițiile exacte din art. 1481 alin. (1) și (2) C.civ."]},
  {id:46,c:"C6",q:"Cu privire la obligațiile scriptae in rem și propter rem:",o:["obligația dobânditorului unui imobil înscris în cartea funciară de a respecta locațiunea notată anterior în cartea funciară (art. 1811 lit. a C.civ.) este o obligație opozabilă terților (scriptae in rem);","în cazul imobilelor neînscrise în cartea funciară, dreptul locatarului este opozabil dobânditorului dacă data certă a locațiunii este anterioară datei certe a înstrăinării (art. 1811 lit. b C.civ.);","obligația propter rem nu se transmite dobânditorului bunului în caz de înstrăinare, decât dacă părțile încheie o convenție expresă de preluare a datoriei."],k:[0,1],e:["Adevărat — Art. 1811 lit. a) C.civ. este exemplul-tip de obligație scriptae in rem.","Adevărat — Textul exact al art. 1811 lit. b) C.civ.","Fals — Obligația propter rem este legată de stăpânirea bunului și se transmite automat dobânditorului odată cu bunul."]},
  {id:47,c:"C6",q:"Referitor la obligațiile naturale și la distincția dintre obiectul și conținutul raportului juridic civil:",o:["debitorul care a executat de bunăvoie o obligație după împlinirea termenului de prescripție extinctivă poate solicita restituirea plății ca plată nedatorată;","prescripția extinctivă nu operează de plin drept, însă după împlinirea termenului de prescripție cel obligat poate să refuze executarea prestației (art. 2506 alin. 1 și 2 C.civ.);","obiectul raportului juridic civil constă în totalitatea drepturilor subiective și a obligațiilor corelative ale părților."],k:[1],e:["Fals — Art. 1471 și art. 2506 alin. (3) C.civ. exclud restituirea pentru obligațiile naturale executate de bunăvoie.","Adevărat — Textul exact al art. 2506 alin. (1) și (2) C.civ.","Fals — Totalitatea drepturilor și obligațiilor formează conținutul raportului juridic; obiectul este conduita efectivă a părților."]},

  // [C7] 48–55
  {id:48,c:"C7",q:"Privind noțiunile de bun, patrimoniu și universalitate de fapt:",o:["bunurile care alcătuiesc o universalitate de fapt (art. 541 C.civ.) nu pot face, separat, obiectul unor acte sau raporturi juridice;","dacă pasivul patrimonial al unei persoane depășește activul patrimonial, acea persoană încetează să mai aibă un patrimoniu;","patrimoniul este o universalitate juridică ce cuprinde toate drepturile și datoriile evaluabile în bani ale unei persoane, putând face obiectul unei diviziuni sau afectațiuni numai în cazurile și condițiile prevăzute de lege (art. 31 C.civ.)."],k:[2],e:["Fals — Art. 541 C.civ. permite ca bunurile dintr-o universalitate de fapt să facă și separat obiectul unor acte sau raporturi juridice.","Fals — Orice persoană are un patrimoniu; dacă pasivul depășește activul, patrimoniul continuă să existe ca patrimoniu negativ.","Adevărat — Regula din art. 31 alin. (1) și (2) C.civ."]},
  {id:49,c:"C7",q:"Potrivit dispozițiilor actualului Cod civil privind bunurile imobile (art. 537–538 C.civ.):",o:["rămân bunuri imobile materialele separate în mod provizoriu de un imobil, pentru a fi din nou întrebuințate, atât timp cât sunt păstrate în aceeași formă, precum și părțile integrante temporar detașate destinate reintegrării;","materialele aduse pentru a fi întrebuințate în locul celor vechi devin bunuri imobile abia în momentul încorporării lor fizice efective în construcție;","spre deosebire de Codul civil de la 1864, actualul Cod civil nu mai reglementează categoria „imobilelor prin destinație”, bunurile respective fiind calificate drept bunuri mobile."],k:[0,2],e:["Adevărat — Textul exact al art. 538 alin. (1) C.civ.","Fals — Art. 538 alin. (2) C.civ.: devin imobile din momentul în care au dobândit această destinație, anterior încorporării fizice.","Adevărat — Actualul Cod civil a suprimat imobilele prin destinație din 1864, calificându-le mobile (eventual accesorii cf. art. 546)."]},
  {id:50,c:"C7",q:"În materia bunurilor mobile (art. 539–542 C.civ.):",o:["bogățiile solului și subsolului, fructele neculese încă, plantațiile și construcțiile încorporate în sol devin mobile prin anticipație atunci când, prin voința părților, sunt privite în natura lor individuală în vederea detașării lor;","calificarea unui bun ca mobil prin anticipație este opozabilă terților din simplul moment al încheierii contractului dintre părți, fără nicio formalitate de publicitate;","drepturile reale asupra bunurilor imobile sunt calificate de art. 542 C.civ. drept bunuri mobile prin determinarea legii."],k:[0],e:["Adevărat — Definiția legală din art. 540 alin. (1) C.civ.","Fals — Art. 540 alin. (2) C.civ. cere expres notarea în cartea funciară pentru opozabilitatea față de terți.","Fals — Art. 542 alin. (1) C.civ.: drepturile reale asupra imobilelor sunt supuse regulilor referitoare la bunurile imobile."]},
  {id:51,c:"C7",q:"Cu privire la clasificările bunurilor prevăzute de art. 543–545 C.civ.:",o:["prin act juridic, părțile pot transforma un bun nefungibil în bun fungibil și un bun indivizibil prin natura sa în bun divizibil;","sunt consumptibile bunurile mobile a căror întrebuințare obișnuită implică înstrăinarea sau consumarea substanței, iar un bun consumptibil prin natura sa poate deveni neconsumptibil dacă, prin act juridic, i se schimbă întrebuințarea;","un bun consumptibil este întotdeauna fungibil, iar un bun neconsumptibil este întotdeauna nefungibil."],k:[1],e:["Fals — Codul civil reglementează calificarea convențională într-un singur sens: fungibil→nefungibil (art. 543 alin. 3), consumptibil→neconsumptibil (art. 544 alin. 3), divizibil→indivizibil (art. 545 alin. 3).","Adevărat — Reproducere exactă a art. 544 alin. (2) și (3) C.civ.","Fals — Cele două clasificări sunt independente (ex. ultima sticlă dintr-o recoltă celebră = consumptibil, nefungibil; două exemplare ale aceleiași cărți = neconsumptibil, fungibil)."]},
  {id:52,c:"C7",q:"În regimul bunurilor principale și al bunurilor accesorii (art. 546 C.civ.):",o:["destinația comună prin care un bun devine accesoriu al altui bun poate fi stabilită de orice detentor precar (de exemplu, chiriașul care mobilează apartamentul închiriat);","separarea temporară a unui bun accesoriu de bunul principal nu îi înlătură calitatea de bun accesoriu;","încetarea calității de bun accesoriu nu poate fi opusă unui terț care a dobândit anterior drepturi privitoare la bunul principal."],k:[1,2],e:["Fals — Art. 546 alin. (2) C.civ.: destinația comună poate fi stabilită numai de proprietarul ambelor bunuri.","Adevărat — Textul exact al art. 546 alin. (5) C.civ.","Adevărat — Textul exact al art. 546 alin. (4) C.civ."]},
  {id:53,c:"C7",q:"A îi vinde lui B un tablou individual determinat (bun cert), părțile convenind ca predarea să aibă loc peste 10 zile. Înainte de predare, tabloul piere fortuit într-un incendiu neimputabil lui A. În lipsă de stipulație contrară:",o:["deoarece proprietatea s-a transferat lui B la momentul acordului de voințe (art. 1273 C.civ.), riscul pieirii fortuite este suportat automat de cumpărătorul B;","riscul contractului rămâne în sarcina vânzătorului A (debitorul obligației de predare), chiar dacă proprietatea fusese transferată cumpărătorului B (art. 1274 alin. 1 C.civ.);","dacă însă cumpărătorul B fusese pus în întârziere pentru preluarea tabloului înainte de incendiu, B preia riscul pieirii fortuite și nu se poate libera nici dacă dovedește că bunul ar fi pierit și în cazul predării la timp (art. 1274 alin. 2 C.civ.)."],k:[1,2],e:["Fals — Actualul Cod civil a abandonat regula res perit domino; transferul proprietății nu antrenează automat transferul riscului.","Adevărat — Art. 1274 alin. (1) C.civ. lasă riscul în sarcina debitorului predării până la predare.","Adevărat — Excepția strictă din art. 1274 alin. (2) C.civ. privind creditorul pus în întârziere."]},
  {id:54,c:"C7",q:"Cu privire la fructe și producte (art. 547–550, art. 948 C.civ.):",o:["dreptul de proprietate asupra fructelor naturale și industriale se dobândește la data separării de bunul care le-a produs, în timp ce dreptul de proprietate asupra fructelor civile se dobândește zi cu zi;","posesorul de bună-credință dobândește în proprietate atât fructele, cât și productele bunului posedat;","fructele naturale și industriale se dobândesc zi cu zi, iar fructele civile abia la momentul încasării efective a banilor."],k:[0],e:["Adevărat — Regulile exacte ale art. 550 alin. (2) și (3) C.civ.","Fals — Posesorul de bună-credință (art. 948 C.civ.) dobândește numai fructele; productele revin întotdeauna proprietarului.","Fals — Inversare dublă: fructele naturale/industriale la separare, iar fructele civile zi cu zi."]},
  {id:55,c:"C7",q:"Referitor la bunurile scoase din circuitul civil și la bunurile insesizabile:",o:["bunurile proprietate publică nu pot face obiectul niciunui act juridic, neputând fi date în administrare, concesiune sau închiriere;","debitorul poate renunța valabil, printr-o clauză contractuală, la beneficiul insesizabilității bunurilor de uz personal indispensabile traiului prevăzute de art. 727 C.proc.civ.;","bunurile proprietate publică sunt inalienabile, imprescriptibile și insesizabile, neputând fi dobândite de terți prin uzucapiune sau prin posesia de bună-credință asupra bunurilor mobile (art. 861 C.civ.)."],k:[2],e:["Fals — Art. 861 alin. (3) C.civ.: pot fi date în administrare/folosință și pot fi concesionate sau închiriate în condițiile legii.","Fals — Art. 730 C.proc.civ.: renunțarea la beneficiul dispozițiilor privind bunurile neurmăribile este nulă de drept.","Adevărat — Caracterele proprietății publice din art. 861 alin. (1) și (2) C.civ."]},

  // [Spețe] 56–60
  {id:56,c:"Spețe",q:"La 10 noiembrie 2025, X suferă o vătămare corporală gravă și permanentă într-un accident rutier produs din culpa lui Y. La 19 decembrie 2025 intră în vigoare Legea nr. 231/2025, care modifică art. 1391 alin. (1) C.civ., permițând expres membrilor familiei victimei rănite grav să ceară despăgubiri proprii (prejudiciu prin ricoșeu). În ianuarie 2026, soția lui X îl cheamă în judecată pe Y invocând textul modificat al art. 1391 alin. (1) C.civ. În raport cu art. 6 C.civ.:",o:["noua reglementare se aplică imediat procesului declanșat în 2026, deoarece suferința morală a soției continuă să se producă în viitor;","fapta ilicită săvârșită la 10 noiembrie 2025 rămâne supusă legii în vigoare la data săvârșirii sale (art. 6 alin. 2 C.civ.), astfel încât noua prevedere introdusă prin Legea nr. 231/2025 nu se aplică acestui accident;","instanța poate aplica retroactiv legea civilă nouă extinzând prin analogie excepția legii mai favorabile de la art. 15 alin. (2) din Constituție."],k:[1],e:["Fals — Răspunderea civilă delictuală nu intră în situațiile legale continue de la art. 6 alin. (6) C.civ.","Adevărat — Art. 6 alin. (1)–(2) C.civ.: faptele ilicite anterioare rămân guvernate de legea de la data săvârșirii lor.","Fals — Excepția art. 15 alin. (2) Constituție privește exclusiv legea penală/contravențională mai favorabilă și nu se extinde prin analogie în civil (art. 10 C.civ.)."]},
  {id:57,c:"Spețe",q:"Un minor în vârstă de 16 ani, fără capacitate deplină de exercițiu și fără încuviințarea părinților, îi vinde majorului Z un laptop în valoare de 6.000 lei, declarând verbal și simplu că are 18 ani. Ulterior, părinții minorului solicită anularea contractului. În această situație:",o:["simpla declarație a minorului că este capabil nu înlătură anulabilitatea actului, contractul fiind anulabil chiar fără dovedirea unui prejudiciu (art. 44 și art. 45 C.civ.);","majorul Z poate exercita și el acțiunea în anulare invocând lipsa încuviințării părinților minorului;","în urma anulării contractului, minorul este obligat la restituirea prețului primit numai în limita folosului realizat (art. 47 C.civ.)."],k:[0,2],e:["Adevărat — Art. 44 alin. (1) (fără dovada prejudiciului) + art. 45 teza I (simpla declarație nu înlătură anulabilitatea).","Fals — Art. 46 alin. (3) C.civ.: persoana capabilă nu poate opune anulabilitatea și nici cere anularea (doar menținerea cu ajustarea prestației).","Adevărat — Limita restituirii în favoarea incapabilului din art. 47 C.civ."]},
  {id:58,c:"Spețe",q:"O asociație culturală fără scop lucrativ (A) și două societăți comerciale (B și C) contractează împreună un împrumut bancar în legătură cu activitățile lor. În privința capacității și a regimului obligațiilor:",o:["asociația A are capacitatea de folosință limitată de principiul specialității (art. 206 alin. 2 C.civ.), iar un act străin de scopul său statutar este lovit de nulitate absolută;","între societățile B și C, pentru obligațiile asumate în exercițiul activității întreprinderilor lor, solidaritatea pasivă se prezumă (art. 1446 C.civ.);","asociația A nu poate fi considerată în niciun caz „profesionist” în sensul art. 3 C.civ., deoarece nu urmărește obținerea de profit."],k:[0,1],e:["Adevărat — Specialitatea capacității de folosință se aplică persoanelor juridice fără scop lucrativ (art. 206 alin. 2–3 C.civ.), sub sancțiunea nulității absolute.","Adevărat — Prezumția de solidaritate între profesioniști (art. 1446 C.civ.).","Fals — Art. 3 alin. (3) C.civ.: exploatarea unei întreprinderi există „indiferent dacă are sau nu un scop lucrativ”."]},
  {id:59,c:"Spețe",q:"X, proprietar al unei livezi și al unui tractor destinat în mod stabil și exclusiv lucrărilor agricole ale livezii, vinde lui Y atât livada, cât și 5 tone de mere din recolta neculeasă încă (pentru a fi culese de Y în toamnă). Părțile nu notează vânzarea merelor în cartea funciară. În această situație:",o:["în lipsă de stipulație contrară, tractorul (bun accesoriu, destinat de proprietarul ambelor bunuri) urmează situația juridică a livezii în caz de înstrăinare (art. 546 C.civ.);","merele neculese încă, privite de părți în vederea detașării, devin bunuri mobile prin anticipație (art. 540 C.civ.), însă calificarea nu este opozabilă terților în lipsa notării în cartea funciară;","proprietatea asupra celor 5 tone de mere (bunuri de gen) a trecut la Y chiar în momentul semnării contractului, anterior culegerii și cântăririi lor."],k:[0,1],e:["Adevărat — Tractorul îndeplinește condițiile bunului accesoriu (art. 546 C.civ.) și urmează situația juridică a livezii.","Adevărat — Mobile prin anticipație (art. 540 alin. 1), dar opozabile terților numai prin notarea în cartea funciară (art. 540 alin. 2).","Fals — Bunurile determinate generic (res genera) transmit proprietatea abia la individualizare (art. 1273 C.civ.)."]},
  {id:60,c:"Spețe",q:"D datorează lui C suma de 10.000 lei, garantată prin fideiusiune de F. Înainte de scadență, T încheie cu D un contract de preluare a datoriei, la care creditorul C își dă acordul, însă fideiusorul F nu este consultat. După împlinirea termenului de prescripție extinctivă, T plătește de bunăvoie suma lui C, ignorând că putea refuza plata, iar ulterior solicită restituirea sumei. În acest caz:",o:["obligația fideiusorului F s-a stins ca efect al preluării datoriei, întrucât acesta nu și-a dat acordul la preluare (art. 1602 alin. 3 C.civ.);","T nu are dreptul să ceară restituirea sumei executate de bunăvoie după împlinirea prescripției extinctive (art. 1471 și art. 2506 alin. 3 C.civ.);","primirea plății voluntare de către C după împlinirea prescripției constituie abuz de drept în sensul art. 15 C.civ. și atrage anularea plății."],k:[0,1],e:["Adevărat — Art. 1602 alin. (3) C.civ. stinge obligația fideiusorului care nu și-a dat acordul la preluarea datoriei.","Adevărat — Obligație naturală: executarea voluntară după prescripție nu dă drept la restituire (art. 1471 și art. 2506 alin. 3 C.civ.).","Fals — Primirea executării voluntare a unei obligații naturale nu constituie abuz de drept în sensul art. 15 C.civ."]}
];

// Cronometru opțional pentru Mod Simulare Examen
let Tmr = { sec: 0, running: false, id: null };

function fmtTime(sec) {
  const mm = String(Math.floor(sec / 60)).padStart(2, "0");
  const ss = String(sec % 60).padStart(2, "0");
  return `${mm}:${ss}`;
}

function stopTimer() {
  if (Tmr.id) { clearInterval(Tmr.id); Tmr.id = null; }
  Tmr.running = false;
}

function startTimer() {
  if (Tmr.running) return;
  Tmr.running = true;
  Tmr.id = setInterval(() => {
    Tmr.sec++;
    const el = document.getElementById("examTimerVal");
    if (el) el.textContent = fmtTime(Tmr.sec);
  }, 1000);
}

function resetTimer() {
  stopTimer();
  Tmr.sec = 0;
}
