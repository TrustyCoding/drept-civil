roduce efecte numai pentru viitor (art. 9 alin. 2 C.civ.)", "C": "interpretarea legii de către instanță se face numai în scopul aplicării ei în cazul dedus judecății (art. 9 alin. 3 C.civ.)"}, "a": ["B", "C"], "e": {"A": {"v": false, "t": "Codul civil actual a consacrat expres neretroactivitatea normei interpretative."}, "B": {"v": true, "t": "Art. 9 alin. (2) C.civ."}, "C": {"v": true, "t": "Art. 9 alin. (3) C.civ."}}}, {"n": 27, "m": "C4", "q": "Potrivit art. 10 C.civ. (interzicerea analogiei), se aplică numai în cazurile expres și limitativ prevăzute de lege normele care:", "o": {"A": "derogă de la o dispoziție generală", "B": "restrâng exercițiul unor drepturi civile sau prevăd sancțiuni civile", "C": "reglementează raporturile juridice patrimoniale generale dintre profesioniști"}, "a": ["A", "B"], "e": {"A": {"v": true, "t": "Art. 10 C.civ. (excepțiile sunt de strictă interpretare)."}, "B": {"v": true, "t": "Art. 10 C.civ."}, "C": {"v": false, "t": "Nu intră sub interdicția de la art. 10 C.civ."}}}, {"n": 28, "m": "C4", "q": "În privința metodelor și rezultatelor interpretării legii civile:", "o": {"A": "argumentul <em>a fortiori<\/em> (cu atât mai mult) include formele <em>a majori ad minus<\/em> (cine poate mai mult poate și mai puțin) și <em>a minori ad maius<\/em> (dacă e interzis mai puțin, cu atât mai mult e interzis mai mult)", "B": "metoda teleologică urmărește stabilirea sensului normei în funcție de scopul avut în vedere de legiuitor la adoptarea ei", "C": "interpretarea extensivă este obligatorie ori de câte ori legea stabilește enumerări limitative sau sancțiuni civile"}, "a": ["A", "B"], "e": {"A": {"v": true, "t": "Cele două forme ale argumentului <em>a fortiori<\/em>."}, "B": {"v": true, "t": "Definiția interpretării teleologice."}, "C": {"v": false, "t": "Interpretarea extensivă este interzisă la excepții, enumerări limitative și sancțiuni (art. 10)."}}}, {"n": 29, "m": "C5", "q": "Referitor la raportul juridic civil și caracterele sale:", "o": {"A": "caracterul dublu volițional este specific raporturilor juridice civile născute din acte juridice civile (voința legiuitorului + voința părților/autorului)", "B": "izvorul raportului juridic civil concret (faptul juridic <em>lato sensu<\/em>) se confundă cu izvorul formal al dreptului civil din art. 1 C.civ", "C": "elementele structurale cumulative ale raportului juridic civil sunt părțile, conținutul și obiectul"}, "a": ["A", "C"], "e": {"A": {"v": true, "t": "La fapte juridice caracterul este simplu volițional (doar voința legii); la acte juridice este dublu volițional."}, "B": {"v": false, "t": "Sunt noțiuni distincte (legea/uzanța vs. contractul/delictul/evenimentul)."}, "C": {"v": true, "t": "Cele 3 elemente cumulative."}}}, {"n": 30, "m": "C5", "q": "Constituie fapte juridice <em>stricto sensu<\/em> licite (izvoare de obligații civile):", "o": {"A": "gestiunea de afaceri, plata nedatorată și îmbogățirea fără justă cauză", "B": "contractul de vânzare și testamentul", "C": "fapta ilicită cauzatoare de prejudicii (delictul civil)"}, "a": ["A"], "e": {"A": {"v": true, "t": "Formula G-P-Î (art. 1330–1348 C.civ.)."}, "B": {"v": false, "t": "Sunt acte juridice civile (intenție de efecte juridice)."}, "C": {"v": false, "t": "Este fapt juridic <em>ilicit<\/em>."}}}, {"n": 31, "m": "C5", "q": "Cu privire la pluralitatea subiectelor raportului juridic civil:", "o": {"A": "în cazul proprietății pe cote-părți (coproprietate), fiecare coproprietar are determinată o cotă-parte ideală, pe când în devălmășie dreptul aparține simultan mai multor persoane fără cote determinate", "B": "în dreptul civil comun, obligația cu pluralitate de debitori este, ca regulă, divizibilă/conjunctă (art. 1424 C.civ.), însă solidaritatea pasivă se prezumă între debitorii unei obligații contractate în exercițiul activității unei întreprinderi (art. 1446 C.civ.)", "C": "solidaritatea pasivă se prezumă întotdeauna în toate contractele civile încheiate între persoane fizice neprofesioniști"}, "a": ["A", "B"], "e": {"A": {"v": true, "t": "Art. 634 vs. art. 667 C.civ."}, "B": {"v": true, "t": "Regula art. 1424 + excepția profesioniștilor art. 1446 C.civ."}, "C": {"v": false, "t": "Art. 1445: solidaritatea nu se prezumă în dreptul comun."}}}, {"n": 32, "m": "C5", "q": "Privind schimbarea creditorului prin cesiune de creanță (art. 1566–1592 C.civ.) vs. novație (art. 1609–1614 C.civ.):", "o": {"A": "în cesiunea de creanță, debitorul cedat nu este parte la contractul de cesiune, dar cesiunea îi devine opozabilă prin acceptare printr-un înscris cu dată certă sau prin comunicare scrisă ori electronică (art. 1578 C.civ.)", "B": "novația nu se prezumă, iar ipotecile care garantau creanța inițială nu trec asupra noii creanțe decât dacă părțile au prevăzut expres acest lucru (art. 1610–1611 C.civ.)", "C": "cesiunea de creanță stinge vechea obligație și o înlocuiește cu o obligație nouă, stingând automat toate garanțiile creanței"}, "a": ["A", "B"], "e": {"A": {"v": true, "t": "Art. 1573 și art. 1578 C.civ."}, "B": {"v": true, "t": "Art. 1610 și art. 1611 alin. (1) C.civ."}, "C": {"v": false, "t": "Acesta este efectul novației; cesiunea transmite aceeași creanță împreună cu garanțiile."}}}, {"n": 33, "m": "C5", "q": "Referitor la preluarea datoriei (art. 1599–1608 C.civ.):", "o": {"A": "contractul de preluare a datoriei încheiat între debitor și noul debitor își produce efectele față de creditor numai dacă acesta își dă acordul (art. 1605 C.civ.)", "B": "debitorul inițial nu este liberat dacă se dovedește că noul debitor era insolvabil la data preluării datoriei, iar creditorul a consimțit fără a cunoaște această împrejurare (art. 1601 C.civ.)", "C": "preluarea datoriei este reglementată de art. 1609–1614 C.civ. și stinge datoria veche creând una nouă"}, "a": ["A", "B"], "e": {"A": {"v": true, "t": "Art. 1605 C.civ."}, "B": {"v": true, "t": "Art. 1601 C.civ."}, "C": {"v": false, "t": "Preluarea datoriei este art. 1599–1608 și transmite aceeași datorie; art. 1609–1614 reglementează novația."}}}, {"n": 34, "m": "C5", "q": "În cazul unei preluări de datorie convenite cu acordul creditorului (art. 1602 alin. 3 C.civ.), soarta fideiusiunii constituite de un terț pentru debitorul inițial este următoarea:", "o": {"A": "fideiusiunea se menține automat, fără a fi necesar acordul fideiusorului", "B": "obligația fideiusorului se stinge dacă acesta nu și-a dat acordul la preluarea datoriei", "C": "fideiusorul devine de drept codebitor solidar împreună cu debitorul inițial și noul debitor"}, "a": ["B"], "e": {"A": {"v": false, "t": "Fideiusorul a garantat solvabilitatea debitorului inițial, nu a terțului preluator."}, "B": {"v": true, "t": "Art. 1602 alin. (3) C.civ."}, "C": {"v": false, "t": "Nu există un asemenea efect legal."}}}, {"n": 35, "m": "C5", "q": "Cu privire la capacitatea civilă de folosință a persoanei fizice (art. 29, art. 34–36 C.civ.):", "o": {"A": "nimeni nu poate renunța, în tot sau în parte, la capacitatea de folosință ori la capacitatea de exercițiu", "B": "drepturile copilului conceput sunt recunoscute de la concepțiune, însă numai dacă acesta se naște viu (<em>infans conceptus<\/em>, art. 36 C.civ.)", "C": "două persoane fizice pot conveni printr-un contract încheiat în formă autentică îngrădirea capacității de folosință a uneia dintre ele"}, "a": ["A", "B"], "e": {"A": {"v": true, "t": "Art. 29 alin. (2) C.civ."}, "B": {"v": true, "t": "Art. 36 C.civ."}, "C": {"v": false, "t": "Art. 29 alin. (1): îngrădirea operează exclusiv în cazurile și condițiile expres prevăzute de lege."}}}, {"n": 36, "m": "C5", "q": "Referitor la dobândirea anticipată a capacității depline de exercițiu (art. 39–40, art. 42 C.civ.):", "o": {"A": "în cazul anulării căsătoriei încheiate de un minor, acesta păstrează capacitatea deplină de exercițiu dacă a fost de bună-credință la încheierea căsătoriei (art. 39 alin. 2 C.civ.)", "B": "pentru motive temeinice, instanța de tutelă poate recunoaște minorului care a împlinit 16 ani capacitatea deplină de exercițiu, cu ascultarea părinților/tutorelui și luarea avizului consiliului de familie, când e cazul (art. 40 C.civ.)", "C": "încheierea de către minorul de 16 ani a unui contract individual de muncă cu încuviințarea părinților îi conferă automat capacitate deplină de exercițiu pentru toate actele civile (art. 42 C.civ.)"}, "a": ["A", "B"], "e": {"A": {"v": true, "t": "Art. 39 alin. (2) C.civ."}, "B": {"v": true, "t": "Art. 40 C.civ."}, "C": {"v": false, "t": "Art. 42 îi permite doar să exercite singur drepturile și obligațiile din acele acte și să dispună singur de veniturile dobândite, fără a-i conferi capacitate deplină generală."}}}, {"n": 37, "m": "C5", "q": "Comparând actele pe care le pot încheia singuri minorul sub 14 ani (art. 43 alin. 3) și minorul între 14 și 18 ani (art. 41 alin. 3), precum și ținând cont de Decizia ÎCCJ (DCD) nr. 58/2024:", "o": {"A": "minorul cu capacitate de exercițiu restrânsă (14–18 ani) poate încheia singur și acte de administrare care nu îl prejudiciază, pe când minorul lipsit de capacitate de exercițiu (sub 14 ani) nu poate încheia singur acte de administrare", "B": "potrivit Deciziei ÎCCJ (DCD) nr. 58/2024, acceptarea expresă a moștenirii de către un minor lipsit de capacitate de exercițiu reprezintă un act de dispoziție și necesită încuviințarea (autorizarea) instanței de tutelă", "C": "atât minorul sub 14 ani, cât și cel între 14 și 18 ani pot încheia singuri orice acte de administrare, inclusiv cele care îi prejudiciază"}, "a": ["A", "B"], "e": {"A": {"v": true, "t": "Diferența esențială între art. 41 alin. (3) și art. 43 alin. (3) C.civ."}, "B": {"v": true, "t": "Soluția obligatorie a ÎCCJ prin Decizia DCD nr. 58/2024."}, "C": {"v": false, "t": "Fals din ambele perspective (sub 14 nu poate administrare; 14–18 doar administrare care <em>nu<\/em> îl prejudiciază)."}}}, {"n": 38, "m": "C5", "q": "Cu privire la măsurile de ocrotire a majorului introduse prin Legea nr. 140/2022:", "o": {"A": "asistența pentru încheierea actelor juridice se dispune de notarul public pentru cel mult 2 ani și nu afectează capacitatea de exercițiu a majorului", "B": "consilierea judiciară se dispune pe cel mult 3 ani (atrăgând capacitate de exercițiu restrânsă), iar tutela specială pe cel mult 5 ani, putând fi prelungită până la cel mult 15 ani în caz de deteriorare permanentă (atrăgând lipsa capacității de exercițiu)", "C": "numirea unui asistent notarial restrânge automat capacitatea de exercițiu a majorului, asistentul semnând toate contractele în numele acestuia"}, "a": ["A", "B"], "e": {"A": {"v": true, "t": "Art. 1 și art. 3 din Legea nr. 140/2022."}, "B": {"v": true, "t": "Art. 41 alin. (1¹), art. 43, art. 168 C.civ."}, "C": {"v": false, "t": "Asistența notarială nu afectează capacitatea și asistentul nu semnează în numele majorului."}}}, {"n": 39, "m": "C5", "q": "Privind sancțiunile lipsei capacității de exercițiu (art. 44–47 C.civ.) și capacitatea persoanei juridice (art. 205–209 C.civ.):", "o": {"A": "actele încheiate cu încălcarea regulilor de capacitate de exercițiu sunt anulabile chiar fără dovedirea unui prejudiciu (art. 44 alin. 1), iar la anulare incapabilul restituie prestațiile numai în limita folosului realizat (art. 47)", "B": "principiul specialității capacității de folosință se aplică exclusiv persoanelor juridice fără scop lucrativ (art. 206 alin. 2 C.civ.), încălcarea lui atrăgând nulitatea absolută", "C": "persoana capabilă care a contractat cu un incapabil poate invoca oricând nulitatea relativă a contractului pentru a se libera de obligații"}, "a": ["A", "B"], "e": {"A": {"v": true, "t": "Art. 44 alin. (1) și art. 47 C.civ."}, "B": {"v": true, "t": "Art. 206 alin. (2)–(3) C.civ."}, "C": {"v": false, "t": "Art. 46 alin. (3): capabilul nu poate opune/invoca anulabilitatea; poate cere doar menținerea contractului cu reducerea/majorarea propriei prestații."}}}, {"n": 40, "m": "C6", "q": "Cu privire la conținutul și obiectul raportului juridic civil:", "o": {"A": "conținutul raportului juridic civil este format din totalitatea drepturilor subiective și obligațiilor corelative, în timp ce obiectul îl constituie conduita părților", "B": "în raporturile juridice civile complexe (ex.: vânzarea), fiecare parte are atât drepturi, cât și obligații corelative", "C": "dreptul subiectiv civil se confundă cu exercițiul concret al acestuia, astfel că neexercitarea lui determină întotdeauna inexistența dreptului"}, "a": ["A", "B"], "e": {"A": {"v": true, "t": "Distincția conținut vs. obiect."}, "B": {"v": true, "t": "Contractele sinalagmatice au conținut complex."}, "C": {"v": false, "t": "Dreptul subiectiv (posibilitatea) este distinct de exercițiul său efectiv."}}}, {"n": 41, "m": "C6", "q": "Referitor la drepturile reale și drepturile de creanță:", "o": {"A": "drepturile reale sunt limitate ca număr (art. 551 C.civ.) și conferă titularului prerogativele urmăririi și preferinței", "B": "drepturile de creanță sunt nelimitate ca număr, relative și opozabile <em>inter partes<\/em>", "C": "drepturile potestative sunt o subcategorie a drepturilor reale accesorii de garanție"}, "a": ["A", "B"], "e": {"A": {"v": true, "t": "<em>Numerus clausus<\/em> + urmărire și preferință."}, "B": {"v": true, "t": "Trăsăturile drepturilor de creanță."}, "C": {"v": false, "t": "Drepturile potestative formează o categorie intermediară, distinctă atât de drepturile reale, cât și de cele de creanță."}}}, {"n": 42, "m": "C6", "q": "Privind drepturile reale accesorii — gajul (art. 2480) și dreptul de retenție (art. 2495–2499 C.civ.):", "o": {"A": "gajul poate avea ca obiect numai bunuri mobile corporale sau titluri negociabile emise în formă materializată", "B": "dreptul de retenție este opozabil terților fără îndeplinirea vreunei formalități de publicitate (art. 2498 alin. 1) și se stinge dacă cel interesat consemnează suma datorată ori oferă o garanție suficientă (art. 2499 alin. 1)", "C": "dreptul de retenție poate fi exercitat în toate cazurile și de către posesorul de rea-credință, indiferent de prevederile legii"}, "a": ["A", "B"], "e": {"A": {"v": true, "t": "Art. 2480 C.civ."}, "B": {"v": true, "t": "Art. 2498 alin. (1) și art. 2499 alin. (1) C.civ."}, "C": {"v": false, "t": "Art. 2496 alin. (2): posesorul de rea-credință nu poate invoca retenția, cu excepția cazurilor expres prevăzute de lege."}}}, {"n": 43, "m": "C6", "q": "În legătură cu abuzul de drept (art. 15 și art. 1353 C.civ.):", "o": {"A": "abuzul de drept presupune exercitarea unui drept subiectiv existent în scopul de a vătăma sau păgubi pe altul ori într-un mod excesiv și nerezonabil, contrar bunei-credințe", "B": "cel care cauzează un prejudiciu chiar prin exercițiul abuziv al dreptului său este obligat să îl repare (art. 1353 C.civ.)", "C": "abuzul de drept privește inexistența dreptului subiectiv invocat, confundându-se întotdeauna cu delictul civil"}, "a": ["A", "B"], "e": {"A": {"v": true, "t": "Art. 15 C.civ."}, "B": {"v": true, "t": "Art. 1353 C.civ."}, "C": {"v": false, "t": "Privește <em>exercițiul<\/em> unui drept existent, nu inexistența lui."}}}, {"n": 44, "m": "C6", "q": "Clasificarea obligațiilor după obiectul lor (a da, a face, a nu face — art. 1483 C.civ.):", "o": {"A": "obligația de a da constă în îndatorirea de a constitui sau de a transmite un drept real", "B": "predarea materială a bunului vândut este o obligație de a face, iar obligația de a strămuta proprietatea implică și obligația de a preda lucrul și de a-l conserva până la predare (art. 1483 alin. 1 C.civ.)", "C": "obligația de a preda fizic cheia și autoturismul cumpărătorului este o obligație de a da"}, "a": ["A", "B"], "e": {"A": {"v": true, "t": "Definiția obligației de a da."}, "B": {"v": true, "t": "Predarea = a face; art. 1483 alin. (1) C.civ."}, "C": {"v": false, "t": "Predarea materială este întotdeauna obligație de a face."}}}, {"n": 45, "m": "C6", "q": "Cu privire la obligațiile de rezultat și obligațiile de mijloace (art. 1481 C.civ.):", "o": {"A": "în cazul obligației de rezultat, simpla neatingere a rezultatului promis prezumă neexecutarea culpabilă, în timp ce la obligația de mijloace creditorul trebuie să dovedească lipsa de diligență a debitorului", "B": "printre criteriile legale de calificare din art. 1481 alin. (3) se numără modul stipulării în contract, existența și natura contraprestației, gradul de risc și influența celeilalte părți", "C": "obligația medicului de a trata un pacient este, ca regulă, o obligație de rezultat, medicul garantând vindecarea"}, "a": ["A", "B"], "e": {"A": {"v": true, "t": "Regimul probatoriu distinct."}, "B": {"v": true, "t": "Cele 4 criterii din art. 1481 alin. (3) C.civ."}, "C": {"v": false, "t": "Medicul are, ca regulă, o obligație de mijloace (diligență)."}}}, {"n": 46, "m": "C6", "q": "Referitor la obligațiile <em>scriptae in rem<\/em> (art. 1811 C.civ.) și <em>propter rem<\/em>:", "o": {"A": "obligația <em>propter rem<\/em> incumbă deținătorului unui bun ca accesoriu al unui drept real și se transmite automat dobânditorului odată cu bunul, fără o convenție specială", "B": "în cazul înstrăinării unui imobil înscris în cartea funciară, locațiunea este opozabilă dobânditorului dacă a fost notată în cartea funciară (art. 1811 lit. a C.civ.)", "C": "obligațiile <em>scriptae in rem<\/em> nu pot fi niciodată opuse terților dobânditori ai bunului"}, "a": ["A", "B"], "e": {"A": {"v": true, "t": "Caracterul accesoriu și transmiterea automată a obligației <em>propter rem<\/em>."}, "B": {"v": true, "t": "Art. 1811 lit. a) C.civ. (pentru imobile neînscrise: dată certă anterioară înstrăinării, lit. b)."}, "C": {"v": false, "t": "Tocmai opozabilitatea față de terți este esența obligației <em>scriptae in rem<\/em>."}}}, {"n": 47, "m": "C6", "q": "În privința obligațiilor naturale (imperfecte — art. 1471, art. 2506 C.civ.):", "o": {"A": "prescripția extinctivă nu operează de plin drept, dar după împlinirea ei cel obligat poate refuza executarea prestației", "B": "cel care a executat de bunăvoie o obligație după ce termenul de prescripție s-a împlinit nu are dreptul să ceară restituirea prestației, chiar dacă la data executării nu știa că termenul era împlinit", "C": "obligația naturală poate fi executată silit prin intermediul executorului judecătoresc dacă creditorul dovedește buna sa credință"}, "a": ["A", "B"], "e": {"A": {"v": true, "t": "Art. 2506 alin. (1)–(2) C.civ."}, "B": {"v": true, "t": "Art. 2506 alin. (3) și art. 1471 C.civ."}, "C": {"v": false, "t": "Obligația naturală este lipsită de sancțiunea executării silite."}}}, {"n": 48, "m": "C7", "q": "Referitor la noțiunile de bun, patrimoniu și universalitate de fapt (art. 31, art. 535, art. 541 C.civ.):", "o": {"A": "patrimoniul există și atunci când pasivul (datoriile) depășește activul (drepturile) și poate face obiectul unei diviziuni sau afectațiuni numai în cazurile și condițiile prevăzute de lege", "B": "bunurile care alcătuiesc o universalitate de fapt (ex.: o bibliotecă sau un fond de comerț) pot face și separat obiectul unor acte juridice", "C": "drepturile de creanță și acțiunile societare nu sunt bunuri în sensul art. 535 C.civ., deoarece nu au existență materială"}, "a": ["A", "B"], "e": {"A": {"v": true, "t": "Art. 31 C.civ."}, "B": {"v": true, "t": "Art. 541 alin. (2) C.civ."}, "C": {"v": false, "t": "Art. 535 include expres bunurile <em>necorporale<\/em>."}}}, {"n": 49, "m": "C7", "q": "În privința clasificării bunurilor imobile în actualul Cod civil (art. 537–538, art. 542 C.civ.):", "o": {"A": "actualul Cod civil a eliminat categoria „imobilelor prin destinație” din 1864, acestea fiind astăzi bunuri mobile (eventual accesorii potrivit art. 546)", "B": "materialele aduse pentru a fi întrebuințate în locul celor vechi devin bunuri imobile din momentul în care au dobândit această destinație, chiar înainte de încorporare (art. 538 alin. 2 C.civ.)", "C": "materialele separate provizoriu de un imobil pentru a fi din nou întrebuințate devin automat bunuri mobile din clipa detașării lor"}, "a": ["A", "B"], "e": {"A": {"v": true, "t": "Corecție esențială față de vechiul Cod civil."}, "B": {"v": true, "t": "Art. 538 alin. (2) C.civ."}, "C": {"v": false, "t": "Art. 538 alin. (1): rămân imobile atât timp cât sunt păstrate în aceeași formă."}}}, {"n": 50, "m": "C7", "q": "Cu privire la bunurile mobile prin anticipație (art. 540 C.civ.):", "o": {"A": "bogățiile solului și subsolului, fructele neculese, plantațiile și construcțiile pot fi considerate bunuri mobile prin anticipație când, prin voința părților, sunt privite în natura lor individuală în vederea detașării", "B": "pentru opozabilitatea față de terți a caracterului de bun mobil prin anticipație este necesară notarea în cartea funciară (art. 540 alin. 2 C.civ.)", "C": "calificarea ca bun mobil prin anticipație este opozabilă tuturor terților din momentul încheierii contractului verbal, fără nicio formalitate de publicitate"}, "a": ["A", "B"], "e": {"A": {"v": true, "t": "Art. 540 alin. (1) C.civ."}, "B": {"v": true, "t": "Art. 540 alin. (2) C.civ."}, "C": {"v": false, "t": "Contrazice expres art. 540 alin. (2) C.civ."}}}, {"n": 51, "m": "C7", "q": "Referitor la bunurile fungibile, consumptibile și divizibile (art. 543–545 C.civ.):", "o": {"A": "prin acordul părților, un bun fungibil poate fi considerat nefungibil, unul consumptibil poate fi considerat neconsumptibil, iar unul divizibil poate fi considerat indivizibil", "B": "clasificarea în consumptibile și neconsumptibile privește exclusiv bunurile mobile și este independentă de clasificarea în fungibile și nefungibile", "C": "prin voința părților, orice bun neconsumptibil poate fi transformat juridic într-un bun consumptibil, iar un bun indivizibil prin natură într-un bun divizibil"}, "a": ["A", "B"], "e": {"A": {"v": true, "t": "Regula sensului unic convențional din art. 543–545 alin. (3) C.civ."}, "B": {"v": true, "t": "Art. 544 C.civ. (există consumptibile nefungibile și neconsumptibile fungibile)."}, "C": {"v": false, "t": "Sensul invers nu este permis de lege."}}}, {"n": 52, "m": "C7", "q": "Cu privire la bunurile principale și accesorii (art. 546 C.civ.):", "o": {"A": "destinația comună stabilă și exclusivă a bunului accesoriu poate fi stabilită numai de proprietarul ambelor bunuri (nu de chiriaș)", "B": "separarea temporară a bunului accesoriu de cel principal nu îi înlătură această calitate, iar încetarea calității de bun accesoriu nu poate fi opusă unui terț care a dobândit anterior drepturi privitoare la bunul principal", "C": "accesoriul urmează întotdeauna soarta principalului, norma fiind imperativă și interzicând părților să convină altfel"}, "a": ["A", "B"], "e": {"A": {"v": true, "t": "Art. 546 alin. (2) C.civ."}, "B": {"v": true, "t": "Art. 546 alin. (4)–(5) C.civ."}, "C": {"v": false, "t": "Art. 546 alin. (3) este normă dispozitivă („dacă nu se prevede altfel”)."}}}, {"n": 53, "m": "C7", "q": "Privind bunurile aflate în circuitul civil și bunurile proprietate publică (art. 861 C.civ.; art. 730 C.proc.civ.):", "o": {"A": "bunurile proprietate publică sunt inalienabile, imprescriptibile și insesizabile, dar pot fi date în administrare ori folosință, concesionate sau închiriate în condițiile legii", "B": "renunțarea contractuală a debitorului la beneficiul insesizabilității bunurilor prevăzute de lege este nulă de drept (art. 730 C.proc.civ.)", "C": "bunurile proprietate publică pot fi dobândite de particulari prin uzucapiune extratabulară sau prin posesie de bună-credință"}, "a": ["A", "B"], "e": {"A": {"v": true, "t": "Art. 861 alin. (1)–(3) C.civ."}, "B": {"v": true, "t": "Art. 730 C.proc.civ."}, "C": {"v": false, "t": "Art. 861 alin. (1): nu pot fi dobândite prin uzucapiune ori prin posesie de bună-credință."}}}, {"n": 54, "m": "C7", "q": "În materia bunurilor certe vs. de gen și a riscului pieirii fortuite (art. 1273–1274 C.civ.):", "o": {"A": "în lipsă de stipulație contrară, cât timp bunul nu este predat, riscul contractului rămâne în sarcina debitorului obligației de predare, chiar dacă proprietatea a fost transferată dobânditorului", "B": "creditorul pus în întârziere preia riscul pieirii fortuite a bunului și nu se poate libera nici dacă ar dovedi că bunul ar fi pierit și dacă obligația de predare ar fi fost executată la timp (art. 1274 alin. 2 C.civ.)", "C": "în cazul bunurilor de gen, dreptul de proprietate se transferă cumpărătorului din momentul încheierii contractului, chiar înainte de individualizare"}, "a": ["A", "B"], "e": {"A": {"v": true, "t": "Art. 1274 alin. (1) C.civ. (abandonarea regulii <em>res perit domino<\/em>)."}, "B": {"v": true, "t": "Art. 1274 alin. (2) C.civ."}, "C": {"v": false, "t": "Art. 1273 alin. (2): la bunurile de gen proprietatea trece abia la individualizare."}}}, {"n": 55, "m": "C7", "q": "Referitor la fructe și producte (art. 547–550, art. 948 C.civ.):", "o": {"A": "fructele naturale și industriale se dobândesc la data separării, iar fructele civile se dobândesc zi cu zi (nu la data încasării efective)", "B": "posesorul de bună-credință dobândește numai fructele bunului posedat, niciodată productele (art. 948 C.civ.)", "C": "productele sunt produse periodice ale bunului care nu îi diminuează substanța, spre deosebire de fructe"}, "a": ["A", "B"], "e": {"A": {"v": true, "t": "Art. 550 alin. (2)–(3) C.civ."}, "B": {"v": true, "t": "Art. 948 C.civ.; productele aparțin întotdeauna proprietarului."}, "C": {"v": false, "t": "Inversat — productele diminuează/consumă substanța, iar fructele nu."}}}, {"n": 56, "m": "R", "q": "În anul 2010 (sub Decretul nr. 167/1958), a început să curgă un termen de prescripție extinctivă. Litigiul se judecă în anul 2013 (sub Codul civil actual), iar pârâtul nu invocă prescripția. Conform art. 6 alin. (4) C.civ. și Deciziei ÎCCJ RIL nr. 1/2014:", "o": {"A": "instanța poate invoca prescripția extinctivă din oficiu, deoarece prescripția începută anterior datei de 1 octombrie 2011 rămâne supusă integral legii vechi (Decretul nr. 167/1958)", "B": "instanța nu poate invoca prescripția din oficiu, deoarece procesul se desfășoară după intrarea în vigoare a Codului civil actual", "C": "dacă părțile poartă negocieri în anul 2012 (după 1 octombrie 2011), cauza de suspendare de la art. 2532 pct. 6 C.civ. se aplică imediat prescripției în curs (art. 203 LPA)"}, "a": ["A", "C"], "e": {"A": {"v": true, "t": "Soluția obligatorie a Deciziei ÎCCJ RIL nr. 1/2014."}, "B": {"v": false, "t": "Contrazice art. 6 alin. (4), art. 201 LPA și RIL nr. 1/2014."}, "C": {"v": true, "t": "Derogarea expresă din art. 203 Legea nr. 71/2011."}}}, {"n": 57, "m": "R", "q": "M, în vârstă de 13 ani, moștenește un apartament și închiriază singur o cameră unui student. Tatăl lui M declară expres acceptarea moștenirii în numele lui M, fără autorizarea instanței de tutelă. În acest caz:", "o": {"A": "contractul de închiriere este anulabil, întrucât minorul sub 14 ani nu poate încheia singur nici măcar acte de administrare neprejudiciabile (art. 43 alin. 3 C.civ.)", "B": "declarația expresă de acceptare a moștenirii este nevalabilă (anulabilă) în lipsa autorizării instanței de tutelă, reprezentând un act de dispoziție conform Deciziei ÎCCJ (DCD) nr. 58/2024", "C": "ambele acte sunt pe deplin valabile, deoarece închirierea e un act de administrare, iar acceptarea moștenirii e un act de conservare"}, "a": ["A", "B"], "e": {"A": {"v": true, "t": "Art. 43 alin. (3) C.civ. exclude actele de administrare pentru minorul sub 14 ani."}, "B": {"v": true, "t": "Decizia ÎCCJ (DCD) nr. 58/2024."}, "C": {"v": false, "t": "Contrazice art. 43 alin. (3) și DCD nr. 58/2024."}}}, {"n": 58, "m": "R", "q": "A îi vinde lui B un imobil înscris în cartea funciară, care era închiriat lui C (locațiune notată în cartea funciară), și îi vinde separat recolta neculeasă de porumb de pe un alt teren lui D, fără a nota contractul lui D în cartea funciară. Ulterior, A vinde terenul cu porumb lui E (terț de bună-credință). În această situație:", "o": {"A": "locațiunea lui C este opozabilă dobânditorului B (obligație <em>scriptae in rem<\/em>, art. 1811 lit. a C.civ.)", "B": "calificarea recoltei neculese ca bun mobil prin anticipație nu îi este opozabilă terțului E, întrucât contractul lui D nu a fost notat în cartea funciară (art. 540 alin. 2 C.civ.)", "C": "recolta neculeasă este bun mobil prin natura sa, deci devine opozabilă lui E fără nicio formalitate de publicitate"}, "a": ["A", "B"], "e": {"A": {"v": true, "t": "Art. 1811 lit. a) C.civ."}, "B": {"v": true, "t": "Art. 540 alin. (2) C.civ. cere notarea în CF pentru opozabilitate față de terți."}, "C": {"v": false, "t": "Fructele neculese sunt imobile prin natură, devenind mobile doar prin anticipație."}}}, {"n": 59, "m": "R", "q": "A îi vinde lui B un tablou (bun cert), cu predare peste 7 zile. În ziua a 4-a, tabloul piere fortuit într-un incendiu (fără culpa lui A). Care sunt soluțiile corecte?", "o": {"A": "proprietatea tabloului s-a transferat lui B de la data acordului de voință (art. 1273 alin. 1 C.civ.)", "B": "întrucât tabloul nu fusese încă predat și B nu era pus în întârziere, riscul pieirii fortuite rămâne la vânzătorul A (art. 1274 alin. 1 C.civ.), astfel că B nu mai datorează prețul", "C": "fiind deja proprietar al tabloului, B suportă în mod obligatoriu riscul pieirii fortuite conform regulii <em>res perit domino<\/em> și trebuie să plătească prețul"}, "a": ["A", "B"], "e": {"A": {"v": true, "t": "Art. 1273 alin. (1) C.civ."}, "B": {"v": true, "t": "Art. 1274 alin. (1) C.civ."}, "C": {"v": false, "t": "Codul civil actual a abandonat <em>res perit domino<\/em> în favoarea regulii debitorului predării."}}}, {"n": 60, "m": "R", "q": "D datorează lui C suma de 10.000 lei, garantată prin fideiusiune de F. T încheie cu D o preluare a datoriei cu acordul creditorului C, dar fără consultarea fideiusorului F. După împlinirea prescripției extinctive, T plătește de bunăvoie lui C, ignorând prescripția, apoi cere restituirea. În acest caz:", "o": {"A": "obligația fideiusorului F s-a stins ca efect al preluării datoriei, întrucât nu și-a dat acordul la preluare (art. 1602 alin. 3 C.civ.)", "B": "T nu are dreptul să ceară restituirea sumei executate de bunăvoie după împlinirea prescripției extinctive (art. 1471 și art. 2506 alin. 3 C.civ.)", "C": "primirea plății voluntare de către C după împlinirea prescripției constituie abuz de drept în sensul art. 15 C.civ"}, "a": ["A", "B"], "e": {"A": {"v": true, "t": "Art. 1602 alin. (3) C.civ."}, "B": {"v": true, "t": "Executarea voluntară a unei obligații naturale nu se restituie."}, "C": {"v": false, "t": "Primirea executării voluntare a unei obligații naturale nu este abuz de drept."}}}, {"n": 61, "m": "R", "q": "(Model real din examen) X este plecat în concediu, iar în apartamentul său se sparge o țeavă și începe să se inunde locuința. Pentru a opri paguba și a preveni inundarea propriilor bunuri, vecinul V intră fără mandat și cheamă doi instalatori, achitând reparația. În raport cu izvoarele raportului juridic civil concret:", "o": {"A": "raportul juridic civil dintre X și vecinul V izvorăște dintr-un fapt juridic licit — gestiunea de afaceri (art. 1330–1340 C.civ.)", "B": "întrucât vecinul V a intervenit fără împuternicirea lui X, între ei s-a născut un contract de mandat (act juridic civil bilateral)", "C": "fapta vecinului V constituie un fapt juridic ilicit (delict civil), astfel că acesta nu poate cere restituirea cheltuielilor necesare și utile"}, "a": ["A"], "e": {"A": {"v": true, "t": "Gestiunea voluntară și oportună a afacerilor altuia, inclusiv când există și un interes propriu conex, este gestiune de afaceri (fapt juridic licit)."}, "B": {"v": false, "t": "Lipsește acordul de voință prealabil al lui X."}, "C": {"v": false, "t": "Nu e delict; geratul X datorează restituirea cheltuielilor necesare și utile (art. 1337 C.civ.)."}}}, {"n": 62, "m": "R", "q": "(Model real din examen) X, Y și Z pătrund în imobilul lui K în lipsa acestuia și sustrag bunuri. În timp ce fug, sunt văzuți de M și N. Ulterior, X, Y și Z sunt prinși, însă bunurile nu se mai găsesc. În privința raportului juridic civil obligațional născut:", "o": {"A": "izvorul raportului juridic civil este un fapt juridic <em>stricto sensu<\/em> ilicit (delict civil), iar părțile sunt K (subiect activ/creditor) și X, Y, Z (subiecte pasive/codebitori)", "B": "M și N au calitatea de subiecte pasive secundare (părți) în raportul juridic civil de despăgubire, deoarece au asistat la fugă", "C": "întrucât răspund împreună pentru aceeași faptă prejudiciabilă, X, Y și Z sunt ținuți solidar la reparație (art. 1382 C.civ.), astfel că K poate cere întreaga despăgubire prin echivalent de la oricare dintre ei"}, "a": ["A", "C"], "e": {"A": {"v": true, "t": "Delict civil (art. 1349, 1357 C.civ.); părțile sunt K și X, Y, Z."}, "B": {"v": false, "t": "M și N sunt terți (doar martori în proces)."}, "C": {"v": true, "t": "Solidaritate pasivă delictuală (art. 1382 C.civ.) + reparare prin echivalent (art. 1386)."}}}, {"n": 63, "m": "R", "q": "(Model real din examen) A îi vinde lui B un apartament, precizând în contract că îl vinde „fără mobilier”. În privința calificării bunurilor (uși, mobilier obișnuit, bunuri accesorii):", "o": {"A": "ușile apartamentului sunt părți integrante ale construcției (bunuri imobile prin natura lor, art. 537 C.civ.), nu simple bunuri accesorii, astfel că se transmit cumpărătorului odată cu apartamentul", "B": "mobilierul obișnuit al unei locuințe (canapea, masă, pat neîncorporate în zidărie) este bun mobil prin natura lui și nu are caracter de bun accesoriu al apartamentului în sensul art. 546 C.civ", "C": "dacă un bun are calitatea de bun accesoriu (art. 546 C.civ.), părțile nu pot conveni niciodată excluderea lui de la vânzarea bunului principal, norma fiind imperativă"}, "a": ["A", "B"], "e": {"A": {"v": true, "t": "Părți integrante ale imobilului (art. 537; chiar detașate temporar rămân imobile, art. 538 alin. 1)."}, "B": {"v": true, "t": "Mobilierul obișnuit servește uzului personal al locuitorului, nu întrebuințării economice exclusive a construcției."}, "C": {"v": false, "t": "Art. 546 alin. (3) este normă dispozitivă („dacă nu se prevede altfel”)."}}}, {"n": 64, "m": "R", "q": "(Model real din examen) Cu privire la distincția dintre drepturile subiective absolute și drepturile subiective relative:", "o": {"A": "în cazul drepturilor absolute, subiectul pasiv este nedeterminat (toate celelalte persoane), căruia îi revine obligația generală și negativă de a nu aduce atingere dreptului", "B": "drepturile de creanță sunt drepturi relative, opozabile <em>inter partes<\/em>, în care atât subiectul activ (creditorul), cât și subiectul pasiv (debitorul) sunt determinați de la nașterea raportului", "C": "drepturile nepatrimoniale (de ex., dreptul la nume sau la imagine) sunt drepturi relative, opozabile exclusiv persoanelor cu care titularul a contractat"}, "a": ["A", "B"], "e": {"A": {"v": true, "t": "Opozabilitate <em>erga omnes<\/em> + obligație generală negativă."}, "B": {"v": true, "t": "Trăsăturile drepturilor de creanță."}, "C": {"v": false, "t": "Drepturile nepatrimoniale sunt drepturi absolute (<em>erga omnes<\/em>)."}}}, {"n": 65, "m": "R", "q": "(Model real din examen) Privind izvoarele raportului juridic civil concret:", "o": {"A": "nașterea și decesul unei persoane fizice sunt evenimente (fapte naturale independente de voința omului), incluse în categoria faptelor juridice <em>stricto sensu<\/em>", "B": "gestiunea de afaceri, plata nedatorată și îmbogățirea fără justă cauză sunt acte juridice unilaterale, deoarece presupun intenția expresă de a produce efecte juridice", "C": "actul juridic civil se deosebește de faptul juridic <em>stricto sensu<\/em> prin existența intenției autorului/părților de a produce efecte juridice"}, "a": ["A", "C"], "e": {"A": {"v": true, "t": "Evenimentele fac parte din faptele juridice <em>stricto sensu<\/em>."}, "B": {"v": false, "t": "Sunt fapte juridice <em>licite<\/em> (<em>stricto sensu<\/em>), nu acte juridice."}, "C": {"v": true, "t": "Intenția de a produce efecte juridice este criteriul delimitator."}}}], "mods": [["C1", "C1 · grilele 1–5"], ["C2", "C2 · grilele 6–11"], ["C3", "C3 · grilele 12–18"], ["C4", "C4 · grilele 19–28"], ["C5", "C5 · grilele 29–39"], ["C6", "C6 · grilele 40–47"], ["C7", "C7 · grilele 48–55"], ["R", "Modele reale · grilele 56–65"]], "plan": ["<strong>Ziua 1:<\/strong> Curs complet C1 + C2 + Perechile aferente + Grilele 1–11 + Subiectul de redactare #4.", "<strong>Ziua 2:<\/strong> Curs complet C3 + Tabelul RIL vs. DCD și OG vs. OUG + Grilele 12–18.", "<strong>Ziua 3:<\/strong> Curs complet C4 + Harta legii în timp (art. 6, RIL 1/2014, art. 203–204 LPA) + Grilele 19–28.", "<strong>Ziua 4:<\/strong> Curs complet C5 + Tabelele Preluare vs. Novație și L. 140/2022 + Grilele 29–39 + Speța #4 + Redactările #2 și #6.", "<strong>Ziua 5:<\/strong> Curs complet C6 + Grilele 40–47, 64 + Spețele #1 și #3 + Redactările #3 și #5.", "<strong>Ziua 6:<\/strong> Curs complet C7 + Tabelul art. 543–545 și art. 1273–1274 + toate cele 21 de Perechi + Grilele 48–55 + Spețele #2 și #5 + Redactările #1 și #7.", "<strong>Ziua 7:<\/strong> Grilele 56–65 + reluarea grilelor greșite + 1 simulare completă cronometrată, apoi odihnă."]}</script>
<script>
const D=JSON.parse(document.getElementById('d').textContent),G=D.grile,$=s=>document.querySelector(s),mem={};
const S={g(k,d){try{const v=localStorage.getItem('dc_'+k);return v==null?(k in mem?mem[k]:d):JSON.parse(v)}catch(e){return k in mem?mem[k]:d}},s(k,v){mem[k]=v;try{localStorage.setItem('dc_'+k,JSON.stringify(v))}catch(e){}}};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const same=(a,b)=>a.length===b.length&&a.every(x=>b.includes(x));
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const NAV=[['home','Acasă'],['curs','Curs'],['perechi','Perechi'],['grile','Grile'],['spete','Spețe'],['redactare','Redactări'],['plan','Plan 7 zile']];
let view='home',chap='C1',flt='',q=null,tick=null,msg='';
function render(){$('#nav').innerHTML=NAV.map(([k,t])=>`<button class="${k==view?'on':''}" data-a="go" data-v="${k}">${t}</button>`).join('');$('#app').innerHTML=V[view]()}
function cursBody(){const c=D.curs.find(x=>x.id==chap),read=S.g('read',{});
 if(flt){const f=flt.toLowerCase();return D.curs.flatMap(x=>x.s.filter(s=>(s.t+s.h).toLowerCase().includes(f)).map(s=>({...s,c:x.id}))).map(s=>`<section><h3><span class="tag">${s.c}</span>${s.t}</h3>${s.h}</section>`).join('')||'<p class="muted">Niciun rezultat. Încearcă alt cuvânt.</p>'}
 return `<h2>${c.t}</h2>`+c.s.map(s=>`<section><h3>${s.t}</h3>${s.h}</section>`).join('')+`<button class="btn ${read[c.id]?'':'pri'}" data-a="read" data-v="${c.id}">${read[c.id]?'Marcat ca învățat ✓':'Marchez capitolul ca învățat'}</button>`}
function prac(k,h,sub,btn){const n=S.g('n',{});return `<h2>${h}</h2><p class="muted">${sub}</p>`+D[k].map((x,i)=>`<article class="card"><h3>${x.t}</h3><div class="prose">${x.e}</div><textarea data-note="${k+i}" placeholder="Scrie răspunsul tău, apoi compară cu baremul.">${esc(n[k+i]||'')}</textarea><button class="btn pri" data-a="bar" data-v="${k+i}">${btn}</button><div class="prose" id="b${k+i}" hidden>${x.b}</div></article>`).join('')}
const V={
home(){const r=S.g('res',{}),k=S.g('known',{}),p=S.g('plan',{}),rd=S.g('read',{}),a=Object.keys(r).length,ok=Object.values(r).filter(x=>x===1).length,kn=Object.values(k).filter(Boolean).length,pd=Object.values(p).filter(Boolean).length,rc=Object.values(rd).filter(Boolean).length;
 const st=(n,t,x,y)=>`<div class="card"><b>${n}</b>${t}<div class="bar"><i style="width:${100*x/y}%"></i></div></div>`;
 return `<h2>Tot ce ai de învățat, într-un singur loc</h2><p class="muted">Parcurge cursul, fixează perechile, rezolvă grilele și spețele. Progresul rămâne salvat în browser.</p><div class="stats">${st(rc+'/8','capitole învățate',rc,8)}${st(kn+'/21','perechi știute',kn,21)}${st(a+'/65','grile rezolvate',a,65)}${st(a?Math.round(100*ok/a)+'%':'–','răspunsuri corecte',ok,a||1)}${st(pd+'/7','zile din plan',pd,7)}</div>
 <div class="row"><button class="btn pri" data-a="go" data-v="curs">Începe cursul</button><button class="btn" data-a="go" data-v="grile">Rezolvă grile</button><button class="btn" data-a="sim">Simulare cronometrată</button></div>`},
curs(){const rd=S.g('read',{});return `<input type="search" id="srch" placeholder="Caută în tot cursul (ex.: novație, art. 1274, capacitate)" value="${esc(flt)}"><div class="tabs">${D.curs.map(x=>`<button class="tab ${x.id==chap&&!flt?'on':''}" data-a="chap" data-v="${x.id}">${x.id=='Ap'?'Aprofundări':x.id}${rd[x.id]?' ✓':''}</button>`).join('')}</div><div id="cb">${cursBody()}</div>`},
perechi(){const k=S.g('known',{});return `<h2>21 de perechi comparative</h2><p class="muted">Atinge un card ca să vezi diferența, apoi marchează ce știi deja.</p><div class="grid">`+D.perechi.map((p,i)=>`<div class="card ${k[i]?'ok':''}" data-a="flip"><b>${p.n}. ${p.t}</b><div hidden>${p.b}<button class="btn" data-a="known" data-v="${i}">${k[i]?'Nu mai știu':'Știu perechea'}</button></div></div>`).join('')+'</div>'},
grile(){if(q)return quiz();const r=S.g('res',{}),w=Object.values(r).filter(x=>x===0).length,b=(m,t)=>`<button class="btn" data-a="start" data-v="${m}">${t}</button>`;
 return `<h2>65 de grile</h2><p class="muted">Punctaj strict: 1 punct doar dacă ai bifat exact toate variantele corecte (1 sau 2 din A, B, C).</p>${msg?`<p class="verdict bad">${msg}</p>`:''}<div class="card"><h3>Alege ce exersezi</h3><div class="row" style="margin:0">${b('all','Toate cele 65')}${b('new','Cele nerezolvate')}${b('wrong',`Doar cele greșite (${w})`)}${D.mods.map(m=>b(m[0],m[1])).join('')}</div></div><div class="card"><h3>Simulare de examen</h3><p>30 de grile amestecate, 45 de minute, fără răspunsuri pe parcurs.</p><button class="btn pri" data-a="sim">Pornește simularea</button></div>`},
spete(){return prac('spete','5 spețe practice','Citește enunțul, scrie-ți rezolvarea, apoi compar-o cu baremul de nota 10.','Arată baremul')},
redactare(){return prac('redactare','7 subiecte de redactare','Scrie din memorie structura temei, apoi verific-o.','Arată structura')},
plan(){const p=S.g('plan',{});return `<h2>Plan de pregătire pe 7 zile</h2>`+D.plan.map((t,i)=>`<div class="card"><label class="day"><input type="checkbox" data-a="day" data-v="${i}" ${p[i]?'checked':''}><span>${t}</span></label></div>`).join('')}};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function quiz(){const g=q.l[q.i],p=q.p[g.n]||[],rev=q.fin||q.done[g.n],ok=same(p,g.a);
 const chips=q.l.map((x,i)=>{const d=q.fin||q.done[x.n];return `<button class="chip ${i==q.i?'cur':''} ${d?(same(q.p[x.n]||[],x.a)?'good':'bad'):(q.p[x.n]&&q.p[x.n].length?'pick':'')}" data-a="jump" data-v="${i}">${x.n}</button>`}).join('');
 const opts=['A','B','C'].map(L=>{let c='';if(rev){const r=g.a.includes(L),s=p.includes(L);c=r?(s?'good':'miss'):(s?'bad':'')}else if(p.includes(L))c='pick';
  return `<button class="opt ${c}" data-a="pick" data-v="${L}"><b>${L}</b><span>${g.o[L]}</span></button>`+(rev?`<div class="ex"><b>${g.e[L].v?'Adevărat':'Fals'}.</b> ${g.e[L].t}</div>`:'')}).join('');
 return `<div class="row" style="margin:0 0 12px"><button class="btn" data-a="quit">Ieși</button><span class="sp"></span>${q.sim&&!q.fin?`<b id="tm">${fmt(q.t)}</b>`:''}${q.fin&&q.sim?`<b>Scor: ${q.score}/${q.l.length}</b>`:''}</div><div class="chips">${chips}</div>
 <div class="card"><p class="muted">Grila ${g.n} · ${g.m=='R'?'model real':g.m}</p><h3 style="font-family:'Public Sans',sans-serif;font-size:18px">${g.q}</h3>${opts}${rev&&!q.sim||q.fin?`<div class="verdict ${ok?'good':'bad'}">${ok?'Corect, 1 punct.':'Greșit. Corect: '+g.a.join(', ')+'.'}</div>`:''}
 <div class="row"><button class="btn" data-a="jump" data-v="${q.i-1}" ${q.i?'':'disabled'}>Înapoi</button>${!rev&&!q.sim?`<button class="btn pri" data-a="chk" ${p.length?'':'disabled'}>Verifică</button>`:''}<span class="sp"></span>${q.i<q.l.length-1?`<button class="btn ${rev?'pri':''}" data-a="jump" data-v="${q.i+1}">Următoarea</button>`:(q.sim&&!q.fin?'<button class="btn pri" data-a="fin">Finalizează</button>':'')}</div></div>`}
const A={
go(v){view=v;q=null;msg='';clearInterval(tick);render();scrollTo(0,0)},
chap(v){chap=v;flt='';render()},read(v,b){const r=S.g('read',{});r[v]=!r[v];S.s('read',r);render()},
flip(v,b){const d=b.querySelector('[hidden],div');if(d)d.hidden=!d.hidden},
known(v,b){const k=S.g('known',{});k[v]=!k[v];S.s('known',k);b.textContent=k[v]?'Nu mai știu':'Știu perechea';b.closest('.card').classList.toggle('ok',!!k[v])},
bar(v){const e=$('#b'+v);e.hidden=!e.hidden},day(v,b){const p=S.g('plan',{});p[v]=b.checked;S.s('plan',p)},
start(m){const r=S.g('res',{});let l=m=='all'?[...G]:m=='new'?G.filter(g=>!(g.n in r)):m=='wrong'?G.filter(g=>r[g.n]===0):G.filter(g=>g.m==m);
 if(!l.length){msg=m=='wrong'?'Nu ai nicio grilă greșită încă.':'Nu mai ai grile nerezolvate. Bravo!';return render()}
 msg='';q={l,i:0,p:{},done:{},sim:false,fin:false};render();scrollTo(0,0)},
sim(){view='grile';q={l:shuffle([...G]).slice(0,30),i:0,p:{},done:{},sim:true,fin:false,t:2700};clearInterval(tick);tick=setInterval(()=>{q.t--;const e=$('#tm');if(e)e.textContent=fmt(q.t);if(q.t<=0)A.fin()},1000);render();scrollTo(0,0)},
pick(v){const g=q.l[q.i];if(q.fin||q.done[g.n])return;const p=q.p[g.n]||(q.p[g.n]=[]);const i=p.indexOf(v);i<0?p.push(v):p.splice(i,1);render()},
chk(){const g=q.l[q.i],r=S.g('res',{});q.done[g.n]=1;r[g.n]=same(q.p[g.n]||[],g.a)?1:0;S.s('res',r);render()},
jump(v){q.i=+v;render();scrollTo(0,0)},
fin(){clearInterval(tick);const r=S.g('res',{});let s=0;q.l.forEach(g=>{const o=same(q.p[g.n]||[],g.a);r[g.n]=o?1:0;s+=o});S.s('res',r);q.fin=true;q.score=s;render();scrollTo(0,0)},
quit(){clearInterval(tick);q=null;render()}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&!b.disabled&&A[b.dataset.a])A[b.dataset.a](b.dataset.v,b)});
document.addEventListener('input',e=>{const t=e.target;if(t.id=='srch'){flt=t.value.trim();$('#cb').innerHTML=cursBody()}else if(t.dataset.note){const n=S.g('n',{});n[t.dataset.note]=t.value;S.s('n',n)}});
render();
</script>
</body>
</html>
