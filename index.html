  examSize: 60,      // 20 | 60 în Mod Simulare Examen
  list: [],
  i: 0,
  ans: {},
  chk: {},
  done: false,
  revOnlyWrong: false,
  warn: "",
  showJump: false,
  confirmReset: false
};

const NAV = [
  ["k", "Curs complet"],
  ["s", "Scheme"],
  ["a", "Aprofundări"],
  ["d", "Definiții"],
  ["p", "Perechi"],
  ["f", "Fișe"],
  ["g", "Grile (60)"],
  ["z", "Plan"]
];

function getWrongIds() {
  return Object.keys(GS).filter(id => GS[id] === 0).map(Number);
}

function getCorrectCount() {
  return Object.keys(GS).filter(id => GS[id] === 1).length;
}

function buildGrileSet(setKey, mode, examSize) {
  stopTimer();
  Tmr.sec = 0;
  if (mode) G.mode = mode;
  if (examSize) G.examSize = examSize;
  if (setKey) G.set = setKey;

  let arr = [];
  if (G.mode === "exam") {
    arr = G.examSize === 20 ? sh(GR).slice(0, 20) : [...GR];
  } else {
    if (G.set === "all") arr = [...GR];
    else if (G.set === "wrong") {
      const w = new Set(getWrongIds());
      arr = GR.filter(x => w.has(x.id));
    } else {
      arr = GR.filter(x => x.c === G.set);
    }
  }

  G.list = arr;
  G.i = 0;
  G.ans = {};
  G.chk = {};
  G.done = false;
  G.revOnlyWrong = false;
  G.warn = "";
  G.confirmReset = false;
}

buildGrileSet("all", "train", 60);

function deck() {
  return CA.map((_, i) => i).filter(i => (!F.c || CA[i][0] == F.c) && (!F.u || !K[i]));
}

/* ==========================================================================
   RANDARE TAB 1: CURS COMPLET (C1–C7)
   ========================================================================== */
function renderCurs() {
  const doneCnt = CURS.filter(c => CD[c.id]).length;
  let h = `
    <div class="between" style="margin-bottom:4px">
      <div class="mut"><b>${doneCnt} din 7</b> cursuri parcurse</div>
      <button data-a="k-all" class="${kAll ? "on" : ""}" style="padding:5px 11px;font-size:12.8px">${kAll ? "✓ Mod citire continuă (Toate)" : "Toate cursurile (citire continuă)"}</button>
    </div>
    <div class="bar"><i style="width:${(doneCnt / 7) * 100}%"></i></div>
    <div class="chips">
      ${CURS.map((c, idx) => {
        const isDone = !!CD[c.id];
        const active = !kAll && ki === idx;
        return `<button data-a="k-sel" data-v="${idx}" class="${active ? "on" : ""} ${isDone ? "chip-done" : ""}">${c.code}${isDone ? " ✓" : ""}</button>`;
      }).join("")}
    </div>
  `;

  if (kAll) {
    h += CURS.map(c => {
      const isDone = !!CD[c.id];
      return `
        <section style="margin-bottom:26px">
          <div class="lesson-hdr">
            <h2>${c.title}</h2>
            <button data-a="k-done" data-v="${c.id}" class="${isDone ? "ok" : ""}">${isDone ? "✓ " + c.code + " parcurs" : "Marchează " + c.code + " ca parcurs"}</button>
          </div>
          ${c.html}
          <div class="row">
            <button data-a="g-from-c" data-v="${c.code}">Exersează grilele din ${c.code} →</button>
          </div>
        </section>
      `;
    }).join("");
    return h;
  }

  const c = CURS[ki];
  const isDone = !!CD[c.id];
  h += `
    <div class="lesson-hdr">
      <h2>${c.title}</h2>
      <button data-a="k-done" data-v="${c.id}" class="${isDone ? "ok" : ""}">${isDone ? "✓ " + c.code + " parcurs" : "Marchează " + c.code + " ca parcurs"}</button>
    </div>
    ${c.html}
    <div class="between" style="margin-top:16px">
      <div class="row" style="margin:0">
        <button data-a="k-prev" ${ki === 0 ? "disabled" : ""}>← Înapoi</button>
        <button data-a="k-next" class="${ki < CURS.length - 1 ? "on" : ""}" ${ki === CURS.length - 1 ? "disabled" : ""}>Cursul următor →</button>
      </div>
      <div class="row" style="margin:0">
        <button data-a="k-done" data-v="${c.id}" class="${isDone ? "ok" : ""}">${isDone ? "✓ Parcurs" : "Marchează " + c.code + " parcurs"}</button>
        <button data-a="g-from-c" data-v="${c.code}">Grile ${c.code} →</button>
      </div>
    </div>
  `;
  return h;
}

/* ==========================================================================
   RANDARE TAB 7: GRILE (60) – ANTRENAMENT & SIMULARE EXAMEN (20 / 60 + TIMER)
   ========================================================================== */
function renderGrile() {
  const corTot = getCorrectCount();
  const wrTot = getWrongIds().length;

  let h = `
    <div class="between" style="margin-bottom:6px">
      <div class="mut">Progres global: <b>${corTot} / 60</b> corecte · <b>${wrTot}</b> greșite de reluat</div>
      ${G.confirmReset
        ? `<span class="confirm-inline">Resetezi istoricul? <button class="no" data-a="gr-yes">Da</button><button data-a="gr-no">Nu</button></span>`
        : `<button data-a="gr-ask" style="padding:4px 10px;font-size:12.5px">Reset statistici</button>`
      }
    </div>
    <div class="bar"><i style="width:${(corTot / 60) * 100}%"></i></div>
  `;

  // Comutator Mod Antrenament / Mod Simulare Examen
  h += `
    <div class="between" style="margin-bottom:10px">
      <div class="chips" style="margin:0">
        <button data-a="gm" data-v="train" class="${G.mode === "train" ? "on" : ""}">🎯 Mod Antrenament</button>
        <button data-a="gm" data-v="exam" class="${G.mode === "exam" ? "on" : ""}">📝 Mod Simulare Examen</button>
      </div>
      <span class="badge">1 sau 2 corecte / grilă</span>
    </div>
  `;

  // Filtre specifice modului
  if (G.mode === "train") {
    h += `<div class="chips">${GSETS_TRAIN.map(([k, lbl]) => {
      const label = k === "wrong" ? `${lbl} (${wrTot})` : lbl;
      return `<button data-a="gs" data-v="${k}" class="${G.set === k ? "on" : ""}">${label}</button>`;
    }).join("")}</div>`;
  } else {
    h += `
      <div class="timer-box">
        <div class="chips" style="margin:0">
          <button data-a="ge-sz" data-v="20" class="${G.examSize === 20 ? "on" : ""}" style="padding:5px 11px;font-size:13px">20 grile (aleatorii)</button>
          <button data-a="ge-sz" data-v="60" class="${G.examSize === 60 ? "on" : ""}" style="padding:5px 11px;font-size:13px">Toate 60 de grile</button>
        </div>
        ${!G.done ? `
          <div class="row" style="margin:0">
            <span class="mut">⏱️</span>
            <span id="examTimerVal" class="timer-val">${fmtTime(Tmr.sec)}</span>
            <button data-a="t-tog" style="padding:4px 10px;font-size:12.5px">${Tmr.running ? "Pauză" : (Tmr.sec > 0 ? "Reia" : "Pornește")}</button>
            <button data-a="t-rst" style="padding:4px 9px;font-size:12.5px">Reset</button>
          </div>
        ` : `<span class="mut">⏱️ Timp: <b>${fmtTime(Tmr.sec)}</b></span>`}
      </div>
    `;
  }

  // Caz set gol (Doar greșite)
  if (!G.list.length) {
    h += `<div class="card">
      <div class="q">Nicio grilă greșită de reluat 🎉</div>
      <p class="mut" style="margin-bottom:0">Alege un capitol sau comută în <b>Mod Simulare Examen</b> pentru testare completă.</p>
    </div>`;
    return h;
  }

  // ECRAN REZULTATE SIMULARE EXAMEN FINALIZATĂ
  if (G.mode === "exam" && G.done) {
    let score = 0;
    G.list.forEach(item => {
      if (eqArr(G.ans[item.id] || [], item.k)) score++;
    });
    const total = G.list.length;
    const pct = Math.round((score / total) * 100);
    const nota = (1 + (score / total) * 9).toFixed(2);
    const msg = pct >= 85 ? "Excelent! Ești pregătit(ă) pentru nota 10."
      : pct >= 65 ? "Foarte bine! Revizuiește grilele greșite mai jos."
      : "Continuă exersarea! Recitește secțiunile corespunzătoare din Curs complet și Aprofundări.";

    const wrongList = G.list.filter(item => !eqArr(G.ans[item.id] || [], item.k));
    const shown = G.revOnlyWrong ? wrongList : G.list;

    h += `
      <div class="card">
        <div class="between">
          <div>
            <div class="mut">Rezultat Simulare Examen (${total} grile · timp ${fmtTime(Tmr.sec)})</div>
            <div class="q" style="font-size:21px;margin-top:4px">Scor: ${score} / ${total} (${pct}%) · Nota: <mark>${nota}</mark></div>
          </div>
          <span class="badge ${pct >= 50 ? "badge-ok" : "badge-no"}">${pct >= 50 ? "ADMIS" : "SUB 50%"}</span>
        </div>
        <div class="bar" style="margin-top:10px"><i style="width:${pct}%"></i></div>
        <p style="margin:6px 0 0">${msg}</p>
        <div class="row">
          <button class="on" data-a="g-restart">Simulare nouă</button>
          <button data-a="g-revf" class="${G.revOnlyWrong ? "on" : ""}">Doar greșite (${wrongList.length})</button>
          <button data-a="gm" data-v="train">Înapoi la Antrenament</button>
        </div>
      </div>
    `;

    if (!shown.length) {
      h += `<div class="card">Nu ai greșit nicio grilă în această simulare! 🏆</div>`;
    } else {
      h += shown.map(item => {
        const sel = G.ans[item.id] || [];
        const isOk = eqArr(sel, item.k);
        const selStr = sel.length ? sel.map(i => LET[i]).join(", ") : "Nicio variantă";
        const keyStr = item.k.map(i => LET[i]).join(", ");
        return `
          <div class="card" style="border-left:4px solid var(${isOk ? "--ok" : "--no"})">
            <div class="between" style="margin-bottom:6px">
              <span class="badge badge-ac">Grila #${item.id} · ${item.c}</span>
              <span class="badge ${isOk ? "badge-ok" : "badge-no"}">${isOk ? "✓ Corect (1p)" : "✗ Greșit (0p)"}</span>
            </div>
            <div class="q" style="font-size:15.5px">${item.q}</div>
            <div class="mut" style="margin-top:6px">Răspunsul tău: <b>${selStr}</b> · Barem: <b>${keyStr}</b></div>
            <div class="exp-box">
              ${item.o.map((txt, idx) => {
                const isT = item.k.includes(idx);
                return `<div class="exp-item ${isT ? "is-t" : "is-f"}">
                  <div><b>${LET[idx]}.</b> ${txt}</div>
                  <div class="mut" style="margin-top:3px"><b>${isT ? "✓" : "✗"}</b> ${item.e[idx]}</div>
                </div>`;
              }).join("")}
            </div>
          </div>
        `;
      }).join("");
    }
    return h;
  }

  // GRILA CURENTĂ (ANTRENAMENT SAU SIMULARE ÎN CURS)
  const item = G.list[G.i];
  const sel = G.ans[item.id] || [];
  const isChecked = G.mode === "train" && !!G.chk[item.id];
  const isRight = isChecked && eqArr(sel, item.k);
  const answeredCount = G.list.filter(x => (G.ans[x.id] || []).length > 0).length;

  h += `
    <div class="between" style="margin-bottom:6px">
      <div class="mut">Întrebarea <b>${G.i + 1} / ${G.list.length}</b> · Grila <b>#${item.id}</b> (${item.c})${G.mode === "exam" ? ` · Răspunse: ${answeredCount}/${G.list.length}` : ""}</div>
      <button data-a="g-jump-tog" style="padding:4px 10px;font-size:12.5px">${G.showJump ? "Ascunde harta ▲" : "Salt rapid (1–" + G.list.length + ") ▼"}</button>
    </div>
  `;

  if (G.showJump) {
    h += `<div class="card" style="padding:10px 12px">
      <div class="mut">Harta grilelor (verde = corect, roșu = greșit, albastru = răspuns selectat):</div>
      <div class="jump-grid">
        ${G.list.map((it, idx) => {
          let st = "";
          if (G.mode === "train") {
            if (G.chk[it.id]) st = eqArr(G.ans[it.id] || [], it.k) ? "st-ok" : "st-no";
            else if (GS[it.id] === 1) st = "st-ok";
            else if (GS[it.id] === 0) st = "st-no";
          } else if ((G.ans[it.id] || []).length > 0) {
            st = "st-ans";
          }
          return `<button class="j-btn ${idx === G.i ? "cur" : ""} ${st}" data-a="g-jump" data-v="${idx}">${it.id}</button>`;
        }).join("")}
      </div>
    </div>`;
  }

  h += `<div class="card">
    <div class="between" style="margin-bottom:8px">
      <span class="badge badge-ac">Grila #${item.id} · ${item.c}</span>
      ${isChecked
        ? `<span class="badge ${isRight ? "badge-ok" : "badge-no"}">${isRight ? "✓ Corect (1 punct)" : `✗ Greșit · Barem: ${item.k.map(x => LET[x]).join(", ")}`}</span>`
        : `<span class="mut">Selectează 1 sau 2 variante</span>`
      }
    </div>
    <div class="q">${item.q}</div>
    <div style="margin-top:10px">
      ${item.o.map((txt, idx) => {
        const picked = sel.includes(idx);
        let cls = "";
        if (isChecked) {
          const inKey = item.k.includes(idx);
          if (picked && inKey) cls = "res-ok";
          else if (picked && !inKey) cls = "res-no";
          else if (!picked && inKey) cls = "res-miss";
        } else if (picked) {
          cls = "sel";
        }
        return `<button type="button" class="g-opt ${cls}" data-a="g-opt" data-v="${idx}" ${isChecked ? "disabled" : ""}>
          <span class="g-let">${LET[idx]}</span>
          <span>${txt}</span>
        </button>`;
      }).join("")}
    </div>
    ${G.warn ? `<div class="warn-msg">⚠️ ${G.warn}</div>` : ""}
  `;

  if (isChecked) {
    h += `<div class="exp-box">
      <div class="mut" style="margin-bottom:6px"><b>Explicații juridice (barem: ${item.k.map(x => LET[x]).join(", ")}):</b></div>
      ${item.e.map((ex, idx) => {
        const isT = item.k.includes(idx);
        return `<div class="exp-item ${isT ? "is-t" : "is-f"}"><b>${LET[idx]}.</b> ${ex}</div>`;
      }).join("")}
    </div>`;
  }

  h += `<div class="between" style="margin-top:14px">
    <div class="row" style="margin:0">
      <button data-a="g-prev" ${G.i === 0 ? "disabled" : ""}>← Înapoi</button>
      ${G.mode === "train"
        ? (!isChecked
            ? `<button class="on" data-a="g-check">Verifică răspunsul</button>`
            : (G.i < G.list.length - 1
                ? `<button class="on" data-a="g-next">Următoarea →</button>`
                : `<button class="on" data-a="g-restart">Reia setul</button>`)
          )
        : (G.i < G.list.length - 1
            ? `<button class="on" data-a="g-next">Următoarea →</button>`
            : `<button class="on" data-a="g-finish">Finalizează și corectează ✓</button>`)
      }
    </div>
    ${G.mode === "exam" && G.i < G.list.length - 1
      ? `<button data-a="g-finish" class="ok">Finalizează și corectează (${answeredCount}/${G.list.length})</button>`
      : ""
    }
  </div>`;

  h += `</div>`;
  return h;
}

/* ==========================================================================
   RANDARE GENERALĂ APLICAȚIE (8 TAB-URI)
   ========================================================================== */
const $nav = document.getElementById("nav");
const $app = document.getElementById("app");

function render() {
  $nav.innerHTML = NAV.map(([k, lbl]) =>
    `<button type="button" data-a="v" data-v="${k}" class="${v === k ? "on" : ""}">${lbl}</button>`
  ).join("");

  let h = "";

  // 1. CURS COMPLET
  if (v === "k") {
    h = renderCurs();
  }

  // 2. SCHEME
  if (v === "s") {
    h = `
      <div class="chips">${SC.map((_, i) =>
        `<button data-a="c" data-v="${i}" class="${ci === i ? "on" : ""}">C${i + 1}</button>`
      ).join("")}</div>
      <h2>${SC[ci][0]}</h2>
      <div class="tree">${T(SC[ci][1])}</div>
      <div class="row">
        <button data-a="k-from-s" data-v="${ci}">Deschide Curs complet C${ci + 1}</button>
        <button data-a="v" data-v="a">Vezi Aprofundări</button>
        <button class="on" data-a="g-from-c" data-v="C${ci + 1}">Exersează grilele din C${ci + 1} →</button>
      </div>
      <p class="mut" style="margin-top:10px">Galbenul = punctele cheie de examen. Acoperă schema și refă-o cu voce tare din memorie.</p>
    `;
  }

  // 3. APROFUNDĂRI
  if (v === "a") {
    h = renderAprofundari();
  }

  // 4. DEFINIȚII
  if (v === "d") {
    const qNorm = defQ.trim().toLowerCase();
    const list = DEF.filter(d =>
      (!dd || d[0] === dd) &&
      (!qNorm || d[1].toLowerCase().includes(qNorm) || d[2].toLowerCase().includes(qNorm))
    );
    h = `
      <div class="chips">
        <button data-a="dd" data-v="0" class="${!dd ? "on" : ""}">Toate (${DEF.length})</button>
        ${[1, 2, 3, 4, 5, 6, 7].map(i =>
          `<button data-a="dd" data-v="${i}" class="${dd === i ? "on" : ""}">C${i}</button>`
        ).join("")}
        <button data-a="da">Deschide tot</button>
        <button data-a="dx">Închide tot</button>
      </div>
      <input id="defSearch" class="search-inp" type="search" placeholder="Caută un termen sau articol (ex.: art. 538, preluare, RIL, asistență)..." value="${defQ.replace(/"/g, "&quot;")}">
      <p class="mut" style="margin-top:0">Spune definiția cu voce tare, apoi deschide termenul și compar-o (${list.length} rezultate).</p>
      ${list.length
        ? list.map(d => `<details><summary><b>${d[1]}</b> <span class="badge">C${d[0]}</span></summary><div class="df">${m(d[2])}</div></details>`).join("")
        : `<div class="card mut">Nicio definiție nu corespunde căutării.</div>`
      }
    `;
  }

  // 5. PERECHI
  if (v === "p") {
    h = `
      <p class="mut" style="margin-top:0">Cele mai întrebate ${PA.length} perechi de examen. Formulează diferența cu voce tare înainte să te uiți la a treia coloană.</p>
      <div class="wrap">
        <table>
          <thead><tr><th>Noțiunea A</th><th>Noțiunea B</th><th>Diferența esențială</th></tr></thead>
          <tbody>
            ${PA.map(p => `<tr><td><b>${p[0]}</b></td><td><b>${p[1]}</b></td><td>${p[2]}</td></tr>`).join("")}
          </tbody>
        </table>
      </div>
    `;
  }

  // 6. FIȘE
  if (v === "f") {
    const d = deck();
    const kn = Object.keys(K).length;
    const pos = d.length ? F.i % d.length : 0;
    const cur = d[pos];
    h = `
      <div class="chips">
        <button data-a="fc" data-v="0" class="${!F.c ? "on" : ""}">Toate (${CA.length})</button>
        ${[1, 2, 3, 4, 5, 6, 7].map(i =>
          `<button data-a="fc" data-v="${i}" class="${F.c === i ? "on" : ""}">C${i}</button>`
        ).join("")}
        <button data-a="fu" class="${F.u ? "on" : ""}">Doar „Încă nu”</button>
        ${F.confirmReset
          ? `<span class="confirm-inline">Resetezi fișele? <button class="no" data-a="fr-yes">Da</button><button data-a="fr-no">Nu</button></span>`
          : `<button data-a="fr-ask">Reset</button>`
        }
      </div>
      <div class="mut">Știu <b>${kn}</b> din <b>${CA.length}</b> fișe</div>
      <div class="bar"><i style="width:${(kn / CA.length) * 100}%"></i></div>
    `;
    if (!d.length) {
      h += `<div class="card"><div class="q">Toate fișele din acest filtru sunt marcate „Știu” 🎉</div><p class="mut" style="margin-bottom:0">Treci la tab-ul <b>Grile (60)</b> pentru a testa aplicarea în practică!</p></div>`;
    } else {
      h += `
        <div class="card">
          <div class="between" style="margin-bottom:8px">
            <span class="badge badge-ac">C${CA[cur][0]}</span>
            <span class="mut">Fișa ${pos + 1} / ${d.length}</span>
          </div>
          <div class="q">${CA[cur][1]}</div>
          ${F.s
            ? `<div class="a">${CA[cur][2]}</div>
               <div class="row">
                 <button class="ok" data-a="k" data-v="${cur}">✓ Știu</button>
                 <button class="no" data-a="n" data-v="${cur}">✗ Încă nu</button>
               </div>`
            : `<div class="row"><button class="on" data-a="s">Arată răspunsul</button></div>`
          }
        </div>
      `;
    }
  }

  // 7. GRILE (60)
  if (v === "g") {
    h = renderGrile();
  }

  // 8. PLAN
  if (v === "z") {
    const doneDays = Object.keys(PD).filter(k => PD[k]).length;
    h = `
      <p style="margin-top:0">Plan de pregătire pe <b>7 zile</b> (60–90 minute/zi): combină <b>Curs complet</b>, tabelele din <b>Aprofundări</b>, fișele și seturile aferente de grile.</p>
      <div class="mut">Progres plan: <b>${doneDays} / 7</b> zile finalizate</div>
      <div class="bar"><i style="width:${(doneDays / 7) * 100}%"></i></div>
      ${PLAN.map((p, idx) => `
        <div class="card">
          <label class="plan-item">
            <input type="checkbox" data-plan="${idx}" ${PD[idx] ? "checked" : ""}>
            <span class="${PD[idx] ? "plan-done" : ""}">${p}</span>
          </label>
        </div>
      `).join("")}
      <div class="card-info small">
        <b>Regula de retenție:</b> în fiecare zi, începe cu 10 minute de recapitulare activă din grilele greșite și fișele „Încă nu” din ziua precedentă.
      </div>
    `;
  }

  $app.innerHTML = h;
}

/* ==========================================================================
   EVENIMENTE (DELEGARE CURATĂ, FĂRĂ ALERT/CONFIRM)
   ========================================================================== */
document.getElementById("themeBtn").addEventListener("click", toggleTheme);

document.addEventListener("input", e => {
  if (e.target && e.target.id === "defSearch") {
    defQ = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const inp = document.getElementById("defSearch");
    if (inp) {
      inp.focus();
      try { inp.setSelectionRange(pos, pos); } catch (err) {}
    }
  }
});

document.addEventListener("change", e => {
  if (e.target && e.target.hasAttribute("data-plan")) {
    const idx = e.target.getAttribute("data-plan");
    if (e.target.checked) PD[idx] = 1;
    else delete PD[idx];
    svP();
    render();
  }
});

document.addEventListener("click", e => {
  const b = e.target.closest("[data-a]");
  if (!b) return;
  const a = b.dataset.a;
  const x = b.dataset.v;
  let scrollTop = false;

  // Navigație principală
  if (a === "v") {
    if (x !== "g") stopTimer();
    v = x;
    scrollTop = true;
  }

  // Curs complet
  if (a === "k-sel") { ki = +x; kAll = false; scrollTop = true; }
  if (a === "k-all") { kAll = !kAll; scrollTop = true; }
  if (a === "k-prev" && ki > 0) { ki--; scrollTop = true; }
  if (a === "k-next" && ki < CURS.length - 1) { ki++; scrollTop = true; }
  if (a === "k-done") {
    const id = +x;
    if (CD[id]) delete CD[id];
    else CD[id] = 1;
    svC();
  }
  if (a === "k-from-s") { v = "k"; ki = +x; kAll = false; scrollTop = true; }

  // Scheme
  if (a === "c") { ci = +x; scrollTop = true; }
  if (a === "g-from-c") { v = "g"; buildGrileSet(x, "train"); scrollTop = true; }

  // Definiții
  if (a === "dd") { dd = +x; }
  if (a === "da") { document.querySelectorAll("details").forEach(d => d.open = true); return; }
  if (a === "dx") { document.querySelectorAll("details").forEach(d => d.open = false); return; }

  // Fișe
  if (a === "fc") { F.c = +x; F.i = 0; F.s = 0; }
  if (a === "fu") { F.u = F.u ? 0 : 1; F.i = 0; F.s = 0; }
  if (a === "fr-ask") { F.confirmReset = true; }
  if (a === "fr-no") { F.confirmReset = false; }
  if (a === "fr-yes") { K = {}; svK(); F.i = 0; F.s = 0; F.confirmReset = false; }
  if (a === "s") { F.s = 1; }
  if (a === "k") { K[x] = 1; svK(); F.s = 0; if (!F.u) F.i++; }
  if (a === "n") { delete K[x]; svK(); F.s = 0; F.i++; }

  // Grile (60) + Cronometru
  if (a === "gs") { buildGrileSet(x, "train"); scrollTop = true; }
  if (a === "gm") { buildGrileSet(G.set, x, G.examSize); scrollTop = true; }
  if (a === "ge-sz") { buildGrileSet("all", "exam", +x); scrollTop = true; }
  if (a === "t-tog") { if (Tmr.running) stopTimer(); else startTimer(); }
  if (a === "t-rst") { resetTimer(); }
  if (a === "gr-ask") { G.confirmReset = true; }
  if (a === "gr-no") { G.confirmReset = false; }
  if (a === "gr-yes") { GS = {}; svG(); G.confirmReset = false; if (G.set === "wrong") buildGrileSet("all", "train"); }

  if (a === "g-opt") {
    const item = G.list[G.i];
    if (!item) return;
    const idx = +x;
    const cur = G.ans[item.id] ? [...G.ans[item.id]] : [];
    const pos = cur.indexOf(idx);
    G.warn = "";
    if (pos >= 0) {
      cur.splice(pos, 1);
    } else {
      if (cur.length >= 2) {
        G.warn = "La fiecare grilă sunt corecte 1 sau 2 variante, niciodată toate 3. Debifează mai întâi o variantă.";
      } else {
        cur.push(idx);
        cur.sort((u, w) => u - w);
      }
    }
    G.ans[item.id] = cur;
  }

  if (a === "g-check") {
    const item = G.list[G.i];
    const cur = G.ans[item.id] || [];
    if (!cur.length) {
      G.warn = "Selectează 1 sau 2 variante înainte să verifici răspunsul.";
    } else {
      G.warn = "";
      G.chk[item.id] = true;
      GS[item.id] = eqArr(cur, item.k) ? 1 : 0;
      svG();
    }
  }

  if (a === "g-prev" && G.i > 0) { G.i--; G.warn = ""; scrollTop = true; }
  if (a === "g-next" && G.i < G.list.length - 1) { G.i++; G.warn = ""; scrollTop = true; }

  if (a === "g-finish") {
    stopTimer();
    G.done = true;
    G.warn = "";
    G.revOnlyWrong = true;
    G.list.forEach(item => {
      const cur = G.ans[item.id] || [];
      GS[item.id] = eqArr(cur, item.k) ? 1 : 0;
    });
    svG();
    scrollTop = true;
  }

  if (a === "g-restart") { buildGrileSet(G.set, G.mode, G.examSize); scrollTop = true; }
  if (a === "g-revf") { G.revOnlyWrong = !G.revOnlyWrong; }
  if (a === "g-jump-tog") { G.showJump = !G.showJump; }
  if (a === "g-jump") { G.i = +x; G.warn = ""; scrollTop = true; }

  render();
  if (scrollTop) window.scrollTo({ top: 0, behavior: "instant" });
});

initTheme();
render();
</script>
</body>
</html>
