<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drept civil C1–C7 · învață și exersează</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,600;1,400&family=Public+Sans:wght@400;600;700&display=swap">
<style>
:root{--bg:#f5f6f8;--sf:#fff;--ink:#16213a;--mut:#5b6478;--ln:#dde1ea;--ac:#2f4bd0;--hl:#ffe9a8;--good:#12805c;--gbg:#dff5ea;--bad:#c0392b;--bbg:#fde4e1;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--sf:#171e2e;--ink:#e8ecf5;--mut:#9aa5bd;--ln:#2a3349;--ac:#8aa0ff;--hl:#4a3f12;--good:#4fd1a1;--gbg:#10392c;--bad:#ff8a7a;--bbg:#41191a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1420;--sf:#171e2e;--ink:#e8ecf5;--mut:#9aa5bd;--ln:#2a3349;--ac:#8aa0ff;--hl:#4a3f12;--good:#4fd1a1;--gbg:#10392c;--bad:#ff8a7a;--bbg:#41191a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 "Public Sans",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--sf);border-bottom:1px solid var(--ln);padding:10px 16px 0}
header h1{font:600 20px "Newsreader",serif;margin:0 0 6px}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav button{border:0;background:none;color:var(--mut);font:600 14px inherit;font-family:inherit;padding:8px 12px;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer}
nav button.on{color:var(--ac);border-color:var(--ac)}
main{max-width:860px;margin:0 auto;padding:20px 16px 60px}
h2,h3{font-family:"Newsreader",serif;line-height:1.25}h2{font-size:28px;margin:8px 0 12px}h3{font-size:21px;margin:0 0 8px}
.muted{color:var(--mut)}
.card,section{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:16px;margin:0 0 14px}
.prose,section{font-family:"Newsreader",serif;font-size:18px;line-height:1.65}
.prose p,section p{margin:.4em 0}.prose ul,.prose ol,section ul,section ol{padding-left:1.3em;margin:.3em 0}
.trap{background:var(--hl);border-radius:6px;padding:4px 8px;list-style-position:inside}
.tw{overflow-x:auto;margin:10px 0}table{border-collapse:collapse;font:14px/1.45 "Public Sans",sans-serif;min-width:560px}
th,td{border:1px solid var(--ln);padding:6px 8px;text-align:left;vertical-align:top}th{background:var(--bg)}
.btn,.chip,.tab{font:600 14px "Public Sans",sans-serif;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--bg)}
.btn:focus-visible,.chip:focus-visible,.opt:focus-visible,nav button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}.tab.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.tag{font:600 12px "Public Sans";background:var(--hl);border-radius:5px;padding:2px 6px;margin-right:4px}
input[type=search],textarea{width:100%;font:16px "Public Sans",sans-serif;background:var(--sf);color:var(--ink);border:1px solid var(--ln);border-radius:8px;padding:10px;margin:0 0 12px}
textarea{min-height:110px;margin:12px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.grid .card{margin:0;cursor:pointer}
.card.ok{border-color:var(--good);background:var(--gbg)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}.cmp i{font-weight:600;color:var(--ac)}.cmp p{margin:2px 0;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:0 0 16px}.stats b{display:block;font:600 34px "Newsreader",serif}
.bar{height:8px;background:var(--ln);border-radius:4px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--good)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 14px}.chip{padding:4px 9px;min-width:38px}
.chip.cur{outline:2px solid var(--ac)}.chip.pick{background:var(--hl)}.chip.good{background:var(--gbg);border-color:var(--good)}.chip.bad{background:var(--bbg);border-color:var(--bad)}
.opt{display:flex;gap:12px;width:100%;text-align:left;font:16px/1.5 "Public Sans",sans-serif;background:var(--sf);color:var(--ink);border:2px solid var(--ln);border-radius:10px;padding:12px;margin:8px 0 0;cursor:pointer}
.opt b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:13px}
.opt.pick{border-color:var(--ac);background:var(--hl)}.opt.good{border-color:var(--good);background:var(--gbg)}.opt.bad{border-color:var(--bad);background:var(--bbg)}.opt.miss{border-color:var(--good);border-style:dashed}
.ex{font-size:14px;color:var(--mut);margin:4px 0 0 8px;padding-left:10px;border-left:3px solid var(--ln)}
.verdict{font-weight:700;padding:10px 12px;border-radius:8px;margin:14px 0 0}.verdict.good{background:var(--gbg);color:var(--good)}.verdict.bad{background:var(--bbg);color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 0}.sp{flex:1}
label.day{display:flex;gap:10px;align-items:flex-start;cursor:pointer}label.day input{margin-top:6px;width:18px;height:18px}
@media(max-width:560px){.cmp{grid-template-columns:1fr}h2{font-size:24px}}
@media(prefers-reduced-motion:no-preference){.bar i{transition:width .4s}}
</style>
