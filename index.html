<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drept civil – C1–C7 & Grile Examen</title>
<style>
:root{
  --bg:#fbfaf7;--fg:#1c1b19;--card:#fff;--bd:#e3dfd6;--ac:#2f5bd3;--ac-soft:#eef3ff;
  --mk:#fff0a8;--ok:#1f8a4c;--ok-soft:#eaf7ef;--no:#c0392b;--no-soft:#fdeeed;
  --mut:#6b6860;--warn:#b45309;--warn-soft:#fef3c7;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14161a;--fg:#e8e6e1;--card:#1d2026;--bd:#333843;--ac:#8fb0ff;--ac-soft:#1e2942;
    --mk:#5a4a12;--ok:#5cd08a;--ok-soft:#143020;--no:#ff8a7a;--no-soft:#381c1a;
    --mut:#9a978f;--warn:#fbbf24;--warn-soft:#3a2a0a;
    color-scheme:dark
  }
}
:root[data-theme="dark"]{
  --bg:#14161a;--fg:#e8e6e1;--card:#1d2026;--bd:#333843;--ac:#8fb0ff;--ac-soft:#1e2942;
  --mk:#5a4a12;--ok:#5cd08a;--ok-soft:#143020;--no:#ff8a7a;--no-soft:#381c1a;
  --mut:#9a978f;--warn:#fbbf24;--warn-soft:#3a2a0a;
  color-scheme:dark
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);border-bottom:1px solid var(--bd);padding:10px 14px 10px}
.head-top{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:820px;margin:0 auto 8px}
h1{font-size:17px;margin:0;line-height:1.25}
h2{font-size:19px;margin:14px 0 10px;line-height:1.3}
h3{font-size:16px;margin:14px 0 8px;line-height:1.35}
nav{display:flex;gap:6px;flex-wrap:wrap;max-width:820px;margin:0 auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
button{font:inherit;font-size:14px;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:7px 13px;cursor:pointer;transition:background .15s,border-color .15s,transform .06s;min-height:36px}
button:active{transform:scale(.98)}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
button:disabled{opacity:.65;cursor:default;transform:none}
.theme-btn{padding:6px 11px;font-size:13px;white-space:nowrap}
main{max-width:820px;margin:0 auto;padding:14px 14px 40px}

/* Cards & Typography */
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:12px 0}
.q{font-size:17px;font-weight:600;line-height:1.45}
.a{margin-top:12px;padding-top:12px;border-top:1px dashed var(--bd)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.row-between{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.mut{color:var(--mut);font-size:14px}
mark{background:var(--mk);color:inherit;border-radius:3px;padding:0 3px}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid var(--bd);background:var(--bg);color:var(--mut)}
.badge-speta{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.badge-ac{background:var(--ac-soft);color:var(--ac);border-color:var(--ac)}

/* Progress bar */
.bar{height:8px;background:var(--bd);border-radius:99px;overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .25s ease}

/* Grile Options */
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;border-radius:12px;padding:12px 14px;margin:8px 0;font-size:15px;line-height:1.45;background:var(--card);border:1.5px solid var(--bd)}
.opt-letter{flex:0 0 26px;height:26px;border-radius:8px;border:1.5px solid var(--bd);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;margin-top:1px;background:var(--bg)}
.opt.sel{border-color:var(--ac);background:var(--ac-soft)}
.opt.sel .opt-letter{background:var(--ac);color:#fff;border-color:var(--ac)}
.opt.ok-sel{border-color:var(--ok);background:var(--ok-soft);color:var(--fg)}
.opt.ok-sel .opt-letter{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.ok-miss{border:2px dashed var(--ok);background:var(--ok-soft);color:var(--fg)}
.opt.ok-miss .opt-letter{border-color:var(--ok);color:var(--ok);background:var(--card)}
.opt.no-sel{border-color:var(--no);background:var(--no-soft);color:var(--fg)}
.opt.no-sel .opt-letter{background:var(--no);color:#fff;border-color:var(--no)}
.verdict{padding:10px 14px;border-radius:10px;font-weight:600;margin:12px 0 10px;font-size:15px}
.verdict.v-ok{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok)}
.verdict.v-no{background:var(--no-soft);color:var(--no);border:1px solid var(--no)}
.exp-box{margin-top:10px;padding-top:10px;border-top:1px dashed var(--bd)}
.exp-item{margin:7px 0;font-size:14.5px;line-height:1.5;padding:7px 10px;border-radius:8px;background:var(--bg);border-left:3px solid var(--bd)}
.exp-item.exp-ok{border-left-color:var(--ok)}
.exp-item.exp-no{border-left-color:var(--no)}
.btn-primary{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
.ok{border-color:var(--ok);color:var(--ok)}
.no{border-color:var(--no);color:var(--no)}

/* Tree schemes */
.tree>ul{list-style:none;margin:0;padding:0}
.tree>ul>li{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:10px;padding:10px 12px;margin:10px 0}
.tree ul ul{list-style:none;margin:8px 0 2px;padding-left:12px;border-left:2px solid var(--bd)}
.tree ul ul li{margin:5px 0;font-size:15px}
.tree ul ul li::before{content:"→ ";color:var(--ac)}

/* Tables & Details */
.wrap{overflow-x:auto;margin:10px 0;border-radius:10px;border:1px solid var(--bd)}
table{width:100%;border-collapse:collapse;font-size:14.5px;background:var(--card)}
td,th{border-bottom:1px solid var(--bd);border-right:1px solid var(--bd);padding:8px 10px;vertical-align:top;text-align:left}
td:last-child,th:last-child{border-right:none}
tr:last-child td{border-bottom:none}
th{background:var(--bg);font-weight:600}
details{background:var(--card);border:1px solid var(--bd);border-radius:10px;margin:8px 0;padding:0 12px}
summary{cursor:pointer;padding:10px 0;font-size:15px}
.df{padding:10px 0 12px;border-top:1px dashed var(--bd);font-size:15px}

/* Aprofundare callouts & visual steps */
.callout{background:var(--warn-soft);border:1px solid var(--warn);border-radius:10px;padding:11px 13px;margin:10px 0;font-size:14.5px}
.callout b{color:var(--warn)}
.steps{display:grid;gap:8px;margin:10px 0}
.step{background:var(--bg);border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:10px;padding:9px 12px;font-size:14.5px}
.scale-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin:10px 0}
.scale-item{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;font-size:13.5px}
.scale-item strong{display:block;margin-bottom:4px;font-size:14px}
.q-dots{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0}
.q-dot{width:28px;height:28px;padding:0;min-height:28px;border-radius:8px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.q-dot.cur{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac-soft)}
.q-dot.d-ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.q-dot.d-no{background:var(--no-soft);color:var(--no);border-color:var(--no)}
</style>
</head>
<body>
<header>
  <div class="head-top">
    <h1>⚖️ Drept civil – C1–C7 &amp; Grile Examen</h1>
    <button id="themeBtn" class="theme-btn" type="button" aria-label="Schimbă tema">🌙 Mod</button>
  </div>
  <nav id="nav"></nav>
</header>
<main id="app"></main>

<script>
/* ====== HELPERS ====== */
const m = s => s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/==(.+?)==/g, "<mark>$1</mark>");
const T = a => "<ul>" + a.map(x => Array.isArray(x) ? "<li>" + m(x[0]) + (x[1] && x[1].length ? T(x[1]) : "") + "</li>" : "<li>" + m(x) + "</li>").join("") + "</ul>";
const sh = a => a.map(x => [Math.random(), x]).sort((x, y) => x[0] - y[0]).map(x => x[1]);

/* ====== THEME ====== */
const $root = document.documentElement;
const $themeBtn = document.getElementById("themeBtn");
let savedTheme = "";
try { savedTheme = localStorage.getItem("civTheme") || ""; } catch(e) {}
function applyTheme(t) {
  if (t === "dark" || t === "light") $root.setAttribute("data-theme", t);
  else $root.removeAttribute("data-theme");
  const isDark = t === "dark" || (!t && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  $themeBtn.textContent = isDark ? "☀️ Luminos" : "🌙 Întunecat";
}
applyTheme(savedTheme);
$themeBtn.addEventListener("click", () => {
  const isDark = $root.getAttribute("data-theme") === "dark" || (!$root.getAttribute("data-theme") && window.matchMedia("(prefers-color-scheme: dark)").matches);
  savedTheme = isDark ? "light" : "dark";
  try { localStorage.setItem("civTheme", savedTheme); } catch(e) {}
  applyTheme(savedTheme);
});

/* ====== DATA: 30 GRILE EXAMEN (BAROU/INM) ====== */
const GRILE = [

[3,"HG, ordonanță simplă, OUG","**HG**: organizarea executării legilor. **Ordonanță simplă**: în baza unei legi de abilitare, în domenii care nu țin de legile organice. **OUG**: numai în situații extraordinare, cu motivarea urgenței."],

[3,"Codul civil","Codicele civil (1864, în vigoare 1865, după Codul Napoleon). Codul actual: Legea 287/2009, în vigoare la 1 octombrie 2011; Titlul preliminar (art. 1–24) + 7 cărți."],
[4,"Aplicarea legii civile","Transpunerea în practică, în raporturi concrete, a regulilor din norma civilă; se face sub 3 aspecte: în timp, în spațiu, cu privire la persoane."],
[4,"Intrarea în vigoare","Lege și ordonanță simplă: la 3 zile calendaristice de la publicare (expiră la 24:00) sau la dată ulterioară din text. OUG: la publicare, sub condiția depunerii prealabile la Cameră. Alte acte: la publicare."],
[4,"Abrogarea","Ieșirea legii din vigoare. Expresă (legea nouă numește legea veche) sau tacită (reguli incompatibile); totală sau parțială. Definitivă (art. 64 L. 24/2000). Desuetudinea nu abrogă."],
[4,"Neretroactivitatea","Legea dispune numai pentru viitor (art. 15 alin. 2 Constituție; art. 6 alin. 1 C.civ.) și nu poate reglementa relații născute, modificate sau stinse înainte. Excepție: legea penală sau contravențională mai favorabilă."],
[4,"Aplicarea imediată; ultraactivitatea","**Aplicarea imediată**: legea nouă se aplică de îndată situațiilor ivite după intrarea ei și efectelor lor (art. 6 alin. 5–6). **Ultraactivitatea**: supraviețuirea vremelnică a legii vechi, aplicată situațiilor în curs; excepție de la aplicarea imediată."],
[4,"Art. 6 alin. (2)–(4)","Actele și faptele juridice, actele nule sau anulabile, prescripțiile, decăderile și uzucapiunile începute și neîmplinite rămân supuse **legii vechi**."],
[4,"Legea civilă în spațiu","Intern (art. 7): actele centrale se aplică pe tot teritoriul, cele locale doar în raza lor. Internațional: la raporturile cu element de extraneitate se aplică normele conflictuale (art. 8; Cartea a VII-a); prioritate au tratatele și dreptul UE."],

[4,"Rezultatul și metodele interpretării","Literală (textul și situațiile coincid); extensivă (sens mai larg, nu la enumerări limitative și excepții); restrictivă (arie mai îngustă). Metode: gramaticală; logică (per a contrario, analogie, a fortiori, reducerea la absurd); sistematică; istorică; teleologică. Art. 10: limita analogiei."],
[5,"Raportul juridic civil","Relație socială, patrimonială sau nepatrimonială, reglementată de norma de drept civil, în care părțile sunt pe poziție de egalitate juridică. Caractere: social, volițional (simplu sau dublu), egalitate."],
[5,"Izvorul raportului concret","Faptul juridic lato sensu: faptele, evenimentele sau acțiunile de care legea civilă leagă nașterea, modificarea sau stingerea unui raport juridic civil concret. Nu se confundă cu izvoarele dreptului civil."],
[5,"Act juridic / fapt juridic","**Act**: acțiune omenească cu intenția de a produce efecte juridice (contract, testament). **Fapt** (stricto sensu): acțiune fără acea intenție, ale cărei efecte vin din lege (distrugerea bunului), plus evenimentele."],
[5,"Fapte licite și ilicite","**Licite**: gestiunea de afaceri (art. 1330–1340), plata nedatorată (1341–1344), îmbogățirea fără justă cauză (1345–1348). **Ilicit**: acțiune cu încălcarea legii (delict civil)."],
[5,"Elementele raportului; determinarea subiectelor","Cumulativ: **părțile**, **conținutul** (drepturi și obligații corelative), **obiectul** (conduita). Drepturi **absolute**: activ determinat, pasiv nedeterminat. **Relative**: activ și pasiv determinați."],
[5,"Pluralitatea subiectelor","Activă, pasivă sau mixtă. Coproprietate (cote ideale, art. 634) / devălmășie (fără cote, art. 667). Obligații: conjunctă (divizibilă, regula art. 1424), solidară (oricare cere sau plătește tot), indivizibilă (obiect indivizibil)."],
[5,"Schimbarea creditorului (CSN)","**Cesiunea de creanță** (art. 1566–1592): creditorul transmite creanța unei alte persoane. **Subrogația personală** (1593–1598): terțul plătește și devine creditor. **Novația** (1609): vechea obligație se stinge, e înlocuită cu una nouă."],
[5,"Schimbarea debitorului (NPSP)","Novația prin schimbare de debitor (art. 1609 alin. 2); preluarea de datorie (1599–1608); stipulația pentru altul (1284); poprirea (creditorul urmărește sumele pe care un terț le datorează debitorului său)."],
[5,"Capacitatea civilă","Aptitudinea generală de a fi titular de drepturi și obligații civile. **De folosință** (art. 34): de a avea drepturi și obligații. **De exercițiu** (art. 37): de a încheia singur acte juridice civile."],
[5,"Capacitatea de exercițiu a persoanei fizice","**Deplină**: la 18 ani (art. 38), minorul căsătorit, la 16 ani cu instanța de tutelă (art. 39–40). **Restrânsă** (art. 41): 14–18 ani, consilierea judiciară; actele cu încuviințare prealabilă. **Lipsă** (art. 43): sub 14 ani, tutela specială; actele prin reprezentant legal."],
[5,"Persoana juridică (art. 187)","Colectivitate cu organizare de sine stătătoare, patrimoniu propriu, afectat unui scop licit și moral, în acord cu interesul general. Folosință de la înregistrare (art. 205); specialitate doar la cele fără scop lucrativ (art. 206 alin. 2); exercițiu prin organele de administrare (art. 209)."],
[6,"Dreptul subiectiv civil","Posibilitatea subiectului activ, recunoscută de dreptul civil obiectiv, de a avea, în limitele legii, o anumită conduită și de a pretinde subiectului pasiv să dea, să facă sau să nu facă ceva, la nevoie cu forța coercitivă a statului. Nu se confundă cu exercițiul lui."],
[6,"Drept absolut / relativ","**Absolut**: titularul îl exercită singur; subiect pasiv nedeterminat (toți ceilalți), obligație negativă generală, erga omnes (drepturile reale și nepatrimoniale). **Relativ**: creditorul cere debitorului; ambii determinați; inter partes."],
[6,"Dreptul real (jus in re)","Drept patrimonial în virtutea căruia titularul își exercită atributele (posesia, folosința, dispoziția) asupra unui bun, direct și nemijlocit. Absolut, limitat ca număr (art. 551). Prerogative: **urmărire** și **preferință**."],
[6,"Dreptul de creanță (jus ad personam)","Drept patrimonial prin care creditorul poate pretinde debitorului să dea, să facă sau să nu facă ceva. Relativ, nelimitat ca număr; izvor: act juridic sau fapt juridic licit ori ilicit."],
[6,"Dreptul potestativ","Puterea titularului de a influența unilateral și discreționar o situație juridică preexistentă (o modifică, o stinge sau creează alta). Drept de opțiune; categorie intermediară (nici real, nici de creanță)."],
[6,"Drepturi nepatrimoniale","Fără conținut economic, necesibile, exercitate doar personal. 3 categorii: existența și integritatea; identificarea; creația intelectuală. Art. 58: drepturile personalității."],
[6,"Drept principal / accesoriu","Principal: existență de sine stătătoare. Accesoriu: soarta lui depinde de a principalului (accesorium sequitur principale): ipoteca, gajul, clauza penală, arvuna, fideiusiunea."],
[6,"Drept pur și simplu / afectat de modalități","Pur și simplu: efecte imediat, definitiv, irevocabil. Afectat: existența sau exercițiul depind de un eveniment viitor (termen, condiție, sarcină)."],
[6,"Abuzul de drept (art. 15)","Exercitarea unui drept în scopul de a vătăma sau păgubi pe altul ori într-un mod excesiv și nerezonabil, contrar bunei-credințe. Privește exercițiul, nu existența dreptului. Sancțiuni: refuzul concursului statului; despăgubiri."],
[6,"Obligația civilă","Îndatorirea subiectului pasiv de a avea o conduită corespunzătoare dreptului corelativ (a da, a face, a nu face), care poate fi impusă prin constrângere. Sensuri: îndatorirea; raportul obligațional; înscrisul constatator."],
[6,"A da / a face / a nu face","**A da**: a constitui sau transmite un drept real. **A face**: orice prestație pozitivă (predarea bunului vândut). **A nu face**: abținere."],
[6,"De rezultat / de mijloace (art. 1481)","**Rezultat**: debitorul trebuie să procure rezultatul promis. **Mijloace**: debitorul depune toată diligența, fără a garanta rezultatul (medicul)."],
[6,"Scriptae in rem / propter rem","**Scriptae in rem**: obligație opozabilă și terților, legată de posesia lucrului (art. 1811). **Propter rem**: revine deținătorului unui bun, ca accesoriu al unui drept real."],
[6,"Obligație perfectă / naturală","Perfectă: executarea poate fi cerută cu forța statului. Naturală (imperfectă): nu se poate executa silit, dar plata făcută de bunăvoie nu se restituie (art. 2506 alin. 3)."],
[6,"Obiectul raportului juridic","Conduita părților: acțiunea sau inacțiunea la care e îndreptățit subiectul activ și de care e ținut cel pasiv. Nu se confundă cu conținutul (drepturile și obligațiile)."],
[7,"Bun (art. 535)","Lucrurile, corporale sau necorporale, care constituie obiectul unui drept patrimonial. Stricto sensu: doar lucrurile; lato sensu: și drepturile privitoare la ele."],
[7,"Patrimoniu (art. 31 alin. 1)","Totalitatea drepturilor și datoriilor evaluabile în bani ale unei persoane: latura activă (drepturi) și pasivă (obligații). Universalitate juridică."],
[7,"Universalitate de fapt (art. 541)","Ansamblul bunurilor care aparțin aceleiași persoane și au o destinație comună stabilită prin voința ei sau prin lege; pot fi și separat obiect de acte juridice."],
[7,"Corporal / necorporal","Corporale: existență materială, percepute de simțuri. Necorporale: existență abstractă (creanțe, acțiuni, părți sociale, drepturi intelectuale)."],
[7,"Bunuri imobile","Prin natură (art. 537): terenuri, construcții, plantații, tot ce e încorporat permanent. Prin destinație (art. 538). Prin obiectul la care se aplică (art. 542 alin. 1): drepturile reale asupra imobilelor."],
[7,"Bunuri mobile","Prin natură (art. 539): tot ce legea nu consideră imobil, energia, undele. Prin anticipație (art. 540): imobile tratate ca mobile în vederea detașării. Prin determinarea legii (art. 542 alin. 2): creanțe, drepturi reale asupra mobilelor, titluri, drepturi intelectuale."],
[7,"Fungibil / nefungibil (art. 543)","Fungibile: determinabile după număr, măsură sau greutate, înlocuibile în executarea unei obligații. Nefungibile: nu pot fi înlocuite; debitorul se liberează doar dând bunul datorat."],
[7,"Consumptibil; divizibil (art. 544–545)","**Consumptibil**: bun mobil a cărui folosire obișnuită implică consumarea sau înstrăinarea substanței. **Divizibil**: poate fi împărțit în natură fără a-și schimba destinația. Contrariile: neconsumptibil, indivizibil."],
[7,"Principal / accesoriu (art. 546)","Accesoriu: destinat stabil și exclusiv întrebuințării economice a altui bun, cât timp satisface această utilizare; destinația o stabilește proprietarul ambelor bunuri. Urmează soarta principalului."],
[7,"Circuit civil","Bunurile în circuit pot fi dobândite și înstrăinate liber (unele cu restricții). Cele scoase din circuit sunt inalienabile (art. 136 alin. 3 Constituție); actul de vânzare e nul absolut."],
[7,"Cert / de gen","Cert (res certa): individualizat prin însușiri proprii. De gen (res genera): privit prin caracterele categoriei, individualizat prin numărare, măsurare, cântărire. Proprietatea trece la acord (cert) sau la individualizare (de gen, art. 1273)."],
[7,"Fructe și producte (art. 548–549)","Fructe: produse care derivă din folosirea bunului, fără diminuarea substanței (naturale, industriale, civile). Producte: obținute cu consumarea sau diminuarea substanței."],
[7,"Sesizabil / insesizabil","Sesizabile: pot fi urmărite silit (regula). Insesizabile: doar în cazurile legii (art. 727 CPC; bunurile proprietate publică, art. 861 C.civ.)."]
];

/* ====== STATE & STORAGE ====== */
let K = {};
let G_STATE = { wrong: {}, ok: {} };
try { K = JSON.parse(localStorage.getItem("civK") || "{}"); } catch(e) {}
try { G_STATE = JSON.parse(localStorage.getItem("civGrile") || '{"wrong":{},"ok":{}}'); } catch(e) {}
const svK = () => { try { localStorage.setItem("civK", JSON.stringify(K)); } catch(e) {} };
const svG = () => { try { localStorage.setItem("civGrile", JSON.stringify(G_STATE)); } catch(e) {} };

let v = "g"; // Default active tab: Grile Examen (30)
let modIdx = 0, ci = 0, dd = 0;
let F = { c: 0, u: 0, i: 0, s: 0 };
let G = { filter: "ALL", testMode: false, list: [], idx: 0, sel: [], checked: false, sessionAns: {} };

function buildGrileList() {
  let arr = GRILE.slice();
  if (G.testMode) {
    arr = sh(arr).slice(0, 10);
  } else if (G.filter === "WRONG") {
    arr = arr.filter(x => G_STATE.wrong[x.id]);
  } else if (G.filter !== "ALL") {
    arr = arr.filter(x => x.blk === G.filter);
  }
  G.list = arr;
  G.idx = 0;
  G.sel = [];
  G.checked = false;
  G.sessionAns = {};
}
buildGrileList();

const NAV = [
  ["g", "Grile Examen (30)"],
  ["a", "Aprofundare"],
  ["s", "Scheme"],
  ["d", "Definiții"],
  ["p", "Perechi"],
  ["f", "Fișe"],
  ["z", "Plan"]
];
const LETTERS = ["A", "B", "C"];
function deck() { return CA.map((c, i) => i).filter(i => (!F.c || CA[i][0] == F.c) && (!F.u || !K[i])); }

/* ====== RENDER ====== */
const $nav = document.getElementById("nav"), $app = document.getElementById("app");
function render() {
  $nav.innerHTML = NAV.map(n => `<button data-a="v" data-v="${n[0]}" class="${v === n[0] ? "on" : ""}">${n[1]}</button>`).join("");
  let h = "";

  /* TAB 1: GRILE EXAMEN */
  if (v === "g") {
    const wrongCount = Object.keys(G_STATE.wrong).length;
    const answeredCount = Object.keys(G.sessionAns).length;
    const scoreCount = Object.values(G.sessionAns).filter(x => x.isOk).length;
    const total = G.list.length;

    h += `<div class="chips">
      <button data-a="gf" data-v="ALL" class="${!G.testMode && G.filter === "ALL" ? "on" : ""}">Toate (30)</button>
      <button data-a="gf" data-v="A" class="${!G.testMode && G.filter === "A" ? "on" : ""}">A · Legea civilă (1–8)</button>
      <button data-a="gf" data-v="B" class="${!G.testMode && G.filter === "B" ? "on" : ""}">B · Persoane (9–17)</button>
      <button data-a="gf" data-v="C" class="${!G.testMode && G.filter === "C" ? "on" : ""}">C · Drepturi &amp; Obligații (18–23)</button>
      <button data-a="gf" data-v="D" class="${!G.testMode && G.filter === "D" ? "on" : ""}">D · Bunuri (24–30)</button>
      <button data-a="gf" data-v="WRONG" class="${!G.testMode && G.filter === "WRONG" ? "on" : ""}">Doar greșite (${wrongCount})</button>
      <button data-a="gt" class="${G.testMode ? "on" : ""}">🎲 Mod Test (10 aleatorii)</button>
      <button data-a="gr">Reset progres</button>
    </div>`;

    if (!total) {
      h += `<div class="card"><div class="q">Nicio grilă greșită salvată 🎉</div><p class="mut">Toate grilele rezolvate sunt corecte sau nu ai marcat încă erori. Alege „Toate (30)” sau „Mod Test (10 aleatorii)”.</p></div>`;
    } else {
      const cur = G.list[G.idx];
      const savedAns = G.sessionAns[cur.id];
      const isChecked = !!savedAns;
      const sel = isChecked ? savedAns.sel : G.sel;

      h += `<div class="row-between mut">
        <span>Grila <b>${G.idx + 1} / ${total}</b> (nr. ${cur.id}) · Bloc ${cur.blk}</span>
        <span>Scor sesiune: <b>${scoreCount} / ${answeredCount}</b></span>
      </div>
      <div class="bar"><i style="width:${total ? (answeredCount / total * 100) : 0}%"></i></div>`;

      h += `<div class="q-dots">${G.list.map((item, i) => {
        const sa = G.sessionAns[item.id];
        const cls = (i === G.idx ? "cur " : "") + (sa ? (sa.isOk ? "d-ok" : "d-no") : "");
        return `<button class="q-dot ${cls}" data-a="gj" data-v="${i}">${item.id}</button>`;
      }).join("")}</div>`;

      h += `<div class="card">
        <div class="row-between" style="margin-bottom:8px">
          <span class="badge badge-ac">1 sau 2 răspunsuri corecte</span>
          ${cur.speta ? `<span class="badge badge-speta">⚖️ Mini-speță</span>` : ""}
        </div>
        <div class="q">${cur.id}. ${cur.q}</div>
        <div style="margin-top:10px">
          ${cur.opts.map((txt, i) => {
            let cls = "opt";
            const isSel = sel.includes(i);
            const isCor = cur.cor.includes(i);
            if (!isChecked) {
              if (isSel) cls += " sel";
            } else {
              if (isCor && isSel) cls += " ok-sel";
              else if (isCor && !isSel) cls += " ok-miss";
              else if (!isCor && isSel) cls += " no-sel";
            }
            return `<button class="${cls}" data-a="go" data-v="${i}" ${isChecked ? "disabled" : ""}>
              <span class="opt-letter">${LETTERS[i]}</span>
              <span>${txt}</span>
            </button>`;
          }).join("")}
        </div>`;

      if (!isChecked) {
        h += `<div class="row-between" style="margin-top:14px">
          <span class="mut">${sel.length ? "Selectat: " + sel.slice().sort().map(i => LETTERS[i]).join(", ") : "Selectează 1 sau 2 variante"}</span>
          <button class="btn-primary" data-a="gc" ${sel.length === 0 ? "disabled" : ""}>Verifică răspunsul</button>
        </div>`;
      } else {
        const corStr = cur.cor.map(i => LETTERS[i]).join(", ");
        h += `<div class="verdict ${savedAns.isOk ? "v-ok" : "v-no"}">
          ${savedAns.isOk ? "Corect! 🎉" : `Greșit — Răspuns corect: ${corStr}`}
        </div>
        <div class="exp-box">
          <div class="mut" style="margin-bottom:6px"><b>Explicații detaliate (toate variantele):</b></div>
          ${cur.exp.map((ex, i) => {
            const isCor = cur.cor.includes(i);
            return `<div class="exp-item ${isCor ? "exp-ok" : "exp-no"}"><b>${LETTERS[i]} (${isCor ? "Corect" : "Greșit"}):</b> ${ex}</div>`;
          }).join("")}
        </div>`;
      }

      h += `<div class="row-between" style="margin-top:14px">
        <button data-a="gp" ${G.idx === 0 ? "disabled" : ""}>← Înapoi</button>
        <button class="${isChecked && G.idx < total - 1 ? "btn-primary" : ""}" data-a="gn" ${G.idx >= total - 1 ? "disabled" : ""}>Următoarea →</button>
      </div></div>`;
    }
  }

  /* TAB 2: APROFUNDARE */
  if (v === "a") {
    h += `<div class="chips">${MODS.map((md, i) => `<button data-a="am" data-v="${i}" class="${modIdx === i ? "on" : ""}">Modul ${i + 1}</button>`).join("")}</div>
    <h2>${MODS[modIdx].t}</h2>${MODS[modIdx].html}`;
  }

  /* TAB 3: SCHEME */
  if (v === "s") {
    h = `<div class="chips">${SC.map((s, i) => `<button data-a="c" data-v="${i}" class="${ci === i ? "on" : ""}">C${i + 1}</button>`).join("")}</div>
    <h2>${SC[ci][0]}</h2><div class="tree">${T(SC[ci][1])}</div>
    <p class="mut">Galbenul = ce trebuie ținut minte. Acoperă schema și refă-o din memorie.</p>`;
  }

  /* TAB 4: DEFINITII */
  if (v === "d") {
    h = `<div class="chips">
      <button data-a="dd" data-v="0" class="${!dd ? "on" : ""}">Toate</button>
      ${[1,2,3,4,5,6,7].map(i => `<button data-a="dd" data-v="${i}" class="${dd === i ? "on" : ""}">C${i}</button>`).join("")}
      <button data-a="da">Deschide tot</button><button data-a="dx">Închide tot</button>
    </div>
    <p class="mut">Spune definiția cu voce tare, apoi deschide termenul și compar-o cu cea de aici.</p>
    ${DEF.filter(d => !dd || d[0] === dd).map(d => `<details><summary><b>${d[1]}</b> <span class="mut">C${d[0]}</span></summary><div class="df">${m(d[2])}</div></details>`).join("")}`;
  }

  /* TAB 5: PERECHI */
  if (v === "p") {
    h = `<p class="mut">Cele mai întrebate perechi. Spune cu voce tare diferența înainte să te uiți la a treia coloană.</p>
    <div class="wrap"><table><tr><th>A</th><th>B</th><th>Diferența</th></tr>${PA.map(p => `<tr><td><b>${p[0]}</b></td><td><b>${p[1]}</b></td><td>${p[2]}</td></tr>`).join("")}</table></div>`;
  }

  /* TAB 6: FISE */
  if (v === "f") {
    const d = deck(), kn = Object.keys(K).length, pos = d.length ? F.i % d.length : 0, cur = d[pos];
    h = `<div class="chips">
      <button data-a="fc" data-v="0" class="${!F.c ? "on" : ""}">Toate</button>
      ${[1,2,3,4,5,6,7].map(i => `<button data-a="fc" data-v="${i}" class="${F.c === i ? "on" : ""}">C${i}</button>`).join("")}
      <button data-a="fu" class="${F.u ? "on" : ""}">Doar „Încă nu”</button>
      <button data-a="fr">Reset</button>
    </div>
    <div class="mut">Știu <b>${kn}</b> din ${CA.length}</div>
    <div class="bar"><i style="width:${kn / CA.length * 100}%"></i></div>`;
    if (!d.length) h += `<div class="card">Nicio fișă aici. Toate sunt marcate „Știu” 🎉</div>`;
    else h += `<div class="card"><div class="mut">C${CA[cur][0]} · ${pos + 1}/${d.length}</div><div class="q">${CA[cur][1]}</div>${F.s ? `<div class="a">${CA[cur][2]}</div><div class="row"><button class="ok" data-a="k" data-v="${cur}">Știu</button><button class="no" data-a="n" data-v="${cur}">Încă nu</button></div>` : `<div class="row"><button class="btn-primary" data-a="s">Arată răspunsul</button></div>`}</div>`;
  }

  /* TAB 7: PLAN + METODA DE ANTRENAMENT */
  if (v === "z") {
    h = `<h2>📅 Plan de 7 zile</h2>
    <p class="mut">Câte o parte pe zi, 40–60 de minute. Regula: în fiecare zi, 10 minute din ce ai făcut ieri, din memorie.</p>
    ${PLAN.map(p => `<div class="card" style="padding:12px 14px;margin:8px 0">${p}</div>`).join("")}
    <h2>🎯 Metodă practică de antrenament pentru examen</h2>
    <div class="steps">
      <div class="step"><b>1. Disecția prin 6 întrebări-cheie:</b> Pentru fiecare instituție (ex. tutela specială, art. 6, bunul accesoriu), verifică fără cod: (i) ipoteza, (ii) condițiile cumulative/alternative, (iii) excepții/limite, (iv) cine invocă/constată, (v) efectul/sancțiunea, (vi) cu ce se confundă.</div>
      <div class="step"><b>2. Separă „ghicit” de „justificat”:</b> Nu te mulțumi cu scorul; dacă nu poți indica regula care infirmă varianta falsă, tratează grila ca greșită.</div>
      <div class="step"><b>3. Retestare spațiată (48h &amp; 7 zile):</b> Reia filtrul „Doar greșite” și schimbă mental un detaliu din mini-spețe (ex. la Grila 13: ce se întâmplă dacă minorul folosea manopere dolosive?).</div>
    </div>
    <div class="callout">
      <b>🚨 Radarul celor 5 cuvinte-capcană în examen:</b><br>
      1. <b>„și” vs. „ori”</b> (ex. abuzul de drept, art. 15 — condiții alternative);<br>
      2. <b>Tipul nulității</b> (absolută la art. 66, 206, 207 vs. relativă la art. 44);<br>
      3. <b>Prezumții</b> (se prezumă vs. nu se prezumă: art. 13, 14, 17, 21);<br>
      4. <b>Organul competent</b> (instanța de tutelă vs. notarul public la art. 40 și Legea 140/2022);<br>
      5. <b>Adverbe absolute</b> („numai”, „niciodată”, „în toate cazurile”).
    </div>`;
  }

  $app.innerHTML = h;
}

/* ====== EVENTS ====== */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-a]");
  if (!b) return;
  const a = b.dataset.a, x = b.dataset.v;

  if (a === "v") { v = x; window.scrollTo({ top: 0 }); }
  /* Grile events */
  if (a === "gf") { G.testMode = false; G.filter = x; buildGrileList(); }
  if (a === "gt") { G.testMode = !G.testMode; buildGrileList(); }
  if (a === "gr") { G_STATE = { wrong: {}, ok: {} }; svG(); buildGrileList(); }
  if (a === "gj") { G.idx = +x; G.sel = []; }
  if (a === "go") {
    const idx = +x;
    const pos = G.sel.indexOf(idx);
    if (pos >= 0) G.sel.splice(pos, 1);
    else if (G.sel.length < 2) G.sel.push(idx);
    else { G.sel.shift(); G.sel.push(idx); }
  }
  if (a === "gc") {
    const cur = G.list[G.idx];
    const selSorted = G.sel.slice().sort();
    const corSorted = cur.cor.slice().sort();
    const isOk = selSorted.length === corSorted.length && selSorted.every((val, i) => val === corSorted[i]);
    G.sessionAns[cur.id] = { sel: selSorted, isOk };
    if (isOk) { G_STATE.ok[cur.id] = 1; delete G_STATE.wrong[cur.id]; }
    else { G_STATE.wrong[cur.id] = 1; delete G_STATE.ok[cur.id]; }
    svG();
  }
  if (a === "gp" && G.idx > 0) { G.idx--; G.sel = []; window.scrollTo({ top: 0 }); }
  if (a === "gn" && G.idx < G.list.length - 1) { G.idx++; G.sel = []; window.scrollTo({ top: 0 }); }

  /* Aprofundare / Scheme / Definitii / Fise */
  if (a === "am") { modIdx = +x; window.scrollTo({ top: 0 }); }
  if (a === "c") ci = +x;
  if (a === "dd") dd = +x;
  if (a === "da") { document.querySelectorAll("details").forEach(d => d.open = true); return; }
  if (a === "dx") { document.querySelectorAll("details").forEach(d => d.open = false); return; }
  if (a === "fc") { F.c = +x; F.i = 0; F.s = 0; }
  if (a === "fu") { F.u = F.u ? 0 : 1; F.i = 0; F.s = 0; }
  if (a === "fr") { K = {}; svK(); F.i = 0; F.s = 0; }
  if (a === "s") F.s = 1;
  if (a === "k") { K[x] = 1; svK(); F.s = 0; if (!F.u) F.i++; }
  if (a === "n") { delete K[x]; svK(); F.s = 0; F.i++; }

  render();
});

render();
</script>
</body>
</html>
